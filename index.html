  }
  else if (act === 'mark-next') {
    e.stopPropagation();
    const target = state.series.find(x => x.uuid === el.dataset.uuid);
    if (target) {
      const snap = etatSerie(target);
      const avant = progress(target).watched;
      const nx = nextUnwatched(target);
      const zone = el.getBoundingClientRect(); // le bouton disparaît au rafraîchissement : on garde sa place
      const ep = await markNext(target);
      if (!ep) return;
      if (navigator.vibrate) navigator.vibrate(12);
      // Accueil : le carrousel reste sur cette série, qui affiche son nouvel épisode
      if (!el.dataset.stay && state.tab === 'home') carrouselUuid = carrouselAnim = target.uuid;
      el.dataset.stay ? renderDetail() : render();
      eclat(zone);
      const undo = () => restaurerSerie(snap);
      if (!feteSiTerminee(target, avant, undo)) proposerAnnulation(`${target.title} · ${epCode(nx.season, ep.number)} vu ✓`, undo);
    }
  }
  else if (act === 'toggle-movie') {
    e.stopPropagation();
    const m = state.movies.find(x => x.uuid === el.dataset.uuid);
    if (m) {
      const snap = etatFilm(m);
      await toggleMovieWatched(m);
      proposerAnnulation(m.is_watched ? `« ${m.title} » vu ✓` : `« ${m.title} » remis dans À voir`, () => restaurerFilm(snap));
      const card = el.closest('.mcard, .cesoir');
      if (card && card.classList.contains('cesoir')) ceSoirAnim = true; // un autre film prend la place
      if (m.is_watched) { tracer(el); eclat(el); }
      if (m.is_watched && navigator.vibrate) navigator.vibrate(12);
      // si le film ne correspond plus à la liste affichée, il la quitte
      // en fondu (le défilement est conservé par render())
      const f = state.movieFilter;
      const quitteLaListe = state.tab === 'movies' && !state.movieSearch && (
        (state.movieView === 'avoir' && m.is_watched) ||
        (state.movieView === 'grid' && ((f === 'vus' && !m.is_watched) || (f === 'avoir' && m.is_watched))));
      if (quitteLaListe && card) {
        card.style.transition = 'opacity .25s ease, transform .25s ease';
        card.style.opacity = '0';
        card.style.transform = 'scale(.85)';
        setTimeout(render, 260);
      } else if (card) {
        // sinon mise à jour sur place, sans toucher à l'ordre de la liste
        card.classList.toggle('watched', m.is_watched);
        el.title = m.is_watched ? 'Vu' : 'Marquer vu';
        if (m.is_watched) el.style.animation = 'pop .3s ease';
      }
    }
  }
  else if (act === 'toggle-ep' && s) {
    const snap = etatSerie(s);
    const avant = progress(s).watched;
    const special = el.dataset.special === '1';
    const ep = await toggleEpisode(s, +el.dataset.season, +el.dataset.ep, special);
    if (!ep) return;
    renderDetail();
    const row = document.querySelector(`.eprow[data-season="${el.dataset.season}"][data-ep="${el.dataset.ep}"]${special ? '[data-special="1"]' : ':not([data-special])'}`);
    if (row && row.classList.contains('watched')) {
      const coche = row.querySelector('.epcheck');
      row.classList.add('flash');
      coche.style.animation = 'pop .3s ease';
      tracer(coche);
      eclat(coche);
      if (navigator.vibrate) navigator.vibrate(12);
    }
    const code = special ? `Spécial ${ep.number}` : epCode(+el.dataset.season, ep.number);
    const undo = () => restaurerSerie(snap);
    if (!feteSiTerminee(s, avant, undo)) proposerAnnulation(ep.is_watched ? `${code} vu ✓` : `${code} marqué non vu`, undo, 4000);
  }
  else if (act === 'open-ep' && s) openEpisodeModal(s.uuid, +el.dataset.season, +el.dataset.ep, el.dataset.special === '1');
  else if (act === 'vu-quand') appliquerVu(el.dataset.when);
  else if (act === 'vu-pick') {
    // sélecteur de date natif (appelé pendant le geste de l'utilisateur, sinon refusé)
    const i = $('#vu-date');
    if (i) { try { i.showPicker(); } catch (err) { i.classList.add('visible'); i.focus(); } }
  }
  else if (act === 'ep-unwatch' && s && cibleVu && cibleVu.type === 'ep') {
    const c = cibleVu;
    const ep = trouverEpisode(s, c.season, c.ep, c.special);
    if (ep) {
      const snap = etatSerie(s);
      marquerNonVu(ep); autoStatus(s); await saveSeries(s);
      closeModalViaHistory(); renderDetail();
      proposerAnnulation(`${c.special ? 'Spécial ' + c.ep : epCode(c.season, c.ep)} marqué non vu`, () => restaurerSerie(snap));
    }
  }
  else if (act === 'mark-all-watched' && s) {
    const n = episodesAMarquer(s).length;
    if (!n) { toast('Les épisodes restants ne sont pas encore diffusés 📅'); return; }
    openVuModal({ type: 'all', uuid: s.uuid }, `Marquer ${pl(n, 'épisode')} comme ${n > 1 ? 'vus' : 'vu'}`, `${s.title} · tous les épisodes déjà diffusés`);
  }
  else if (act === 'mark-season' && s) {
    e.preventDefault(); e.stopPropagation();
    const num = +el.dataset.season;
    if (el.dataset.watched === '1') {
      const n = episodesAMarquer(s, num).length;
      if (!n) { toast('Les épisodes restants ne sont pas encore diffusés 📅'); return; }
      openVuModal({ type: 'season', uuid: s.uuid, season: num }, `Saison ${num} : ${pl(n, 'épisode')} à marquer`, s.title);
    } else {
      const snap = etatSerie(s);
      await markSeason(s, num, false);
      renderDetail();
      proposerAnnulation(`Saison ${num} marquée non vue`, () => restaurerSerie(snap));
    }
  }
  else if (act === 'toggle-fav' && s) { s.is_favorite = !s.is_favorite; await saveSeries(s); renderDetail(); }
  else if (act === 'toggle-stop' && s) {
    const snap = etatSerie(s);
    if (s.status === 'stopped') { s.status = 'continuing'; autoStatus(s); }
    else s.status = 'stopped';
    await saveSeries(s); renderDetail();
    proposerAnnulation(s.status === 'stopped' ? `« ${s.title} » arrêtée` : `« ${s.title} » reprise`, () => restaurerSerie(snap));
  }
  else if (act === 'delete-series' && s) {
    if (confirm(`Supprimer « ${s.title} » et tout son historique ?`)) {
      const meta = state.tmdb[s.uuid];
      state.series = state.series.filter(x => x.uuid !== s.uuid);
      delete state.tmdb[s.uuid];
      await DB.del('series', s.uuid);
      markChanged(); // sinon la synchro ferait revenir la série supprimée
      await DB.del('tmdb', s.uuid);
      closeDetail();
      proposerAnnulation(`« ${s.title} » supprimée`, async () => {
        if (state.series.some(x => x.uuid === s.uuid)) return;
        state.series.push(s);
        await saveSeries(s);
        if (meta) await saveMeta(meta);
      });
    }
  }
  else if (act === 'open-nouveautes') openNouveautes();
  else if (act === 'nv-open') {
    const uuid = el.dataset.uuid;
    // ferme la modale, puis ouvre la fiche une fois le retour effectivement traité
    addEventListener('popstate', () => setTimeout(() => openSeries(uuid), 0), { once: true });
    history.back();
  }
  else if (act === 'open-saga') openSagaModal(el.dataset.id);
  else if (act === 'saga-add') {
    const saga = sagasCache[idSaga(el.dataset.saga)];
    const p = saga && saga.parts.find(x => x.id === +el.dataset.pid);
    if (p) {
      el.disabled = true;
      await addItem({ type: 'movie', provider: 'tmdb', provId: p.id, title: p.title, year: p.date ? +p.date.slice(0, 4) : null, poster: p.poster }, el.dataset.watched === '1');
      redessinerModale();
    }
  }
  else if (act === 'saga-toggle') {
    const m = state.movies.find(x => x.uuid === el.dataset.uuid);
    if (m) {
      const snap = etatFilm(m);
      const zone = el.getBoundingClientRect();
      await toggleMovieWatched(m);
      if (navigator.vibrate) navigator.vibrate(12);
      redessinerModale(); rafraichirEcrans();
      if (m.is_watched) eclat(zone);
      proposerAnnulation(m.is_watched ? `« ${m.title} » vu ✓` : `« ${m.title} » remis dans À voir`, () => restaurerFilm(snap));
    }
  }
  else if (act === 'refresh-one' && s) {
    el.innerHTML = '<span class="spin"></span>';
    try {
      const r = await refreshSeries(s, true);
      await noterNouveautes((r.nouveaux || []).map(x => ({ uuid: s.uuid, ...x })));
      const bouts = [];
      if (r.added) bouts.push(pl(r.added, 'épisode ajouté', 'épisodes ajoutés'));
      if (r.removed) bouts.push(pl(r.removed, 'fantôme retiré', 'fantômes retirés'));
      toast(r.found ? (bouts.length ? bouts.join(' · ') : 'Série à jour ✓') : 'Série introuvable chez le fournisseur');
    } catch (err) { toast('Erreur : ' + err.message); }
    renderDetail();
  }
  else if (act === 'save-key') {
    const nouvelle = $('#tmdb-key').value.trim();
    if (!nouvelle) { // effacer la clé : retour aux sources sans clé
      state.settings.tmdbKey = ''; await saveSettings();
      state.trending = null; state.exploreFeed.key = null;
      $('#key-status').textContent = 'ℹ️ Sans clé : affiches via TVMaze / IMDb';
      return;
    }
    // la clé est VÉRIFIÉE avant d'être enregistrée : une clé refusée casserait toute l'app
    $('#key-status').innerHTML = '<span class="spin"></span> Vérification…';
    try {
      const r = await fetch(`${TMDB}/configuration?api_key=${encodeURIComponent(nouvelle)}`);
      if (r.status === 401) throw new Error('clé refusée par TMDB — vérifie que tu as copié la « Clé d’API » (v3), pas le « Jeton d’accès en lecture » (v4)');
      if (!r.ok) throw new Error('TMDB ne répond pas (' + r.status + '), réessaie plus tard');
      state.settings.tmdbKey = nouvelle;
      await saveSettings();
      state.trending = null; state.exploreFeed.key = null; state.discoverData = {};
      $('#key-status').textContent = '✅ Clé valide et enregistrée';
      toast('Clé TMDB enregistrée ✓');
    } catch (err) {
      $('#key-status').textContent = '❌ ' + (err.message === 'Failed to fetch' ? 'pas de connexion, réessaie plus tard' : err.message) + (tmdbKey() ? ' (l’ancienne clé est conservée)' : '');
    }
  }
  else if (act === 'export-full') {
    download(`mes-series-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`, fullBackupPayload());
    state.lastExport = nowISO();
    await DB.kvSet('lastExport', state.lastExport);
    toast('Sauvegarde complète téléchargée ✓');
    render();
  }
  else if (act === 'sync-connect') {
    const token = $('#gh-token').value.trim();
    if (!token) { toast('Colle d’abord ton jeton GitHub'); return; }
    $('#sync-status').innerHTML = '<span class="spin"></span> Connexion…';
    try {
      const login = await syncConnect(token);
      toast(`☁️ Sync activée pour @${login} ✓`);
      render();
    } catch (err) {
      if ($('#sync-status')) $('#sync-status').textContent = '❌ ' + err.message;
    }
  }
  else if (act === 'sync-push') {
    el.textContent = '…';
    try {
      const ok = await syncPush(false);
      if (ok) toast('☁️ Données envoyées vers le cloud ✓');
      else { toast('☁️ Le cloud a changé depuis un autre appareil — réconciliation…'); await syncAuto(); }
    } catch (err) { await noterErreurSynchro(err); toast('Erreur : ' + err.message); }
    render();
  }
  else if (act === 'sync-pull') {
    if (state.refreshing) { toast('Actualisation en cours — réessaie dans un instant'); return; }
    if (confirm('Remplacer les données de cet appareil par celles du cloud ?')) {
      el.textContent = '…';
      try {
        const r = await syncPull();
        toast(`☁️ Restauré : ${compteSauvegarde(r)} ✓`);
      } catch (err) { await noterErreurSynchro(err); toast('Erreur : ' + err.message); }
      render();
    }
  }
  else if (act === 'sync-off') {
    if (confirm('Déconnecter la synchronisation ? (les données locales et le cloud sont conservés, mais ne se parleront plus)')) {
      await deconnecterSynchro();
      toast('Synchronisation déconnectée');
      render();
    }
  }
  else if (act === 'clear-all') {
    const cloud = syncPret();
    const msg = cloud
      ? 'Effacer TOUTES les données de ce téléphone ?\n\nLa synchronisation sera d’abord déconnectée (et le jeton GitHub retiré) : ta sauvegarde dans le cloud reste intacte et pourra être récupérée.'
      : 'Effacer TOUTES les données de l’application ? Cette action est irréversible.';
    if (confirm(msg)) {
      if (cloud) await deconnecterSynchro(); // sinon le téléphone vide écraserait le cloud
      await DB.clear('series'); await DB.clear('movies'); await DB.clear('tmdb');
      state.series = []; state.movies = []; state.tmdb = {};
      state.nouveautes = []; await DB.kvSet('nouveautes', []);
      libVersion++;
      toast('Données effacées');
      render();
    }
  }
});

/* Déconnexion complète de la synchro (jeton retiré, état de synchro remis à zéro) */
async function deconnecterSynchro() {
  delete state.settings.ghToken; delete state.settings.gistId; delete state.settings.ghLogin;
  state.lastSync = null; state.lastSyncVersion = null; state.syncErr = null;
  await saveSettings();
  await DB.kvSet('lastSync', null); await DB.kvSet('lastSyncVersion', null); await DB.kvSet('syncErr', null);
}

/* ---------------- Animations ---------------- */
function mouvementReduit() { return matchMedia('(prefers-reduced-motion: reduce)').matches; }

/* Transition animée entre deux états de l'écran (View Transitions, Chrome Android) :
   l'ancien écran est figé, `maj` construit le nouveau, le navigateur anime de l'un à
   l'autre. `type` choisit l'animation (glissement d'onglet, ouverture de fiche…).
   Sans prise en charge : mise à jour immédiate, comme avant. */
let vtJeton = 0;
function transition(type, maj) {
  if (!document.startViewTransition || mouvementReduit() || document.visibilityState !== 'visible') {
    maj();
    return { pret: Promise.resolve(), fini: Promise.resolve() };
  }
  const html = document.documentElement, jeton = ++vtJeton;
  html.dataset.vt = type;
  const t = document.startViewTransition(maj);
  t.ready.catch(() => {}); // transition interrompue (nouvelle transition, page masquée) : rien à signaler
  const nettoie = () => { if (vtJeton === jeton) delete html.dataset.vt; };
  t.finished.then(nettoie, nettoie);
  return { pret: t.updateCallbackDone.catch(e => console.error(e)), fini: t.finished.catch(() => {}) };
}
const estVisible = el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth; };

/* Bulle de l'onglet actif : elle glisse jusqu'au nouvel onglet et s'étire en chemin, comme une goutte */
function placerPilule() {
  const nav = $('nav.tabs'), on = nav && nav.querySelector('button.on');
  if (!nav) return;
  let p = nav.querySelector('.tabpill');
  if (!p) { p = document.createElement('span'); p.className = 'tabpill'; nav.prepend(p); }
  if (!on) { p.style.opacity = '0'; return; }
  // pas de voyage à la première pose, au retour du Profil (bulle cachée) ni quand l'écran change de taille
  const voyage = p.dataset.tab && p.dataset.tab !== on.dataset.tab && p.style.opacity !== '0' && !mouvementReduit();
  // un simple rafraîchissement du même onglet laisse finir le voyage en cours
  const depart = voyage && getComputedStyle(p).translate; // position actuelle, même en plein voyage
  if (voyage) p.getAnimations().forEach(a => a.cancel());
  p.dataset.tab = on.dataset.tab;
  p.style.opacity = '';
  p.style.width = on.offsetWidth + 'px';
  p.style.translate = on.offsetLeft + 'px';
  if (!voyage) return;
  const ressort = getComputedStyle(document.documentElement).getPropertyValue('--ressort').trim() || 'ease-out';
  p.animate({ translate: [depart, on.offsetLeft + 'px'] }, { duration: 600, easing: ressort });
  p.animate({ scale: ['1 1', '1.25 .86', '.97 1.03', '1 1'], offset: [0, .35, .7, 1] }, { duration: 600, easing: 'ease-out' });
}
addEventListener('resize', placerPilule);

/* Images : fondu à la première apparition seulement. Une image déjà chargée (simple
   rafraîchissement de l'écran) s'affiche aussitôt, sans clignoter. */
function preparerImage(img) {
  if (img.classList.contains('ok')) return;
  if (img.complete && img.naturalWidth) { img.classList.add('ok', 'direct'); return; }
  const ok = () => img.classList.add('ok');
  img.addEventListener('load', ok, { once: true });
  img.addEventListener('error', ok, { once: true });
}
new MutationObserver(lots => {
  for (const lot of lots) for (const n of lot.addedNodes) {
    if (n.nodeType !== 1) continue;
    if (n.tagName === 'IMG') preparerImage(n);
    else if (n.querySelector) n.querySelectorAll('img').forEach(preparerImage);
  }
}).observe(document.body, { childList: true, subtree: true });

/* Barres (largeurs/hauteurs) portées à leur valeur. Une barre déjà affichée (repérée
   par data-k) repart de sa valeur précédente et s'illumine si elle a progressé. */
const largeursBarres = new Map();
function animateBars(root) {
  const cibles = (root || document).querySelectorAll('[data-w],[data-h]');
  if (!cibles.length) return;
  const reprises = [...cibles].filter(el => el.dataset.k && el.dataset.w && largeursBarres.has(el.dataset.k));
  if (reprises.length) {
    for (const el of reprises) {
      el.style.transition = 'none';
      el.style.width = largeursBarres.get(el.dataset.k);
      if (largeursBarres.get(el.dataset.k) !== el.dataset.w) el.classList.add('monte');
    }
    reprises[0].offsetWidth; // une seule mise en page pour toutes les barres
    for (const el of reprises) el.style.transition = '';
  }
  // délai court plutôt que rAF : fiable même quand la page n'est pas composée
  setTimeout(() => cibles.forEach(el => {
    if (el.dataset.w) { el.style.width = el.dataset.w; if (el.dataset.k) largeursBarres.set(el.dataset.k, el.dataset.w); delete el.dataset.w; }
    if (el.dataset.h) { el.style.height = el.dataset.h; delete el.dataset.h; }
  }), 40);
}

/* Cartes qui changent de place après un rafraîchissement (série cochée qui remonte en
   tête, série commencée qui passe dans « À regarder ») : elles glissent jusqu'à leur
   nouvelle position au lieu de sauter (technique FLIP). */
function positionsCartes() {
  const pos = new Map();
  document.querySelectorAll('#view [data-flip]').forEach(el => pos.set(el.dataset.flip, el.getBoundingClientRect()));
  return pos;
}
function animerDeplacements(avant) {
  if (!avant || !avant.size || mouvementReduit()) return;
  document.querySelectorAll('#view [data-flip]').forEach(el => {
    const b = el.getBoundingClientRect();
    if (b.bottom < -200 || b.top > innerHeight + 200) return;
    const a = avant.get(el.dataset.flip);
    if (!a) { // nouvelle carte : elle apparaît en douceur
      el.animate([{ opacity: 0, transform: 'scale(.92)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' });
      return;
    }
    const dx = a.left - b.left, dy = a.top - b.top;
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2) return;
    el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: 560, easing: 'cubic-bezier(.2,.9,.25,1.05)' });
  });
}

/* Éclat de particules et onde autour d'une coche (élément ou rectangle mémorisé) */
function eclat(cible, couleur = '#EF4444') {
  if (!cible || mouvementReduit()) return;
  const r = cible.getBoundingClientRect ? cible.getBoundingClientRect() : cible;
  if (!r.width) return;
  const box = document.createElement('div');
  box.className = 'eclat';
  box.style.left = (r.left + r.width / 2) + 'px';
  box.style.top = (r.top + r.height / 2) + 'px';
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('i');
    const angle = (i / 14) * Math.PI * 2 + Math.random() * .4, dist = 28 + Math.random() * 26;
    p.style.setProperty('--x', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--y', Math.sin(angle) * dist + 'px');
    p.style.background = i % 3 ? couleur : '#ffffff';
    box.appendChild(p);
  }
  box.appendChild(document.createElement('b'));
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 750);
}
/* Coche qui se dessine sur un bouton qui vient de passer à « vu » */
function tracer(el) {
  if (!el || mouvementReduit()) return;
  el.classList.remove('trace');
  el.offsetWidth;
  el.classList.add('trace');
}

/* Compteurs qui grimpent jusqu'à leur valeur */
function animateCounts(root) {
  (root || document).querySelectorAll('[data-count]').forEach(el => {
    const cible = +el.dataset.count;
    delete el.dataset.count;
    if (!isFinite(cible)) return;
    const pre = el.dataset.prefix || '', suf = el.dataset.suffix || '';
    const duree = cible > 400 ? 1000 : 650, t0 = Date.now();
    const finale = () => { el.textContent = pre + cible.toLocaleString('fr-FR') + suf; };
    let fini = false;
    const pas = () => {
      if (fini) return;
      const p = Math.min(1, (Date.now() - t0) / duree);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = pre + Math.round(cible * e).toLocaleString('fr-FR') + suf;
      if (p < 1) requestAnimationFrame(pas); else fini = true;
    };
    requestAnimationFrame(pas);
    setTimeout(() => { if (!fini) { fini = true; finale(); } }, duree + 260); // filet de sécurité
  });
}

/* Apparition en cascade des premières cartes */
function cascade(root, sel) {
  const els = [...root.querySelectorAll(sel)].slice(0, 24);
  els.forEach((el, i) => {
    el.style.animation = `riseIn .6s var(--ressort) ${i * 32}ms backwards`;
  });
}

/* Pluie de confettis (moment de fête : série terminée, titre pioché) */
function confetti(n = 46) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let box = $('#confetti');
  if (!box) { box = document.createElement('div'); box.id = 'confetti'; document.body.appendChild(box); }
  const couleurs = ['#F5F2F0', '#DC2626', '#F87171', '#F5C96E', '#FFFFFF'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.style.left = (12 + Math.random() * 76) + 'vw';
    p.style.top = (24 + Math.random() * 18) + 'vh';
    p.style.background = couleurs[i % couleurs.length];
    p.style.setProperty('--dx', (Math.random() * 220 - 110) + 'px');
    p.style.setProperty('--dy', (58 + Math.random() * 62) + 'vh');
    p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    p.style.animationDelay = (Math.random() * 220) + 'ms';
    box.appendChild(p);
  }
  setTimeout(() => { box.innerHTML = ''; }, 2200);
}

/* Le grand moment : l'affiche de la série terminée s'affiche en plein écran, auréolée,
   avec une pluie de confettis. Un toucher ou 2,8 s et c'est fini. */
function celebrer(s) {
  confetti(70);
  if (mouvementReduit()) return;
  const meta = state.tmdb[s.uuid] || {}, p = progress(s);
  const heures = Math.round(p.total * (meta.runtime || 40) / 60);
  const box = document.createElement('div');
  box.className = 'celebre';
  box.innerHTML = `<div class="cel-carte">
    <div class="cel-affiche">${posterHtml(s, 'tv', true)}</div>
    <b>Série terminée !</b>
    <span>${esc(s.title)}</span>
    <small>${pl(p.total, 'épisode')} · environ ${pl(heures, 'heure')} devant l'écran</small>
  </div>`;
  let fini = false;
  const fermer = () => {
    if (fini) return;
    fini = true;
    box.classList.add('sortie');
    setTimeout(() => box.remove(), 320);
  };
  box.addEventListener('click', fermer);
  document.body.appendChild(box);
  setTimeout(fermer, 2800);
}

/* Fête quand une série passe à 100 % */
function feteSiTerminee(s, avant, annuler) {
  const p = progress(s);
  if (p.total && avant < p.total && p.watched === p.total) {
    celebrer(s);
    if (navigator.vibrate) navigator.vibrate([16, 60, 26]);
    const msg = `🎉 « ${s.title} » terminée — bravo !`;
    if (annuler) proposerAnnulation(msg, annuler); else toast(msg, 3600);
    return true;
  }
  return false;
}

let lastViewKey = null;
/* cartes qui apparaissent en cascade quand on arrive sur un écran */
const CARTES_CASCADE = '.rcard, .hsec, .lcard, .mcard, .scard, .pcard, .panel, .erow, .ajour, .cesoir, .bfilm, .t10, .gtuile';
function afterRender() {
  loadVisiblePosters();
  animateBars($('#view'));
  animateCounts($('#view'));
  // « Mes séries » : complète en fond les années/genres manquants pour les filtres
  if (state.tab === 'series' && state.seriesView === 'grid' && !state.seriesMetaBusy) {
    backfillSeriesMeta(() => {
      if (state.tab === 'series' && state.seriesView === 'grid') rerenderSansPerturber();
    });
  }
  // Films : durées, dates de sortie et sagas complétées en fond
  if (state.tab === 'movies' && tmdbKey()) {
    if (state.movieView === 'avoir') backfillFilms(false, () => {
      if (state.tab === 'movies' && state.movieView === 'avoir') rerenderSansPerturber();
    });
    else if (state.movieView === 'sagas') preparerSagas();
  }
  // cascade uniquement quand on change réellement d'écran (pas à chaque re-rendu)
  const key = cleVue();
  if (key !== lastViewKey) {
    lastViewKey = key;
    cascade($('#view'), CARTES_CASCADE);
  }
  if (state.tab === 'home') initAccueil();
  initVitrine();
}

/* Vitrine d'Explorer : reste sur la même image après un rafraîchissement ; les tirets et
   le zoom lent suivent l'image affichée */
let vitrineIndex = 0;
function initVitrine() {
  const v = $('#vitrine');
  if (!v) return;
  const diapos = [...v.children], tirets = [...document.querySelectorAll('.vtirets span')];
  const montrer = i => {
    diapos.forEach((d, j) => d.classList.toggle('vue', j === i));
    tirets.forEach((t, j) => t.classList.toggle('on', j === i));
  };
  if (vitrineIndex >= diapos.length) vitrineIndex = 0;
  if (vitrineIndex) { v.scrollLeft = vitrineIndex * v.clientWidth; montrer(vitrineIndex); }
  v.addEventListener('scroll', () => {
    clearTimeout(v._t);
    v._t = setTimeout(() => {
      vitrineIndex = Math.round(v.scrollLeft / (v.clientWidth || 1));
      montrer(vitrineIndex);
    }, 80);
  }, { passive: true });
}

/* ---------------- Démarrage ---------------- */
/* Fin de l'écran de lancement (une seule fois). Il reste affiché au moins 1,8 s depuis
   l'ouverture, le temps de voir l'animation du logo, même si l'appli est prête avant.
   Filet de sécurité : il s'efface de toute façon si le démarrage échoue. */
const DUREE_MIN_LANCEMENT = mouvementReduit() ? 400 : 1800;
function fermerLancement() {
  const l = $('#lancement');
  if (!l || l.classList.contains('fini') || l.dataset.attente) return;
  const reste = DUREE_MIN_LANCEMENT - performance.now(); // performance.now() = temps écoulé depuis l'ouverture
  if (reste > 0) {
    l.dataset.attente = '1';
    setTimeout(() => { delete l.dataset.attente; fermerLancement(); }, reste);
    return;
  }
  l.classList.add('fini');
  // l'Accueil apparaît en cascade au moment où le logo s'efface (et non, invisible, derrière lui)
  $('#view').querySelectorAll(CARTES_CASCADE).forEach(el => { el.style.animation = 'none'; });
  void $('#view').offsetWidth;
  cascade($('#view'), CARTES_CASCADE);
  setTimeout(() => l.remove(), 750);
}
setTimeout(fermerLancement, 6000);

(async function init() {
  await DB.open();
  const [series, movies, tmdb, settings, lastRefresh, hidden, lastExport, changedAt, lastSync, lastSyncVersion, syncErr] = await Promise.all([
    DB.getAll('series'), DB.getAll('movies'), DB.getAll('tmdb'),
    DB.kvGet('settings'), DB.kvGet('lastRefresh'), DB.kvGet('hidden'),
    DB.kvGet('lastExport'), DB.kvGet('changedAt'), DB.kvGet('lastSync'),
    DB.kvGet('lastSyncVersion'), DB.kvGet('syncErr'),
  ]);
  state.menageIgnore = new Set((await DB.kvGet('menageIgnore')) || []);
  state.nouveautes = (await DB.kvGet('nouveautes')) || [];
  state.nouveautesVues = (await DB.kvGet('nouveautesVues')) || null;
  sagasCache = (await DB.kvGet('sagas')) || {};
  state.series = series || [];
  state.movies = movies || [];
  state.settings = settings || {};
  state.lastRefresh = lastRefresh || null;
  state.lastExport = lastExport || null;
  state.changedAt = changedAt || null;
  state.lastSync = lastSync || null;
  state.lastSyncVersion = lastSyncVersion || null;
  state.syncErr = syncErr || null;
  state.hidden = new Set(hidden || []);
  // les métadonnées orphelines (titre supprimé, ajout interrompu) sont retirées
  const existe = new Set([...state.series.map(s => s.uuid), ...state.movies.map(m => m.uuid)]);
  for (const t of tmdb || []) {
    if (existe.has(t.uuid) && metaSure(t)) state.tmdb[t.uuid] = t;
    else DB.del('tmdb', t.uuid).catch(() => {});
  }
  render();
  fermerLancement();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  // stockage persistant : empêche Android de purger les données
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().then(ok => { state.stockagePersistant = ok; }).catch(() => {});
  }
  // synchronisation cloud à chaque retour dans l'app (une PWA reste souvent ouverte
  // des jours), envoi des changements quand on la quitte — sans jamais écraser un
  // cloud modifié ailleurs entre-temps (syncPush vérifie la révision)
  let derniereVerif = Date.now();
  document.addEventListener('visibilitychange', () => {
    if (!syncPret()) return;
    if (document.visibilityState === 'hidden') {
      if (state.lastSync && (state.changedAt || '') > state.lastSync) syncPush(false).catch(noterErreurSynchro);
    } else if (Date.now() - derniereVerif > 30000) {
      derniereVerif = Date.now();
      syncAuto();
    }
  });

  // d'abord la synchro, ENSUITE l'actualisation automatique (au plus une fois par
  // 20 h) : en parallèle, l'actualisation réécrivait d'anciennes données par-dessus
  // celles qui venaient d'arriver du cloud
  setTimeout(async () => {
    await syncAuto();
    if (state.series.length && navigator.onLine !== false &&
        (!state.lastRefresh || Date.now() - new Date(state.lastRefresh) > 20 * 3600 * 1000)) {
      refreshAll(true);
    }
  }, 1200);
  // rappel de sauvegarde : au-delà de 30 jours
  const dataAge = state.lastExport ? Date.now() - new Date(state.lastExport) : Infinity;
  if ((state.series.length || state.movies.length) && dataAge > 30 * 86400 * 1000) {
    setTimeout(() => toast('💾 Pense à exporter une sauvegarde depuis ton Profil !', 5000), 8000);
  }
})();
</script>
