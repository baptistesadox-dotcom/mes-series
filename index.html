<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Mes Séries</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  /* OLED Minimal cadré : noir pur, quasi monochrome, contours marqués */
  --bg:#000; --bg2:#0d0d0f; --bg3:#17171a; --line:#313138;
  --txt:#f2f2f4; --txt2:#8a8c95;
  --acc:#e8e8ec; --acc2:#c9c9d2; --onacc:#000;
  --grad:linear-gradient(135deg,#f2f2f4,#c9c9d2);
  --ok:#4ade80; --warn:#fbbf24; --danger:#f87171;
  --radius:10px;
  --card-border:1px solid #313138;
  --card-shadow:none;
  --frame:1px solid #3d3d45;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{min-height:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  background-image:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit}
img{display:block}
a{color:var(--txt);text-decoration:underline;text-underline-offset:2px}
svg{display:block}

/* ---------- Header ---------- */
header.app{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:rgba(0,0,0,.88);backdrop-filter:blur(14px);
}
header.app h1{
  font-size:21px;font-weight:800;flex:1;letter-spacing:-.02em;
}
header.app h1.brand{
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.iconbtn{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--bg3);border:var(--frame);flex:none;color:var(--txt2);
}
.iconbtn svg{width:19px;height:19px}
.iconbtn:active{background:var(--line);color:var(--txt)}

/* ---------- Nav ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;background:rgba(4,4,5,.94);backdrop-filter:blur(16px);
  border-top:var(--frame);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:4px;
}
nav.tabs button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 0 4px;color:var(--txt2);font-size:10.5px;font-weight:500;
  border-radius:12px;border:1px solid transparent;transition:color .15s;
}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--txt);border-color:#4a4a52;background:#111114}
nav.tabs button.on .dot{width:4px;height:4px;border-radius:2px;background:var(--grad)}
nav.tabs .dot{width:4px;height:4px;border-radius:2px;background:transparent}

/* ---------- Common ---------- */
main{padding:12px 14px 24px;max-width:760px;margin:0 auto}
.searchbar{
  display:flex;align-items:center;gap:10px;background:var(--bg2);
  border:var(--card-border);
  border-radius:14px;padding:11px 14px;margin-bottom:12px;color:var(--txt2);
}
.searchbar svg{width:17px;height:17px;flex:none}
.searchbar input{flex:1;background:none;border:none;outline:none;color:var(--txt);min-width:0}
.searchbar input::placeholder{color:var(--txt2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 14px;border-radius:999px;background:var(--bg2);
  color:var(--txt2);font-size:13px;font-weight:500;border:var(--card-border);
}
.chip.on{background:var(--grad);color:var(--onacc);border-color:#55555e;box-shadow:none}
.empty{text-align:center;color:var(--txt2);padding:52px 20px}
.empty .big{font-size:46px;margin-bottom:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--grad);color:var(--onacc);font-weight:650;
  padding:12px 20px;border-radius:12px;
  box-shadow:none;
}
.btn svg{width:16px;height:16px}
.btn:active{transform:scale(.98);opacity:.9}
.btn.ghost{background:var(--bg3);color:var(--txt);box-shadow:none;border:var(--card-border)}
.btn.danger{background:rgba(248,113,113,.12);color:var(--danger);box-shadow:none}
.btn.small{padding:8px 13px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- Posters ---------- */
.poster{
  border-radius:12px;background:linear-gradient(140deg,var(--bg3),#151823 60%);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  color:#4b5165;font-weight:800;font-size:17px;position:relative;flex:none;
}
.poster::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  border:1px solid rgba(255,255,255,.06);pointer-events:none;
}
.poster img{width:100%;height:100%;object-fit:cover;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- Series cards ---------- */
.card-list{display:flex;flex-direction:column;gap:10px}
.scard{
  display:flex;gap:13px;background:var(--bg2);border-radius:var(--radius);
  padding:11px;align-items:center;border:var(--card-border);box-shadow:var(--card-shadow);
}
.scard:active{background:var(--bg3)}
.scard .poster{width:60px;height:90px}
.scard .mid{flex:1;min-width:0}
.scard .title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.scard .sub{font-size:12.5px;color:var(--txt2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:5px;background:rgba(255,255,255,.07);border-radius:4px;margin-top:9px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--grad);border-radius:4px;transition:width .3s}
.progress.full i{background:linear-gradient(135deg,#34d399,#10b981)}
.checkbtn{
  width:46px;height:46px;border-radius:15px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg3);color:var(--txt);border:var(--frame);
}
.checkbtn svg{width:20px;height:20px}
.checkbtn:active{background:var(--grad);color:var(--onacc)}
.badge{
  display:inline-block;font-size:11px;font-weight:700;padding:2.5px 8px;border-radius:7px;
  background:var(--bg3);color:var(--txt2);
}
.badge.acc{background:var(--bg3);color:var(--txt);border:1px solid #45454d}
.badge.ok{background:rgba(52,211,153,.13);color:var(--ok)}
.badge.warn{background:rgba(251,191,36,.13);color:var(--warn)}
h2.section{
  font-size:15px;font-weight:750;letter-spacing:-.01em;margin:22px 0 12px;
  display:flex;align-items:center;gap:8px;
}
h2.section:first-child{margin-top:4px}
h2.section .cnt{font-size:12px;color:var(--txt2);font-weight:500}

/* ---------- Movies / discover grids ---------- */
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:520px){.mgrid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:13px}}
.mcard{position:relative}
.mcard .poster{width:100%;height:auto;aspect-ratio:2/3}
.mcard .mtitle{font-size:12.5px;font-weight:550;margin-top:7px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .myear{font-size:11px;color:var(--txt2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .mtoggle{
  position:absolute;top:7px;right:7px;width:31px;height:31px;border-radius:11px;
  background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.12);
}
.mcard .mtoggle svg{width:15px;height:15px}
.mcard.watched .mtoggle{background:linear-gradient(135deg,#34d399,#10b981);color:#07120c;border-color:transparent}
.mcard .mfav{
  position:absolute;top:7px;left:7px;color:var(--warn);
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.7));width:16px;height:16px;
}
/* cartes séries en grille : progression sur l'affiche + restants */
.mcard .pwrap{position:relative}
.mcard .sprog{
  position:absolute;left:0;right:0;bottom:0;height:11px;
  background:linear-gradient(transparent,rgba(0,0,0,.55));
  border-radius:0 0 12px 12px;overflow:hidden;
}
.mcard .sprog i{
  position:absolute;left:0;bottom:0;height:4px;
  background:var(--grad);border-radius:0 3px 3px 0;
}
.mcard .sprog.full i{background:linear-gradient(135deg,#34d399,#10b981)}
.mcard .schip{
  position:absolute;top:7px;right:7px;min-width:26px;height:26px;border-radius:10px;
  padding:0 7px;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.72);
  border:1px solid #45454d;color:var(--txt);
  font-size:12px;font-weight:700;
}
.mcard .schip.done{background:linear-gradient(135deg,#34d399,#10b981);color:#07120c;border-color:transparent}
.mcard .schip.wait{border-color:rgba(251,191,36,.5);color:var(--warn)}
.mcard .schip svg{width:14px;height:14px}
/* horizontal rows (tendances) */
.hrow{display:flex;gap:11px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.hrow::-webkit-scrollbar{display:none}
.pcard{width:108px;flex:none;position:relative}
.pcard .poster{width:108px;height:162px}
.pcard .mtitle{font-size:12px;font-weight:550;margin-top:6px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .inlib{
  position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:9px;
  background:linear-gradient(135deg,#34d399,#10b981);color:#07120c;
  display:flex;align-items:center;justify-content:center;
}
.pcard .inlib svg{width:13px;height:13px}
/* bouton d'ajout rapide sur les vignettes Découvrir */
.qadd{
  position:absolute;top:6px;right:6px;width:27px;height:27px;border-radius:10px;
  background:rgba(0,0,0,.72);color:var(--txt);
  border:1px solid rgba(255,255,255,.38);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.qadd svg{width:15px;height:15px}
.qadd:active{background:var(--grad);color:var(--onacc)}

/* ---------- Detail ---------- */
.overlay{
  position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
  padding-bottom:calc(30px + env(safe-area-inset-bottom));
  animation:slidein .2s ease;
}
@keyframes slidein{from{transform:translateY(4%);opacity:.3}to{transform:none;opacity:1}}
.detbar{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:linear-gradient(rgba(0,0,0,.88),rgba(0,0,0,.6) 70%,transparent);
}
.detbar .iconbtn{background:rgba(8,8,10,.8);backdrop-filter:blur(10px);border:var(--frame)}
.backdrop{
  height:230px;margin-top:calc(-56px - env(safe-area-inset-top));
  background:linear-gradient(150deg,#1d1633,#12151d);
  background-size:cover;background-position:center 20%;position:relative;
}
.backdrop::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(rgba(0,0,0,.1) 30%,rgba(0,0,0,.85) 80%,var(--bg));
}
.dethead{display:flex;gap:15px;padding:0 16px;align-items:flex-end;margin-top:-74px;position:relative;z-index:2}
.dethead .poster{width:104px;height:156px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.dethead .info{flex:1;min-width:0;padding-bottom:4px}
.dethead h2{font-size:21px;line-height:1.2;letter-spacing:-.02em;font-weight:800}
.dethead .meta{font-size:12.5px;color:var(--txt2);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.overview{padding:14px 16px 0;color:var(--txt2);font-size:13.5px}
.overview.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.detactions{display:flex;gap:8px;padding:14px 16px;flex-wrap:wrap}
details.season{border-top:1px solid rgba(255,255,255,.05);margin:0 6px}
details.season summary{
  list-style:none;display:flex;align-items:center;gap:10px;
  padding:14px 10px;font-weight:650;cursor:pointer;
}
details.season summary::-webkit-details-marker{display:none}
details.season summary .n{flex:1}
details.season summary .cnt{font-size:12.5px;color:var(--txt2);font-weight:450}
details.season summary .arrow{color:var(--txt2);transition:transform .15s;width:16px;height:16px}
details.season[open] summary .arrow{transform:rotate(90deg)}
.eprow{display:flex;align-items:center;gap:11px;padding:9px 10px 9px 14px;border-radius:12px}
.eprow:active{background:var(--bg2)}
.eprow .num{width:30px;flex:none;color:var(--txt2);font-size:12.5px;font-variant-numeric:tabular-nums}
.eprow .nm{flex:1;min-width:0;font-size:14px}
.eprow .nm .d{font-size:11.5px;color:var(--txt2)}
.eprow.future .nm{color:var(--txt2)}
.eprow.future .epcheck{opacity:.25}
.epcheck{
  width:27px;height:27px;border-radius:10px;border:1.5px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;color:transparent;
}
.epcheck svg{width:14px;height:14px}
.eprow.watched .epcheck{background:linear-gradient(135deg,#34d399,#10b981);border-color:transparent;color:#07120c}
.epcheck{position:relative}
.epcheck::after{content:'';position:absolute;inset:-9px} /* zone de toucher plus large que le rond */

/* ---------- Fiche épisode / date de visionnage ---------- */
.epstill{
  aspect-ratio:16/9;border-radius:14px;background:var(--bg3) center/cover no-repeat;border:var(--card-border);
  margin-bottom:12px;display:flex;align-items:center;justify-content:center;color:#3a3a42;
}
.epstill svg{width:34px;height:34px}
.epserie{font-size:11.5px;color:var(--txt2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.epinfos{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 14px}
.epresume{margin-top:14px;color:var(--txt2);font-size:13.5px;line-height:1.5}
.vulabel{font-size:12px;color:var(--txt2);font-weight:650;margin:0 0 8px}
.vuchoix{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vuchoix .vuprim{flex-basis:100%;justify-content:center}
.vudate-in{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;color-scheme:dark}
.vudate-in.visible{position:static;opacity:1;width:auto;height:auto;pointer-events:auto}

/* ---------- Nouveautés ---------- */
.nxhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.nxhead p{font-size:12.5px;color:var(--txt2)}
.nvlink{flex:none;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;border:var(--card-border);background:var(--bg2);color:var(--txt2)}
.nvlink.on{background:var(--txt);color:#000;border-color:transparent}
.nvgroup{margin-bottom:14px}
.nvep{display:flex;align-items:center;gap:8px;padding:6px 4px 6px 12px;font-size:13.5px}
.nvep .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nvep .d{font-size:11.5px;color:var(--txt2);flex:none}

/* ---------- Sagas ---------- */
#modal-saga{margin-top:12px}
#modal-saga:empty{display:none}
.sagarow{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid rgba(255,255,255,.06)}
.sagarow .poster{width:42px;height:63px;font-size:12px}
.sagarow .mid{flex:1;min-width:0}
.sagarow .t{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sagarow .s{font-size:12px;color:var(--txt2);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sagarow .acts{display:flex;gap:6px;flex:none;align-items:center}
.sagarow .checkbtn{width:38px;height:38px;border-radius:12px}
.sagarow.vu .t{color:var(--txt2)}
.seasonbtn{margin-left:auto}

/* ---------- Settings ---------- */
.panel{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-bottom:13px;border:var(--card-border);box-shadow:var(--card-shadow)}
.panel h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.panel p{font-size:13px;color:var(--txt2);margin-bottom:10px}
.panel .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{
  flex:1;min-width:0;background:var(--bg3);border:var(--card-border);border-radius:12px;
  padding:11px 13px;color:var(--txt);outline:none;
}
.field:focus{border-color:var(--acc)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg3);border-radius:13px;padding:13px;text-align:center;border:var(--card-border)}
.stat .v{
  font-size:23px;font-weight:800;letter-spacing:-.02em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.stat .l{font-size:12px;color:var(--txt2)}

/* ---------- Découvrir : bannière, pastilles, squelettes ---------- */
.heros{
  display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;
  margin:0 -14px 10px;padding:0 14px;scrollbar-width:none;
}
.heros::-webkit-scrollbar{display:none}
.hdots{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.hdot{width:6px;height:6px;border-radius:3px;background:var(--line);transition:all .25s}
.hdot.on{background:var(--acc);width:18px}
.hero{
  position:relative;border-radius:18px;overflow:hidden;
  flex:0 0 100%;scroll-snap-align:center;
  aspect-ratio:16/9;background:var(--bg2) center 25%/cover no-repeat;
  border:var(--card-border);box-shadow:var(--card-shadow);cursor:pointer;
}
.hero .ov{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:14px;background:linear-gradient(transparent 25%,rgba(0,0,0,.94));
}
.hero h3{font-size:21px;font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.hero .hm{font-size:12.5px;color:#cfd3de;margin:3px 0 10px}
.hero .hb{display:flex;gap:8px}
.htag{
  position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;
  background:rgba(0,0,0,.72);color:var(--warn);
  padding:4px 10px;border-radius:999px;border:1px solid rgba(251,191,36,.4);
}
.rchip{
  position:absolute;bottom:6px;left:6px;font-size:10.5px;font-weight:700;
  background:rgba(0,0,0,.78);color:var(--warn);
  padding:2px 7px;border-radius:8px;z-index:1;
}
.rchip.soon{color:#7dd3fc}
.hideb{
  position:absolute;top:7px;left:7px;width:25px;height:25px;border-radius:9px;
  background:rgba(0,0,0,.72);color:var(--txt2);
  border:1px solid rgba(255,255,255,.14);font-size:12px;
  display:flex;align-items:center;justify-content:center;z-index:1;
}
.hideb:active{background:rgba(248,113,113,.3);color:var(--danger)}
.sk{
  background:linear-gradient(100deg,var(--bg2) 40%,var(--bg3) 50%,var(--bg2) 60%);
  background-size:200% 100%;animation:shimmer 1.3s infinite;
  border-radius:12px;border:var(--card-border);
}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pop{0%{transform:scale(.5)}55%{transform:scale(1.3)}100%{transform:scale(1)}}

/* ---------- Statistiques ---------- */
.chart{display:flex;gap:4px;height:150px;margin-top:14px}
.chart.small{height:110px}
.ccol{flex:1;display:flex;flex-direction:column;min-width:0}
.ccol .bars{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.seg{border-radius:3px}
.seg.ep{background:var(--grad)}
.seg.mv{background:linear-gradient(135deg,#fbbf24,#f97316)}
.clab{font-size:9.5px;color:var(--txt2);text-align:center;margin-top:5px;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--txt2)}
.legend .dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.grow{display:flex;align-items:center;gap:10px;margin:9px 0}
.grow .gl{width:118px;font-size:12.5px;color:var(--txt2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.grow .gb{flex:1;height:11px;background:var(--bg3);border-radius:6px;overflow:hidden}
.grow .gb i{display:block;height:100%;background:var(--grad);border-radius:6px}
.grow .gv{width:46px;font-size:11.5px;color:var(--txt2);flex:none}

/* ---------- Segments (À suivre / Mes séries) ---------- */
.segbar{
  display:flex;background:#0a0a0c;border:var(--frame);
  border-radius:12px;padding:4px;margin-bottom:14px;gap:4px;
}
.segbar button{
  flex:1;padding:9px 0;border-radius:9px;color:var(--txt2);
  font-weight:650;font-size:13.5px;transition:color .15s;
  border:1px solid transparent;
}
.segbar button.on{background:var(--grad);color:var(--onacc);border-color:#55555e;box-shadow:none}

/* ---------- Filtres Découvrir ---------- */
.fbar{display:flex;gap:7px;overflow-x:auto;padding:0 2px 12px;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fsel{
  background:var(--bg2);border:var(--card-border);color:var(--txt2);
  border-radius:10px;padding:7px 9px;font-size:12.5px;outline:none;flex:none;
  -webkit-appearance:none;appearance:none;
}
.fsel.active{border-color:#55555e;color:var(--txt)}
.mcard .why{
  font-size:10.5px;color:var(--txt2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85;
}
/* « Pour toi » : sur quoi se basent les suggestions, et pourquoi un titre est proposé */
.ptete{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.ptete p{font-size:12px;color:var(--txt2);min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptete .btn{flex:none}
.pourquoi{font-size:12.5px;color:var(--txt2);margin:-2px 0 10px}

/* ---------- Hint banner ---------- */
.hint{
  display:flex;gap:11px;align-items:flex-start;background:#0d0d0f;
  border:var(--frame);border-radius:var(--radius);
  padding:13px 14px;margin-bottom:14px;font-size:13px;
}
.hint .em{font-size:19px;line-height:1.2}
.hint b{color:var(--txt)}
.hint p{color:var(--txt2)}

/* ---------- Toast / modal ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--bg3);border:1px solid rgba(255,255,255,.1);color:var(--txt);
  padding:11px 18px;border-radius:14px;z-index:100;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .2s;width:max-content;max-width:88vw;text-align:center;
}
#toast.show{opacity:1}
/* toast avec bouton (« Annuler », « Voir ») : cliquable seulement quand il est affiché */
#toast.actionable{display:flex;align-items:center;gap:14px;text-align:left;padding:8px 8px 8px 16px}
#toast.show.actionable{pointer-events:auto}
#toast .toast-btn{flex:none;background:var(--txt);color:#000;font-weight:750;font-size:13px;padding:7px 12px;border-radius:10px}
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal{
  background:var(--bg2);border-radius:22px 22px 0 0;width:100%;max-width:760px;
  max-height:84vh;overflow-y:auto;padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.09);
}
.modal .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.modal h3{margin-bottom:12px;font-size:17px}
.dmodal{display:flex;gap:15px}
.dmodal .poster{width:100px;height:150px}
.dmodal .dmi{flex:1;min-width:0}
.dmodal h3{margin-bottom:4px}
.dmodal .y{font-size:13px;color:var(--txt2);margin-bottom:8px}
.castlink{
  color:var(--txt);padding:0;font-size:inherit;font-family:inherit;
  text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;
}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--txt2);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.loadrow{padding:16px;text-align:center;color:var(--txt2);font-size:13px}

/* ---------- Focus clavier, actualisation en cours ---------- */
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#btn-refresh.tourne svg{animation:sp 1s linear infinite}

/* ---------- Animations ---------- */
@keyframes riseIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes viewIn{from{opacity:0}to{opacity:1}}
@keyframes bgIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(34px);opacity:.4}to{transform:none;opacity:1}}
@keyframes navPop{0%{transform:scale(.82)}58%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes rowFlash{0%{background:rgba(74,222,128,.18)}100%{background:transparent}}
@keyframes confettiFall{
  0%{opacity:1;transform:translate3d(0,0,0) rotate(0)}
  100%{opacity:0;transform:translate3d(var(--dx),var(--dy),0) rotate(var(--rot))}
}
#view{animation:viewIn .22s ease}
.modal-bg{animation:bgIn .2s ease}
.modal{animation:sheetUp .3s cubic-bezier(.22,.9,.28,1)}
nav.tabs button .nico{display:block}
nav.tabs button.on .nico{animation:navPop .42s cubic-bezier(.2,1.3,.35,1)}
.eprow.flash{animation:rowFlash .7s ease-out}
/* barres qui se remplissent */
.progress i{transition:width .6s cubic-bezier(.22,.9,.28,1)}
.sprog i{transition:width .6s cubic-bezier(.22,.9,.28,1)}
.grow .gb i{transition:width .8s cubic-bezier(.22,.9,.28,1)}
.seg{transition:height .7s cubic-bezier(.22,.9,.28,1)}
/* confettis */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
#confetti i{
  position:absolute;width:8px;height:12px;border-radius:2px;
  animation:confettiFall 1.5s cubic-bezier(.2,.6,.4,1) forwards;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  .sk{animation:none!important}
  .spin,#btn-refresh.tourne svg{animation-duration:1.6s!important}
}

<script>
'use strict';
/* ============================================================
   Mes Séries — suivi de séries & films (remplaçant TV Time)
   Données 100% locales (IndexedDB).
   Métadonnées : TMDB (clé perso, fr) avec repli automatique
   sans clé sur TVMaze (séries) et IMDb (films).
   ============================================================ */

const TMDB = 'https://api.themoviedb.org/3';
const TMDB_IMG = 'https://image.tmdb.org/t/p/';
const TVMAZE = 'https://api.tvmaze.com';

/* ---------------- Icônes SVG ---------------- */
const I = (paths, fill) => `<svg viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
const ICONS = {
  tv: I('<rect x="2" y="7" width="20" height="14" rx="2.5"/><path d="M17 2l-5 5-5-5"/>'),
  play: I('<circle cx="12" cy="12" r="9.5"/><polygon points="10 8.5 16 12 10 15.5" fill="currentColor" stroke="none"/>'),
  compass: I('<circle cx="12" cy="12" r="9.5"/><polygon points="16 8 13.5 13.5 8 16 10.5 10.5 16 8" fill="currentColor" stroke="none"/>'),
  film: I('<rect x="2.5" y="3.5" width="19" height="17" rx="2.5"/><line x1="7.5" y1="3.5" x2="7.5" y2="20.5"/><line x1="16.5" y1="3.5" x2="16.5" y2="20.5"/><line x1="2.5" y1="12" x2="7.5" y2="12"/><line x1="16.5" y1="12" x2="21.5" y2="12"/><line x1="2.5" y1="7.7" x2="7.5" y2="7.7"/><line x1="2.5" y1="16.3" x2="7.5" y2="16.3"/><line x1="16.5" y1="7.7" x2="21.5" y2="7.7"/><line x1="16.5" y1="16.3" x2="21.5" y2="16.3"/>'),
  gear: I('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'),
  search: I('<circle cx="11" cy="11" r="7.5"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>'),
  plus: I('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
  check: I('<polyline points="20 6 9 17 4 12"/>'),
  back: I('<polyline points="15 18 9 12 15 6"/>'),
  refresh: I('<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>'),
  chevron: I('<polyline points="9 18 15 12 9 6"/>'),
  star: I('<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>', true),
  user: I('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'),
  dice: I('<rect x="3" y="3" width="18" height="18" rx="4.5"/><circle cx="8.6" cy="8.6" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.4" cy="8.6" r="1.35" fill="currentColor" stroke="none"/><circle cx="8.6" cy="15.4" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.4" cy="15.4" r="1.35" fill="currentColor" stroke="none"/>'),
  fire: I('<path d="M12 2c1 4-4 6-4 10a4 4 0 0 0 8 0c0-1.5-.5-2.5-1-3.5 2 .5 4 2.5 4 5.5a7 7 0 1 1-14 0c0-5 5-7 7-12z"/>'),
};

const state = {
  series: [], movies: [], tmdb: {}, settings: {},
  tab: 'series', seriesView: 'suivre', seriesFilter: 'encours',
  seriesSort: 'recent', seriesGenre: -1, seriesDecade: 'all', seriesMetaBusy: null,
  movieView: 'avoir', movieFilter: 'vus',
  seriesSearch: '', movieSearch: '', discoverSearch: '',
  discoverResults: null, discoverLoading: false, trending: null,
  discoverTab: 'trending', genreSel: 0, discoverData: {}, discoverBusy: {},
  exploreType: 'tv', exploreSource: 'pop',
  journalLimit: 120, wrappedYear: null,
  menageMois: 6, menageIgnore: new Set(),
  roulette: { type: 'all', genre: -1, duree: 'all' }, roulettePick: null,
  exploreFeed: { key: null, items: [], page: 0, totalPages: 1, loading: false, seen: null, error: null, vides: 0 },
  dFilters: { type: 'all', genre: -1, note: 0, annee: 'all' },
  movieSort: 'recent', movieGenre: -1, movieDecade: 'all', movieLimit: 60,
  avSort: 'recent', avGenre: -1, filmsMetaBusy: null, sagasBusy: null,
  nouveautes: [], nouveautesVues: null, aCommencerTout: false,
  hidden: new Set(),
  refreshing: false, lastRefresh: null,
};

/* ---------------- IndexedDB ---------------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('mes-series', 1);
      r.onupgradeneeded = e => {
        const d = e.target.result;
        d.createObjectStore('series', { keyPath: 'uuid' });
        d.createObjectStore('movies', { keyPath: 'uuid' });
        d.createObjectStore('tmdb',   { keyPath: 'uuid' });
        d.createObjectStore('kv');
      };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  op(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = DB.db.transaction(store, mode);
      const rq = fn(tx.objectStore(store));
      tx.oncomplete = () => res(rq && rq.result);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('transaction annulée'));
    });
  },
  getAll: s => DB.op(s, 'readonly', o => o.getAll()),
  put: (s, v) => DB.op(s, 'readwrite', o => o.put(v)),
  del: (s, k) => DB.op(s, 'readwrite', o => o.delete(k)),
  clear: s => DB.op(s, 'readwrite', o => o.clear()),
  kvGet: k => DB.op('kv', 'readonly', o => o.get(k)),
  kvSet: (k, v) => DB.op('kv', 'readwrite', o => o.put(v, k)),
  putAll: (s, arr) => DB.op(s, 'readwrite', o => { for (const v of arr) o.put(v); }),
};
/* suivi des modifications locales (pour la synchronisation cloud) */
let changedTimer = null;
function markChanged() {
  state.changedAt = nowISO();
  libVersion++;
  clearTimeout(changedTimer);
  // court délai pour regrouper les rafales, sans risquer de perdre l'info si l'app est fermée aussitôt
  changedTimer = setTimeout(() => DB.kvSet('changedAt', state.changedAt), 150);
}
const saveSeries = s => { markChanged(); return DB.put('series', s); };
const saveMovie  = m => { markChanged(); return DB.put('movies', m); };
const saveMeta   = t => { metaSure(t); state.tmdb[t.uuid] = t; libVersion++; return DB.put('tmdb', t); };
const saveSettings = () => DB.kvSet('settings', state.settings);

/* ---------------- Utilitaires ---------------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Données venues de l'extérieur (fournisseurs, sauvegardes, gist) : seules des adresses
   d'images des 3 sources connues et des identifiants au format sûr sont acceptés. */
const safeImg = u => /^https:\/\/(image\.tmdb\.org|static\.tvmaze\.com|m\.media-amazon\.com)\/[^"'()<>\s\\]+$/.test(u || '') ? u : null;
const uuidSur = u => /^[\w-]{1,64}$/.test(u || '');
function metaSure(t) {
  if (!t || !uuidSur(t.uuid)) return null;
  for (const k of ['poster', 'posterBig', 'backdrop']) if (k in t) t[k] = safeImg(t[k]);
  return t;
}
const nowISO = () => new Date().toISOString();
// une date seule « AAAA-MM-JJ » est lue comme un jour local (pas minuit UTC)
const asDate = d => /^\d{4}-\d{2}-\d{2}$/.test(d) ? new Date(d + 'T00:00:00') : new Date(d);
const fmtDate = d => d ? asDate(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const pad2 = n => String(n).padStart(2, '0');
const epCode = (s, e) => `S${pad2(s)}E${pad2(e)}`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function stripHtml(h) { const d = document.createElement('div'); d.innerHTML = h || ''; return d.textContent.trim(); }

/* action facultative : { label, run } → bouton dans le toast (« Annuler », « Voir ») */
function toast(msg, ms = 2600, action = null) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('actionable', !!action);
  if (action) {
    const b = document.createElement('button');
    b.className = 'toast-btn';
    b.textContent = action.label;
    b.onclick = ev => {
      ev.stopPropagation();
      clearTimeout(t._h);
      t.classList.remove('show');
      Promise.resolve(action.run()).catch(err => toast('Erreur : ' + err.message));
    };
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), ms);
}
function initials(title) {
  return (title || '?').split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

/* ---------------- Épisodes / progression ---------------- */
function sortedSeasons(s) { return [...(s.seasons || [])].sort((a, b) => a.number - b.number); }
function realEpisodes(s) {
  const out = [];
  for (const sea of sortedSeasons(s)) {
    if (sea.is_specials || sea.number === 0) continue;
    for (const ep of [...sea.episodes].sort((a, b) => a.number - b.number)) {
      if (ep.special) continue;
      out.push({ season: sea.number, ep });
    }
  }
  return out;
}
function progress(s) {
  const eps = realEpisodes(s);
  return { watched: eps.filter(x => x.ep.is_watched).length, total: eps.length };
}
function nextUnwatched(s) {
  for (const x of realEpisodes(s)) if (!x.ep.is_watched) return x;
  return null;
}
function lastActivity(s) {
  let max = s.created_at || '';
  for (const sea of s.seasons || [])
    for (const ep of sea.episodes)
      if (ep.watched_at && ep.watched_at > max) max = ep.watched_at;
  return max;
}
/* Jour LOCAL « AAAA-MM-JJ » d'une date ou d'un horodatage ISO. Les dates de
   diffusion sont des jours calendaires ; les horodatages de visionnage sont
   en UTC : sans conversion, ce qui est vu après minuit tombait la veille. */
function dayOf(d) {
  const x = d instanceof Date ? d : new Date(d);
  return `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`;
}
function isFuture(ep) { return !!ep.air_date && ep.air_date > dayOf(new Date()); }
/* Épisodes déjà diffusés et pas encore vus : la seule définition de « restant » */
function episodesRestants(s) { return realEpisodes(s).filter(x => !x.ep.is_watched && !isFuture(x.ep)).length; }
function autoStatus(s) {
  if (s.status === 'stopped') return;
  const eps = realEpisodes(s);
  if (!eps.some(x => x.ep.is_watched)) s.status = 'not_started_yet';
  else if (eps.some(x => !x.ep.is_watched && !isFuture(x.ep))) s.status = 'continuing';
  else s.status = 'up_to_date'; // tout ce qui est diffusé est vu (les annonces ne comptent pas)
}
const STATUS_LABEL = {
  continuing: 'En cours', up_to_date: 'À jour',
  not_started_yet: 'Pas commencée', stopped: 'Arrêtée',
};

/* ================= FOURNISSEURS DE MÉTADONNÉES =================
   TMDB si une clé est configurée (images + textes en français),
   sinon TVMaze (séries) et IMDb (films) — gratuits, sans clé. */

function tmdbKey() { return (state.settings.tmdbKey || '').trim(); }
function providerFor(type) { return tmdbKey() ? 'tmdb' : (type === 'tv' ? 'tvmaze' : 'imdb'); }

/* API de suggestions IMDb (sans clé, CORS ouvert).
   titlesOnly=true → variante « titles » : pas d'acteurs dans les
   résultats, donc plus de films/séries par requête. */
function imdbSuggest(q, titlesOnly) {
  const query = String(q).trim().toLowerCase();
  let c = query[0];
  if (!/[a-z0-9]/.test(c)) c = 'x';
  return jget(`https://v2.sg.media-imdb.com/suggestion/${titlesOnly ? 'titles/' : ''}${c}/${encodeURIComponent(query)}.json`);
}
function imdbImg(url, w) {
  if (!url) return null;
  return url.replace(/\._V1_[^.]*\.jpg$/i, `._V1_UX${w}_.jpg`);
}

async function jget(url) {
  let r = await fetch(url);
  if (r.status === 429) { await sleep(4000); r = await fetch(url); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function tget(path, params = {}) {
  const key = tmdbKey();
  if (!key) throw new Error('NOKEY');
  const q = new URLSearchParams({ api_key: key, language: 'fr-FR', ...params });
  let r = await fetch(`${TMDB}${path}?${q}`);
  if (r.status === 429) { await sleep(2000); r = await fetch(`${TMDB}${path}?${q}`); }
  if (r.status === 401) throw new Error('Clé TMDB invalide');
  if (!r.ok) throw new Error(`TMDB ${r.status}`);
  return r.json();
}

function makePool(limit) {
  let running = 0; const queue = [];
  const next = () => {
    if (running >= limit || !queue.length) return;
    running++;
    const { fn, res, rej } = queue.shift();
    fn().then(res, rej).finally(() => { running--; next(); });
  };
  return fn => new Promise((res, rej) => { queue.push({ fn, res, rej }); next(); });
}
const pool = makePool(3);

function metaNeedsFetch(item, type) {
  const cur = state.tmdb[item.uuid];
  if (!cur) return true;
  const pref = providerFor(type);
  // un « introuvable » n'est pas définitif (titre mal reconnu, fiche créée plus tard) : nouvel essai après 7 jours
  const recent = d => !!d && Date.now() - new Date(d).getTime() < 7 * 86400000;
  if (cur.provider === 'tmdb' && cur.id) return false;          // déjà la meilleure source
  if (!cur.id) return !recent([cur.missAt, cur.tmdbMissAt, cur.fetchedAt].filter(Boolean).sort().pop());
  if (pref === 'tmdb') return !recent(cur.tmdbMissAt);          // clé ajoutée → on améliore
  if (cur.provider === pref) return false;                      // déjà résolu avec ce fournisseur
  return !cur.poster;
}

/* Résolution d'un film/série vers son fournisseur (affiche, synopsis, id) */
async function resolveMeta(item, type) {
  if (!metaNeedsFetch(item, type)) return state.tmdb[item.uuid];
  const pref = providerFor(type);
  const base = { uuid: item.uuid, type, provider: pref, id: null, poster: null, posterBig: null, backdrop: null, overview: null, fetchedAt: nowISO() };
  const prev = state.tmdb[item.uuid] || {};

  if (pref === 'tmdb') {
    let r = null;
    if (item.id && item.id.tvdb) {
      const f = await tget(`/find/${item.id.tvdb}`, { external_source: 'tvdb_id' });
      r = (type === 'tv' ? f.tv_results : f.movie_results)[0];
    }
    if (!r && item.id && item.id.imdb) {
      const f = await tget(`/find/${item.id.imdb}`, { external_source: 'imdb_id' });
      r = (type === 'tv' ? f.tv_results : f.movie_results)[0];
    }
    if (!r) {
      // « Foundation (2021) » → recherche « Foundation » limitée à 2021
      const q = { query: String(item.title).replace(/\s*\(\d{4}\)\s*$/, '') };
      if (type === 'movie' && item.year) q.year = item.year;
      if (type === 'tv' && titleYear(item.title)) q.first_air_date_year = titleYear(item.title);
      r = ((await tget(`/search/${type}`, q)).results || [])[0];
    }
    if (!r) {
      // introuvable chez TMDB : on garde ce qu'on avait (affiche, fiche TVMaze/IMDb)
      // et on note l'échec pour ne réessayer que dans quelques jours
      const garde = prev.uuid ? { ...prev, tmdbMissAt: nowISO(), ...(prev.id ? {} : { missAt: nowISO() }) }
        : { ...base, missAt: nowISO() };
      await saveMeta(garde);
      return garde;
    }
    if (r) {
      Object.assign(base, {
        id: r.id,
        poster: r.poster_path ? TMDB_IMG + 'w342' + r.poster_path : prev.poster || null,
        posterBig: r.poster_path ? TMDB_IMG + 'w500' + r.poster_path : null,
        backdrop: r.backdrop_path ? TMDB_IMG + 'w780' + r.backdrop_path : null,
        overview: r.overview || prev.overview || null,
        year: +((r.first_air_date || r.release_date || '').slice(0, 4)) || null,
        genres: r.genre_ids || prev.genres,
      });
    }
    base.nextEp = prev.nextEp; base.tvStatus = prev.tvStatus;
  } else if (pref === 'tvmaze') {
    // « introuvable » (404) et panne (réseau, 429, 5xx) ne sont pas la même chose :
    // une panne ne doit jamais marquer la série comme introuvable
    let show = null, panne = false;
    const essai = async url => {
      try { return await jget(url); }
      catch (e) { if (!/HTTP 404/.test(e.message)) panne = true; return null; }
    };
    if (item.id && item.id.imdb) show = await essai(`${TVMAZE}/lookup/shows?imdb=${encodeURIComponent(item.id.imdb)}`);
    if (!show && item.id && item.id.tvdb) show = await essai(`${TVMAZE}/lookup/shows?thetvdb=${encodeURIComponent(item.id.tvdb)}`);
    if (!show) show = await essai(`${TVMAZE}/singlesearch/shows?q=${encodeURIComponent(String(item.title).replace(/\s*\(\d{4}\)\s*$/, ''))}`);
    if (!show && panne) return prev.uuid ? prev : null; // on réessaiera plus tard
    if (!show) base.missAt = nowISO();
    if (show) {
      Object.assign(base, {
        id: show.id,
        poster: show.image ? show.image.medium : null,
        posterBig: show.image ? show.image.original : null,
        backdrop: show.image ? show.image.original : null,
        overview: stripHtml(show.summary) || null,
        tvStatus: show.status,
        year: show.premiered ? +show.premiered.slice(0, 4) : null,
      });
    }
  } else { // imdb (films) — API de suggestions, sans clé
    try {
      let best = null;
      if (item.id && item.id.imdb) {
        const r = await imdbSuggest(item.id.imdb);
        best = (r.d || []).find(x => x.id === item.id.imdb) || null;
      }
      if (!best) {
        const r = await imdbSuggest(item.title, true);
        best = (r.d || []).find(x =>
          x.id && x.id.startsWith('tt') && (x.qid === 'movie' || x.qid === 'tvMovie') &&
          (!item.year || !x.y || Math.abs(x.y - item.year) <= 1)) || null;
      }
      if (best) {
        Object.assign(base, {
          id: best.id,
          poster: imdbImg(best.i && best.i.imageUrl, 342),
          posterBig: imdbImg(best.i && best.i.imageUrl, 600),
        });
      }
    } catch (e) {
      return prev.uuid ? prev : null; // erreur réseau : on réessaiera
    }
  }
  await saveMeta(base);
  return base;
}

/* Chargement paresseux des affiches : seules les cartes proches du
   viewport sont résolues (préserve les limites de débit des API). */
function loadVisiblePosters() {
  const margin = 500;
  document.querySelectorAll('[data-poster-need]').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.bottom < -margin || r.top > innerHeight + margin) return;
    el.removeAttribute('data-poster-need');
    const uuid = el.dataset.poster;
    const type = el.dataset.ptype;
    const item = (type === 'tv' ? state.series : state.movies).find(x => x.uuid === uuid);
    if (!item) return;
    pool(() => resolveMeta(item, type)).then(m => {
      if (m && m.poster) {
        document.querySelectorAll(`[data-poster="${uuid}"]`).forEach(p => {
          p.innerHTML = `<img loading="lazy" src="${m.poster}" alt="">`;
        });
      }
    }).catch(() => {});
  });
}
let scrollTimer = null;
const onScrollLoad = () => {
  if (scrollTimer) return;
  scrollTimer = setTimeout(() => {
    scrollTimer = null;
    loadVisiblePosters();
    // rendu progressif de la grille Films : 60 cartes de plus près du bas
    if (state.tab === 'movies' && state.movieView === 'grid' && state._movieTotal > state.movieLimit &&
        document.documentElement.scrollHeight - scrollY - innerHeight < 1200) {
      ajouterLotFilms();
    }
    // flux infini Explorer : page TMDB suivante près du bas
    if (state.tab === 'discover' && state.discoverSearch.trim().length < 2 && state.exploreSource !== 'foryou' &&
        document.documentElement.scrollHeight - scrollY - innerHeight < 1400) {
      loadExplorePage();
    }
  }, 200);
};
addEventListener('scroll', onScrollLoad, { passive: true, capture: true });

function posterHtml(item, type, big) {
  const c = state.tmdb[item.uuid];
  const src = c && (big ? (c.posterBig || c.poster) : c.poster);
  if (src) return `<div class="poster" data-poster="${item.uuid}"><img loading="lazy" src="${src}" alt=""></div>`;
  const need = metaNeedsFetch(item, type) ? `data-poster-need data-ptype="${type}"` : '';
  return `<div class="poster" data-poster="${item.uuid}" ${need}>${esc(initials(item.title))}</div>`;
}

/* ---------------- Actualisation (nouveaux épisodes) ---------------- */
async function refreshSeries(s, full = false) {
  if (!tmdbKey()) return refreshTvmaze(s, full);
  const r = await refreshTmdb(s, full);
  // série absente de TMDB mais connue de TVMaze : on continue à la suivre par TVMaze
  const m = state.tmdb[s.uuid];
  if (!r.found && m && m.provider === 'tvmaze' && m.id) return refreshTvmaze(s, full);
  return r;
}

async function refreshTmdb(s, full) {
  const meta = await resolveMeta(s, 'tv');
  if (!meta || !meta.id || meta.provider !== 'tmdb') return { added: 0, found: false };
  const d = await tget(`/tv/${meta.id}`);
  if (d.poster_path) { meta.poster = TMDB_IMG + 'w342' + d.poster_path; meta.posterBig = TMDB_IMG + 'w500' + d.poster_path; }
  if (d.backdrop_path) meta.backdrop = TMDB_IMG + 'w780' + d.backdrop_path;
  meta.overview = d.overview || meta.overview;
  meta.tvStatus = d.status;
  meta.genres = (d.genres || []).map(g => g.id);
  meta.year = d.first_air_date ? +d.first_air_date.slice(0, 4) : (meta.year || null);
  meta.runtime = (d.episode_run_time && d.episode_run_time[0]) || (d.last_episode_to_air && d.last_episode_to_air.runtime) || meta.runtime || null;
  meta.nextEp = d.next_episode_to_air ? {
    season: d.next_episode_to_air.season_number, episode: d.next_episode_to_air.episode_number,
    name: d.next_episode_to_air.name, date: d.next_episode_to_air.air_date,
  } : null;
  meta.fetchedAt = nowISO();

  let added = 0, removed = 0, changed = false;
  const remoteSeasons = new Set((d.seasons || []).map(ds => ds.season_number));
  const toFetch = [];
  for (const ds of d.seasons || []) {
    if (ds.season_number === 0) continue;
    const local = (s.seasons || []).find(x => x.number === ds.season_number);
    const localCount = local ? local.episodes.filter(e => !e.special).length : 0;
    // saison à récupérer aussi quand elle contient des épisodes « fantômes »
    // (non vus, sans date — stubs TVDB de saisons annoncées, importés de TV Time)
    const ghosts = local && local.episodes.some(e => !e.special && !e.is_watched && !e.air_date);
    if (ds.episode_count > localCount || ghosts || (full && ds.episode_count > 0)) toFetch.push(ds.season_number);
  }
  // saisons locales que TMDB ne connaît pas du tout : purge si 100% fantômes
  for (const local of [...(s.seasons || [])]) {
    if (local.number === 0 || local.is_specials || remoteSeasons.has(local.number)) continue;
    const eps = local.episodes.filter(e => !e.special);
    if (eps.length && eps.every(e => !e.is_watched && !e.air_date)) {
      removed += eps.length;
      s.seasons = s.seasons.filter(x => x !== local);
    }
  }
  // Découpage différent (TV Time/TVDB : S1 12 + S2 12 ; TMDB : S1 de 24) : il reste
  // alors des saisons locales inconnues de TMDB. Les épisodes « en trop » d'une
  // saison TMDB sont ces mêmes épisodes : on plafonne les ajouts pour ne pas les
  // dupliquer. Sans saison orpheline, aucun plafond (vrais nouveaux épisodes).
  const orphelins = (s.seasons || []).filter(x => x.number > 0 && !x.is_specials && !remoteSeasons.has(x.number))
    .reduce((a, x) => a + x.episodes.filter(e => !e.special).length, 0);
  const surplus = (d.seasons || []).filter(ds => ds.season_number > 0).reduce((a, ds) => {
    const loc = (s.seasons || []).find(x => x.number === ds.season_number);
    return a + Math.max(0, (ds.episode_count || 0) - (loc ? loc.episodes.filter(e => !e.special).length : 0));
  }, 0);
  const budget = { n: orphelins ? Math.max(0, surplus - orphelins) : Infinity };
  const nouveaux = [];
  for (const sn of toFetch) {
    const sd = await tget(`/tv/${meta.id}/season/${sn}`);
    const r = mergeEpisodes(s, sn, (sd.episodes || []).map(de => ({
      number: de.episode_number, name: de.name, air_date: de.air_date,
    })), full, budget, nouveaux);
    added += r.added; changed = changed || r.changed;
    removed += cleanSeasonGhosts(s, sn);
  }
  return finirActualisation(s, meta, added, removed, changed, nouveaux);
}

/* Fin commune des actualisations : statut recalculé (une date qui passe peut le
   changer), écriture seulement si quelque chose a bougé, et jamais sur un objet
   remplacé entre-temps (synchro ou restauration pendant l'actualisation). */
async function finirActualisation(s, meta, added, removed, changed, nouveaux = []) {
  const avant = s.status;
  autoStatus(s);
  const actuelle = state.series.includes(s);
  if (actuelle && (added || removed || changed || s.status !== avant)) await saveSeries(s);
  if (state.tmdb[s.uuid] === meta) await saveMeta(meta);
  return { added: actuelle ? added : 0, removed: actuelle ? removed : 0, found: true, nouveaux: actuelle ? nouveaux : [] };
}

/* Après rapprochement avec la source : les épisodes non vus toujours sans
   date de diffusion sont des annonces spéculatives — on les retire (ils
   reviendront automatiquement le jour où ils auront une date). */
function cleanSeasonGhosts(s, seasonNum) {
  const local = (s.seasons || []).find(x => x.number === seasonNum);
  if (!local) return 0;
  const before = local.episodes.length;
  local.episodes = local.episodes.filter(e => e.special || e.is_watched || e.air_date);
  if (!local.episodes.length) s.seasons = s.seasons.filter(x => x !== local);
  return before - local.episodes.length;
}

async function refreshTvmaze(s, full) {
  const meta = await resolveMeta(s, 'tv');
  if (!meta || !meta.id || meta.provider !== 'tvmaze') return { added: 0, found: false };
  const d = await jget(`${TVMAZE}/shows/${meta.id}?embed=nextepisode`);
  if (d.image) { meta.poster = d.image.medium; meta.posterBig = d.image.original; meta.backdrop = d.image.original; }
  meta.overview = stripHtml(d.summary) || meta.overview;
  meta.tvStatus = d.status;
  if (d.premiered) meta.year = +d.premiered.slice(0, 4);
  const nx = d._embedded && d._embedded.nextepisode;
  meta.nextEp = nx ? { season: nx.season, episode: nx.number, name: nx.name, date: nx.airdate } : null;
  meta.fetchedAt = nowISO();

  const eps = await jget(`${TVMAZE}/shows/${meta.id}/episodes`);
  const bySeason = {};
  for (const e of eps) (bySeason[e.season] = bySeason[e.season] || []).push({ number: e.number, name: e.name, air_date: e.airdate });
  let added = 0, removed = 0, changed = false;
  const budget = { n: Infinity }; // TVMaze suit la numérotation TVDB de l'import
  const nouveaux = [];
  for (const sn of Object.keys(bySeason)) {
    const local = (s.seasons || []).find(x => x.number === +sn);
    const localCount = local ? local.episodes.filter(e => !e.special).length : 0;
    const ghosts = local && local.episodes.some(e => !e.special && !e.is_watched && !e.air_date);
    if (bySeason[sn].length > localCount || ghosts || full) {
      const r = mergeEpisodes(s, +sn, bySeason[sn], full, budget, nouveaux);
      added += r.added; changed = changed || r.changed;
      removed += cleanSeasonGhosts(s, +sn);
    }
  }
  // saisons locales inconnues de TVMaze et 100% fantômes → purge
  for (const local of [...(s.seasons || [])]) {
    if (local.number === 0 || local.is_specials || bySeason[local.number]) continue;
    const reals = local.episodes.filter(e => !e.special);
    if (reals.length && reals.every(e => !e.is_watched && !e.air_date)) {
      removed += reals.length;
      s.seasons = s.seasons.filter(x => x !== local);
    }
  }
  return finirActualisation(s, meta, added, removed, changed, nouveaux);
}

/* Fusionne les épisodes d'une saison venant du fournisseur. Renvoie le nombre
   d'ajouts et si des dates ou titres existants ont changé ; les épisodes ajoutés
   sont aussi notés dans `liste` (pour l'écran « Nouveautés »). */
function mergeEpisodes(s, seasonNum, episodes, full, budget, liste) {
  let local = (s.seasons || []).find(x => x.number === seasonNum);
  const nouvelle = !local;
  if (!local) local = { number: seasonNum, is_specials: false, episodes: [] };
  let added = 0, changed = false;
  for (const de of episodes) {
    const ep = local.episodes.find(e => e.number === de.number && !e.special);
    if (!ep) {
      if (!de.air_date) continue; // pas de date = annonce spéculative, on n'ajoute pas
      if (budget && budget.n <= 0) continue; // plafond anti-doublons (découpage différent)
      if (budget) budget.n--;
      local.episodes.push({
        id: { tvdb: null, imdb: null }, number: de.number, name: de.name,
        special: false, is_watched: false, watched_at: null,
        rewatch_count: 0, watched_count: 0, air_date: de.air_date,
      });
      if (liste) liste.push({ season: seasonNum, number: de.number, name: de.name || null, air_date: de.air_date });
      added++;
    } else {
      if (de.air_date && ep.air_date !== de.air_date) { ep.air_date = de.air_date; changed = true; }
      if (full && de.name && ep.name !== de.name) { ep.name = de.name; changed = true; }
    }
  }
  if (nouvelle && local.episodes.length) s.seasons.push(local); // jamais de saison vide
  return { added, changed };
}

/* « 3 épisodes », « 1 épisode » — accord sans parenthèses */
const pl = (n, sing, plur) => `${n.toLocaleString('fr-FR')} ${n > 1 ? (plur || sing + 's') : sing}`;

async function refreshAll(quiet = false) {
  if (state.refreshing) { if (!quiet) toast('Actualisation déjà en cours…'); return; }
  state.refreshing = true;
  $('#btn-refresh') && $('#btn-refresh').classList.add('tourne');
  // séries terminées, sans épisode annoncé, vérifiées il y a moins de 30 jours : inutile de les réinterroger chaque jour
  const il30j = Date.now() - 30 * 86400000;
  const targets = state.series.filter(s => {
    if (s.status === 'stopped') return false;
    const m = state.tmdb[s.uuid];
    const finie = m && (m.tvStatus === 'Ended' || m.tvStatus === 'Canceled') && !m.nextEp &&
      m.fetchedAt && new Date(m.fetchedAt).getTime() > il30j;
    return !finie || realEpisodes(s).some(x => !x.ep.is_watched && !x.ep.air_date);
  });
  if (!quiet) toast(`Recherche de nouveaux épisodes (${pl(targets.length, 'série')})…`, 120000);
  let totalAdded = 0, totalRemoved = 0, done = 0, errors = 0;
  const trouvailles = [];
  await Promise.all(targets.map(s => pool(async () => {
    try {
      const r = await refreshSeries(s);
      totalAdded += r.added; totalRemoved += r.removed || 0;
      for (const x of r.nouveaux || []) trouvailles.push({ uuid: s.uuid, ...x });
    }
    catch (e) { errors++; }
    done++;
    if (!quiet && done % 10 === 0 && done < targets.length) toast(`Actualisation… ${done}/${targets.length}`, 120000);
  })));
  // une date de diffusion qui passe peut changer un statut sans aucun ajout
  for (const s of state.series) {
    const avant = s.status; autoStatus(s);
    if (s.status !== avant) await saveSeries(s);
  }
  state.refreshing = false;
  $('#btn-refresh') && $('#btn-refresh').classList.remove('tourne');
  const toutEchoue = targets.length > 0 && errors === targets.length;
  if (!toutEchoue) { // sinon on réessaiera au prochain lancement au lieu d'attendre 20 h
    state.lastRefresh = nowISO();
    await DB.kvSet('lastRefresh', state.lastRefresh);
  }
  await noterNouveautes(trouvailles);
  const voir = trouvailles.length ? { label: 'Voir', run: openNouveautes } : null;
  const nettoyage = totalRemoved ? ` · ${pl(totalRemoved, 'fantôme retiré', 'fantômes retirés')}` : '';
  if (toutEchoue) {
    if (!quiet) toast('Actualisation impossible — vérifie ta connexion ou ta clé TMDB', 4500);
  } else if (!quiet) {
    toast(totalAdded
      ? `${pl(totalAdded, 'nouvel épisode trouvé', 'nouveaux épisodes trouvés')} 🎉${nettoyage}`
      : `Tout est à jour ✓${nettoyage}${errors ? ` (${pl(errors, 'série')} en erreur)` : ''}`, voir ? 6000 : 2600, voir);
  } else if (totalAdded || totalRemoved) {
    toast(`${totalAdded ? pl(totalAdded, 'nouvel épisode', 'nouveaux épisodes') + ' 🎉' : 'Nettoyage'}${nettoyage}`, voir ? 6000 : 4000, voir);
  }
  if (!quiet || totalAdded || totalRemoved) rerenderSansPerturber();
}

/* ---------------- Nouveautés : épisodes trouvés par les actualisations ----------------
   Gardés 14 jours sur l'appareil (pas synchronisés : chaque appareil a ses actualisations). */
const NV_JOURS = 14;
async function noterNouveautes(liste) {
  if (!liste.length) return;
  const trouve = nowISO();
  const cle = x => `${x.uuid}|${x.season}|${x.number}`;
  const neufs = new Set(liste.map(cle));
  const anciens = nouveautesActuelles().filter(x => !neufs.has(cle(x)));
  state.nouveautes = [...liste.map(x => ({ ...x, trouve })), ...anciens].slice(0, 300);
  await DB.kvSet('nouveautes', state.nouveautes);
}
function nouveautesActuelles() {
  const limite = Date.now() - NV_JOURS * 86400000;
  const existe = new Set(state.series.map(s => s.uuid));
  return (state.nouveautes || []).filter(x => existe.has(x.uuid) && new Date(x.trouve).getTime() > limite);
}
function openNouveautes() {
  const items = nouveautesActuelles();
  if (!$('#modal-root').innerHTML) pushLayer('modal');
  modaleCourante = null;
  state.nouveautesVues = nowISO();
  DB.kvSet('nouveautesVues', state.nouveautesVues).catch(() => {});
  const groupes = new Map();
  for (const x of items) { if (!groupes.has(x.uuid)) groupes.set(x.uuid, []); groupes.get(x.uuid).push(x); }
  const auj = todayStr();
  for (const eps of groupes.values()) eps.sort((a, b) => a.season - b.season || a.number - b.number);
  // d'abord les séries qui ont quelque chose à regarder, puis les annonces les plus proches
  const ordre = eps => (eps.some(e => e.air_date <= auj) ? '0' : '1') + eps[0].air_date;
  const html = [...groupes].sort((a, b) => ordre(a[1]).localeCompare(ordre(b[1]))).map(([uuid, eps]) => {
    const s = state.series.find(x => x.uuid === uuid);
    const dispo = eps.filter(e => e.air_date <= auj).length;
    const resume = [dispo ? pl(dispo, 'disponible') : '', eps.length > dispo ? pl(eps.length - dispo, 'annoncé') : ''].filter(Boolean).join(' · ');
    return `<div class="nvgroup">
      <div class="scard" style="padding:8px" data-action="nv-open" data-uuid="${uuid}">
        ${miniPoster(uuid, s.title)}
        <div class="mid"><div class="title" style="font-size:14px">${esc(s.title)}</div><div class="sub">${resume}</div></div>
      </div>
      ${eps.map(e => {
        const ep = trouverEpisode(s, e.season, e.number);
        const sorti = e.air_date <= auj;
        const etat = ep && ep.is_watched ? '✓ vu' : sorti ? 'disponible' : '📅 ' + compteARebours(e.air_date);
        return `<div class="nvep"><span class="badge ${sorti ? 'acc' : 'warn'}">${epCode(e.season, e.number)}</span><span class="nm">${esc(e.name || '')}</span><span class="d">${etat}</span></div>`;
      }).join('')}
    </div>`;
  }).join('');
  $('#modal-root').innerHTML = `
  <div class="modal-bg" data-action="close-modal">
    <div class="modal">
