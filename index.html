/* ---------------- Détails des films (durée, sortie, saga) ----------------
   Une passe par session, résultats gardés dans les métadonnées (donc sauvegardés
   et synchronisés). Nécessite une clé TMDB. Pool séparé : les affiches restent
   prioritaires pendant l'analyse. */
const poolFond = makePool(3);
function appliquerDetailsFilm(mt, d) {
  mt.runtime = d.runtime || null;
  mt.release = d.release_date || null;
  const c = d.belongs_to_collection;
  mt.collection = c && idSaga(c.id) ? { id: idSaga(c.id), name: String(c.name || '') } : null;
  if (d.genres) mt.genres = d.genres.map(g => g.id);
  if (!mt.overview && d.overview) mt.overview = d.overview;
  mt.detAt = nowISO();
}
const filmSansDetails = m => {
  if (metaNeedsFetch(m, 'movie')) return true;
  const t = state.tmdb[m.uuid];
  return !!(t && t.id && t.provider === 'tmdb' && !t.detAt);
};
const filmsTentes = new Set(); // une tentative par film et par session (pas de boucle si échec)
async function backfillFilms(tous, maj) {
  if (!tmdbKey() || state.filmsMetaBusy) return;
  const cibles = state.movies.filter(m => (tous || !m.is_watched) && !filmsTentes.has(m.uuid) && filmSansDetails(m));
  if (!cibles.length) return;
  cibles.forEach(m => filmsTentes.add(m.uuid));
  state.filmsMetaBusy = { done: 0, total: cibles.length };
  maj && maj();
  await Promise.all(cibles.map(m => poolFond(async () => {
    try {
      const mt = await resolveMeta(m, 'movie');
      if (mt && mt.id && mt.provider === 'tmdb' && !mt.detAt && state.tmdb[m.uuid] === mt) {
        appliquerDetailsFilm(mt, await tget(`/movie/${mt.id}`));
        await saveMeta(mt);
      }
    } catch (e) {}
    if (state.filmsMetaBusy) {
      state.filmsMetaBusy.done++;
      const el = $('#films-meta-progress'); // mise à jour en place, sans redessiner l'écran
      if (el) el.textContent = `${state.filmsMetaBusy.done}/${state.filmsMetaBusy.total}`;
    }
  })));
  state.filmsMetaBusy = null;
  maj && maj();
}
const ligneAnalyseFilms = () => state.filmsMetaBusy
  ? `<p class="loadrow" style="padding:4px 0 12px"><span class="spin"></span> Analyse de tes films… <span id="films-meta-progress">${state.filmsMetaBusy.done}/${state.filmsMetaBusy.total}</span></p>`
  : '';
const selectFiltre = (name, opts, val, label) => `<select class="fsel ${String(val) !== String(opts[0][0]) ? 'active' : ''}" data-f="${name}" aria-label="${label}">
  ${opts.map(([v, l]) => `<option value="${v}" ${String(v) === String(val) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;

/* ---------------- Sagas de films (collections TMDB) ----------------
   Le contenu des sagas vient de TMDB et reste sur l'appareil (cache, 30 jours) ;
   l'appartenance d'un film à une saga est dans ses métadonnées. */
let sagasCache = {};
/* « Shrek - Saga », « The Kissing Booth Collection » → « Shrek », « The Kissing Booth » */
const nomSaga = n => String(n || '').replace(/\s*[-–]?\s*(saga|collection)\s*$/i, '').trim() || 'Saga';
const idSaga = x => { const n = +x; return Number.isInteger(n) && n > 0 ? n : null; };
const sagaBtn = c => idSaga(c.id)
  ? `<button class="btn ghost small" data-action="open-saga" data-id="${idSaga(c.id)}">🎞️ Saga ${esc(nomSaga(c.name))}</button>` : '';
let sagasEcriture = null;
function enregistrerSagas() { // regroupe les écritures d'une rafale de chargements
  clearTimeout(sagasEcriture);
  sagasEcriture = setTimeout(() => DB.kvSet('sagas', sagasCache).catch(() => {}), 600);
}
const sagaFraiche = c => !!c && Date.now() - new Date(c.at).getTime() < 30 * 86400000;
async function chargerSaga(id) {
  id = idSaga(id);
  if (!id) throw new Error('saga inconnue');
  if (sagaFraiche(sagasCache[id])) return sagasCache[id];
  const d = await tget(`/collection/${id}`);
  const img = (p, w) => p ? safeImg(TMDB_IMG + w + p) : null;
  const saga = {
    id, name: String(d.name || 'Saga'), overview: d.overview || null,
    poster: img(d.poster_path, 'w342'),
    parts: (d.parts || []).filter(p => idSaga(p.id)).map(p => ({
      id: p.id, title: String(p.title || ''), date: /^\d{4}-\d{2}-\d{2}$/.test(p.release_date || '') ? p.release_date : null,
      poster: img(p.poster_path, 'w185'),
    })).sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999')),
    at: nowISO(),
  };
  sagasCache[id] = saga;
  enregistrerSagas();
  return saga;
}
/* films de la bibliothèque par id TMDB, et sagas auxquelles ils appartiennent */
function sagasBibliotheque() {
  const parId = new Map(), ids = new Set();
  for (const m of state.movies) {
    const t = state.tmdb[m.uuid];
    if (!t || t.provider !== 'tmdb' || !t.id) continue;
    parId.set(t.id, m);
    if (t.collection && idSaga(t.collection.id)) ids.add(idSaga(t.collection.id));
  }
  return { parId, ids };
}
/* x films vus sur y sortis, prochain à voir (ordre de sortie), prochain à sortir */
function bilanSaga(saga, parId) {
  const auj = todayStr();
  const vu = p => { const m = parId.get(p.id); return !!(m && m.is_watched); };
  const sortis = saga.parts.filter(p => p.date && p.date <= auj);
  return {
    total: sortis.length,
    vus: sortis.filter(vu).length,
    prochain: sortis.find(p => !vu(p)) || null,
    aVenir: saga.parts.find(p => !p.date || p.date > auj) || null,
  };
}
const sagasTentees = new Set();
let sagasEnPreparation = false;
async function preparerSagas() {
  if (!tmdbKey() || sagasEnPreparation) return;
  sagasEnPreparation = true;
  const ici = () => state.tab === 'movies' && state.movieView === 'sagas';
  const maj = () => { if (ici()) rerenderSansPerturber(); };
  try {
    while (state.filmsMetaBusy) await sleep(500); // passe « À voir » en cours : on l'attend
    await backfillFilms(true, maj); // il faut savoir à quelle saga appartient chaque film
    const manquantes = [...sagasBibliotheque().ids].filter(id => !sagaFraiche(sagasCache[id]) && !sagasTentees.has(id));
    if (manquantes.length) {
      manquantes.forEach(id => sagasTentees.add(id));
      state.sagasBusy = { done: 0, total: manquantes.length };
      maj();
      await Promise.all(manquantes.map(id => poolFond(async () => {
        try { await chargerSaga(id); } catch (e) {}
        state.sagasBusy.done++;
        const el = $('#sagas-progress');
        if (el) el.textContent = `${state.sagasBusy.done}/${state.sagasBusy.total}`;
      })));
      state.sagasBusy = null;
      maj();
    }
  } finally { sagasEnPreparation = false; }
}

function viewSagas() {
  if (!tmdbKey()) return `<div class="hint"><span class="em">🎞️</span><p><b>Sagas :</b> cette vue utilise TMDB. Ajoute ta clé dans Profil → Clé API TMDB.</p></div>`;
  const { parId, ids } = sagasBibliotheque();
  const cartes = [];
  for (const id of ids) {
    const saga = sagasCache[id];
    if (!saga || saga.parts.length < 2) continue;
    const b = bilanSaga(saga, parId);
    if (b.total) cartes.push({ saga, b });
  }
  const parNom = (a, b) => nomSaga(a.saga.name).localeCompare(nomSaga(b.saga.name), 'fr', { sensitivity: 'base' });
  // les plus avancées d'abord : ce sont celles qu'on a envie de finir
  const aCompleter = cartes.filter(x => x.b.vus < x.b.total)
    .sort((a, b) => b.b.vus / b.b.total - a.b.vus / a.b.total || parNom(a, b));
  const completes = cartes.filter(x => x.b.vus === x.b.total).sort(parNom);
  const carte = ({ saga, b }) => {
    const pct = Math.round(b.vus / b.total * 100);
    return `<div class="scard" data-action="open-saga" data-id="${saga.id}">
      <div class="poster">${saga.poster ? `<img loading="lazy" src="${saga.poster}" alt="">` : esc(initials(nomSaga(saga.name)))}</div>
      <div class="mid">
        <div class="title">${esc(nomSaga(saga.name))}</div>
        <div class="progress ${pct === 100 ? 'full' : ''}"><i style="width:0" data-w="${pct}%"></i></div>
        <div class="sub" style="margin-top:5px">${b.vus}/${b.total} vus${b.prochain ? ` · Prochain : ${esc(b.prochain.title)}` : ' · ✓ complète'}</div>
        ${b.aVenir ? `<div class="sub">📅 ${esc(b.aVenir.title)} · ${b.aVenir.date ? compteARebours(b.aVenir.date) : 'annoncé'}</div>` : ''}
      </div>
    </div>`;
  };
  const occupe = state.filmsMetaBusy || state.sagasBusy;
  return `
    ${ligneAnalyseFilms()}
    ${state.sagasBusy ? `<p class="loadrow" style="padding:4px 0 12px"><span class="spin"></span> Chargement des sagas… <span id="sagas-progress">${state.sagasBusy.done}/${state.sagasBusy.total}</span></p>` : ''}
    <h2 class="section" style="margin-top:2px">À compléter <span class="cnt">${aCompleter.length}</span></h2>
    ${aCompleter.length ? `<div class="card-list">${aCompleter.map(carte).join('')}</div>`
      : occupe ? '' : `<div class="empty">${cartes.length ? 'Toutes tes sagas sont complètes ! 🎉' : 'Aucune saga trouvée dans tes films.'}</div>`}
    ${completes.length ? `<h2 class="section" style="margin-top:26px">Complètes ✓ <span class="cnt">${completes.length}</span></h2>
      <div class="card-list">${completes.map(carte).join('')}</div>` : ''}`;
}

function viewMoviesWatchlist() {
  const mt = m => state.tmdb[m.uuid] || {};
  const tous = state.movies.filter(m => !m.is_watched);
  if (!tous.length) return `<div class="empty">Ta liste est vide — ajoute des films depuis l'onglet Explorer ! 🍿</div>`;
  // genres réellement présents dans la liste, du plus fréquent au plus rare
  const compte = {};
  for (const m of tous) for (const g of mt(m).genres || []) if (GENRE_NAMES[g]) compte[g] = (compte[g] || 0) + 1;
  const genresDispo = Object.entries(compte).sort((a, b) => b[1] - a[1]);
  const list = state.avGenre >= 0 ? tous.filter(m => (mt(m).genres || []).includes(state.avGenre)) : [...tous];
  const sortie = m => mt(m).release || (m.year ? String(m.year) : '');
  const duree = m => mt(m).runtime || 0;
  const t = state.avSort;
  if (t === 'az') list.sort((a, b) => a.title.localeCompare(b.title, 'fr', { sensitivity: 'base' }));
  else if (t === 'sortie') list.sort((a, b) => sortie(b).localeCompare(sortie(a)));
  else if (t === 'court') list.sort((a, b) => (duree(a) || 1e9) - (duree(b) || 1e9)); // durée inconnue à la fin
  else if (t === 'long') list.sort((a, b) => duree(b) - duree(a));
  else list.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
  // pas encore sortis : à part, du plus proche au plus lointain
  const auj = todayStr();
  const aVenir = list.filter(m => (mt(m).release || '') > auj).sort((a, b) => mt(a).release.localeCompare(mt(b).release));
  const dispo = list.filter(m => !aVenir.includes(m));
  return `
    <div class="fbar">
      ${selectFiltre('avsort', [['recent', 'Ajout récent'], ['az', 'A → Z'], ['sortie', 'Sortie ↓'], ['court', 'Plus courts'], ['long', 'Plus longs']], t, 'Trier')}
      ${selectFiltre('avgenre', [[-1, 'Tous genres'], ...genresDispo.map(([g, n]) => [g, `${GENRE_NAMES[g]} (${n})`])], state.avGenre, 'Genre')}
    </div>
    ${ligneAnalyseFilms()}
    <h2 class="section" style="margin-top:2px">À voir <span class="cnt">${dispo.length}</span></h2>
    ${dispo.length
      ? `<div class="mgrid">${dispo.map(m => movieCard(m, true)).join('')}</div>`

      <div class="mgrid">${aVenir.map(m => movieCard(m, true)).join('')}</div>` : ''}`;
}

function viewMoviesGrid() {
  const f = state.movieFilter;
  const q = state.movieSearch.trim();
  let list = state.movies.filter(m => {
    if (q) return correspond(m.title, q);
    if (f === 'vus') return m.is_watched;
    if (f === 'avoir') return !m.is_watched;
    if (f === 'favoris') return m.is_favorite;
    return true;
  });
  // filtres genre / décennie (le genre vient des métadonnées TMDB)
  if (state.movieGenre >= 0) {
    const g = GENRES[state.movieGenre];
    list = list.filter(m => {
      const meta = state.tmdb[m.uuid];
      return meta && meta.genres && meta.genres.includes(g.mv);
    });
  }
  if (state.movieDecade !== 'all') {
    list = list.filter(m => {
      if (!m.year) return false;
      if (state.movieDecade === '2020') return m.year >= 2020;
      if (state.movieDecade === '2010') return m.year >= 2010 && m.year <= 2019;
      if (state.movieDecade === '2000') return m.year >= 2000 && m.year <= 2009;
      return m.year < 2000;
    });
  }
  // tri
  if (state.movieSort === 'az') list.sort((a, b) => a.title.localeCompare(b.title, 'fr'));
  else if (state.movieSort === 'annee') list.sort((a, b) => (b.year || 0) - (a.year || 0));
  else if (state.movieSort === 'annee-asc') list.sort((a, b) => (a.year || 9999) - (b.year || 9999));
  else list.sort((a, b) => (b.watched_at || b.created_at || '').localeCompare(a.watched_at || a.created_at || ''));

  state._movieTotal = list.length;
  state._movieList = list; // pour ajouter les lots suivants sans tout redessiner
  const shown = list.slice(0, state.movieLimit);
  const chips = [['vus', 'Vus'], ['favoris', 'Favoris'], ['tous', 'Tous']];
  const sel = (name, opts, val) => `<select class="fsel ${String(val) !== String(opts[0][0]) ? 'active' : ''}" data-f="${name}">
    ${opts.map(([v, l]) => `<option value="${v}" ${String(v) === String(val) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  return `
    <div class="searchbar">${ICONS.search}<input id="movie-search" placeholder="Rechercher dans mes films…" value="${esc(state.movieSearch)}"></div>
    <div class="chips">${chips.map(([k, l]) =>
      `<button class="chip ${f === k && !q ? 'on' : ''}" data-action="movie-filter" data-f="${k}">${l}</button>`).join('')}</div>
    <div class="fbar">
      ${sel('msort', [['recent', 'Récents'], ['az', 'A → Z'], ['annee', 'Année ↓'], ['annee-asc', 'Année ↑']], state.movieSort)}
      ${sel('mgenre', [[-1, 'Tous genres'], ...GENRES.map((g, i) => [i, g.label])], state.movieGenre)}
      ${sel('mdecade', [['all', 'Toutes années'], ['2020', '2020+'], ['2010', '2010-2019'], ['2000', '2000-2009'], ['old', 'Avant 2000']], state.movieDecade)}
    </div>
    ${shown.length
      ? `<div class="mgrid" id="movies-grid">${shown.map(m => movieCard(m)).join('')}</div>
         <div id="movies-pied">${piedFilms(shown.length, list.length)}</div>`
      : `<div class="empty">Aucun film ici.</div>`}`;
}

function viewSettings() {
  const p = state.series.reduce((acc, s) => {
    const pr = progress(s); acc.w += pr.watched; acc.t += pr.total; return acc;
  }, { w: 0, t: 0 });
  let minutes = dureeFilms(state.movies.filter(m => m.is_watched));
  for (const s of state.series) {
    const w = progress(s).watched;

/* ---------------- Statistiques ---------------- */
const GENRE_NAMES = {
  28: 'Action', 12: 'Aventure', 16: 'Animation', 35: 'Comédie', 80: 'Crime',
  99: 'Documentaire', 18: 'Drame', 10751: 'Familial', 14: 'Fantastique',
  36: 'Histoire', 27: 'Horreur', 10402: 'Musique', 9648: 'Mystère',
  10749: 'Romance', 878: 'Science-Fiction', 10770: 'Téléfilm', 53: 'Thriller',
  10752: 'Guerre', 37: 'Western', 10759: 'Action & Aventure', 10762: 'Enfants',
  10763: 'Actualités', 10764: 'Télé-réalité', 10765: 'SF & Fantastique',
  10766: 'Feuilleton', 10767: 'Talk-show', 10768: 'Guerre & Politique',
};
const MOIS = ['janv', 'févr', 'mars', 'avr', 'mai', 'juin', 'juil', 'août', 'sept', 'oct', 'nov', 'déc'];

/* Écrans plein page du Profil : statistiques, journal, rétrospective */
let overlayMode = null;
function openOverlay(mode) {
  if (!overlayMode) pushLayer('overlay');
  overlayMode = mode;
  renderOverlay();
}
function renderOverlay() {
  if (overlayMode === 'stats') renderStats();
  else if (overlayMode === 'journal') renderJournal();
  else if (overlayMode === 'wrapped') renderWrapped();
  else if (overlayMode === 'menage') renderMenage();
}
/* Remplit l'écran plein page. Quand c'est un RE-rendu du même écran (une coche dans
   une fiche, un « Arrêter » dans le ménage…), on garde la position de défilement et
   les saisons ouvertes/fermées, sans rejouer l'animation d'entrée. */
let overlayCle = null, memoEcran = null;
/* avant d'ouvrir une fiche par-dessus un écran (Journal, Ménage…), on retient sa position */
function memoriserEcran() {
  const ov = $('#overlay-root .overlay');
  memoEcran = ov && overlayCle && overlayCle.startsWith('ecran:') ? { cle: overlayCle, top: ov.scrollTop } : null;
}
function remplirOverlay(html) {
  const root = $('#overlay-root');
  const cle = detailUuid ? 'detail:' + detailUuid : 'ecran:' + overlayMode;
  const ancien = root.querySelector('.overlay');
  const retour = !detailUuid && memoEcran && memoEcran.cle === cle; // retour depuis une fiche
  const meme = (!!ancien && cle === overlayCle) || retour;
  const defil = retour ? memoEcran.top : meme ? ancien.scrollTop : 0;
  if (retour) memoEcran = null;
  const etats = new Map(meme && ancien ? [...ancien.querySelectorAll('details[data-n]')].map(d => [d.dataset.n, d.open]) : []);
  root.innerHTML = html;
  overlayCle = cle;
  const nv = root.querySelector('.overlay');
  if (meme && nv) {
    nv.style.animation = 'none';
    nv.querySelectorAll('details[data-n]').forEach(d => { if (etats.has(d.dataset.n)) d.open = etats.get(d.dataset.n); });
    nv.scrollTop = defil;
  }
  return meme;
}
/* animations communes aux écrans plein page du Profil (pas rejouées sur un re-rendu) */
function animateOverlay(meme) {
  const ov = $('#overlay-root');
  if (meme) {
    ov.querySelectorAll('[data-count]').forEach(el => {
      el.textContent = (el.dataset.prefix || '') + (+el.dataset.count).toLocaleString('fr-FR') + (el.dataset.suffix || '');
      delete el.dataset.count;
    });
    ov.querySelectorAll('[data-w],[data-h]').forEach(el => {
      if (el.dataset.w) el.style.width = el.dataset.w;
      if (el.dataset.h) el.style.height = el.dataset.h;
    });
    return;
  }
  animateBars(ov);
  animateCounts(ov);
  cascade(ov, '.panel, .scard');
}

/* Complète les métadonnées de TOUTES les séries (résolution, genres, année
   de première diffusion) pour que les tris et filtres de « Mes séries »
   couvrent toute la bibliothèque. Une seule passe par session ; les
   résultats sont mémorisés, donc les passes suivantes sont quasi vides. */
const seriesMetaManquante = s => {
  const m = state.tmdb[s.uuid];
  if (metaNeedsFetch(s, 'tv')) return true;
  if (!m || !m.id) return false; // introuvable chez le fournisseur : rien à faire
  return m.provider === 'tmdb' ? (!m.genres || m.year === undefined) : m.year === undefined;
};
const seriesMetaTentees = new Set(); // une tentative par série et par session (pas de boucle si échec)
async function backfillSeriesMeta(cb) {
  if (state.seriesMetaBusy) return;
  const cibles = state.series.filter(s => !seriesMetaTentees.has(s.uuid) && seriesMetaManquante(s));
  if (!cibles.length) return;
  cibles.forEach(s => seriesMetaTentees.add(s.uuid));
  state.seriesMetaBusy = { done: 0, total: cibles.length };
  await Promise.all(cibles.map(s => pool(async () => {
    try {
      const m = await resolveMeta(s, 'tv');
      if (m && m.id && m.provider === 'tmdb' && (!m.genres || m.year === undefined)) {
        const d = await tget(`/tv/${m.id}`);
        m.genres = (d.genres || []).map(g => g.id);
        m.year = d.first_air_date ? +d.first_air_date.slice(0, 4) : null;
        await saveMeta(m);
      } else if (m && m.id && m.provider === 'tvmaze' && m.year === undefined) {
        const show = await jget(`${TVMAZE}/shows/${m.id}`);
        m.year = show.premiered ? +show.premiered.slice(0, 4) : null;
        await saveMeta(m);
      }
    } catch (e) {}
    if (state.seriesMetaBusy) {
      state.seriesMetaBusy.done++;
      const el = $('#series-meta-progress'); // mise à jour en place, sans redessiner l'écran
      if (el) el.textContent = `${state.seriesMetaBusy.done}/${state.seriesMetaBusy.total}`;
    }
  })));
  state.seriesMetaBusy = null;
  cb && cb();
}

/* Re-rendu après une tâche de fond, sans voler le focus d'un champ en cours de saisie */
function rerenderSansPerturber() {
  const a = document.activeElement;
  const dansVue = a && $('#view').contains(a);
  if (dansVue && a.tagName === 'SELECT') { setTimeout(rerenderSansPerturber, 900); return; }
  // les champs qui ne sont pas liés à l'état (clé TMDB et jeton en cours de saisie) gardent leur contenu
  const saisies = {};
  for (const id of ['tmdb-key', 'gh-token']) { const el = $('#' + id); if (el && el.value) saisies[id] = el.value; }
  const focus = dansVue && a.tagName === 'INPUT' && a.id ? { id: a.id, pos: a.selectionStart } : null;
  render();
  for (const id in saisies) { const el = $('#' + id); if (el) el.value = saisies[id]; }
  if (focus) {
    const el = $('#' + focus.id);
    if (el) { el.focus(); try { el.setSelectionRange(focus.pos, focus.pos); } catch (e) {} }
  }
}

/* Complète les genres manquants (une fois, résultats mémorisés) */
async function backfillGenres(cb) {
  if (!tmdbKey()) return;
  const targets = [];
  for (const s of state.series) {
    const m = state.tmdb[s.uuid];
    if (m && m.provider === 'tmdb' && m.id && !m.genres) targets.push({ meta: m, type: 'tv' });
  }
  for (const mv of state.movies) {
    const m = state.tmdb[mv.uuid];
    if (m && m.provider === 'tmdb' && m.id && !m.genres) targets.push({ meta: m, type: 'movie' });
  }
  const batch = targets.slice(0, 80);
  if (!batch.length) return;
  await Promise.all(batch.map(t => pool(async () => {
    try {
      const d = await tget(`/${t.type}/${t.meta.id}`);
      t.meta.genres = (d.genres || []).map(g => g.id);
      await saveMeta(t.meta);
    } catch (e) {}
  })));
  cb && cb();
}

function openStats() {
  openOverlay('stats');
  backfillGenres(() => { if (overlayMode === 'stats') renderStats(); });
}

function renderStats() {
  // événements datés (dates réelles de visionnage)
  const events = [];
  let epCount = 0;
  for (const s of state.series)
    for (const sea of s.seasons || [])
      for (const ep of sea.episodes)
        if (ep.is_watched) { epCount++; if (ep.watched_at) events.push({ d: dayOf(ep.watched_at), t: 'ep' }); }
  const mvWatched = state.movies.filter(m => m.is_watched);
  for (const m of mvWatched) {
    if (m.watched_at) events.push({ d: dayOf(m.watched_at), t: 'mv' });
    for (const r of m.rewatches || []) events.push({ d: dayOf(r), t: 'mv' });
  }

  // 12 derniers mois
  const now = new Date();
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ key: `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`, lab: MOIS[d.getMonth()], ep: 0, mv: 0 });
  }
  const mIdx = Object.fromEntries(months.map((m, i) => [m.key, i]));
  const perDay = {};
  for (const e of events) perDay[e.d] = (perDay[e.d] || 0) + 1;
  // les journées à +48 épisodes sont du cochage en masse (création du compte
  // TV Time, « tout vu » sur de vieilles séries), pas du vrai visionnage
  const bulk = new Set(Object.keys(perDay).filter(d => perDay[d] > 48));
  const days = [0, 0, 0, 0, 0, 0, 0];
  for (const e of events) {
    const mk = e.d.slice(0, 7);
    if (mk in mIdx) months[mIdx[mk]][e.t]++;
    if (!bulk.has(e.d)) days[(asDate(e.d).getDay() + 6) % 7]++;
  }
  const maxM = Math.max(1, ...months.map(m => m.ep + m.mv));
  const maxD = Math.max(1, ...days);
  // par année (l'historique complet, cochage en masse inclus)
  const byYear = {};
  for (const e of events) {
    const y = e.d.slice(0, 4);
    (byYear[y] = byYear[y] || { ep: 0, mv: 0 })[e.t]++;
  }
  const years = Object.keys(byYear).sort();
  const maxY = Math.max(1, ...years.map(y => byYear[y].ep + byYear[y].mv));
  let recDay = null, recN = 0;
  for (const [d, n] of Object.entries(perDay)) if (!bulk.has(d) && n > recN) { recN = n; recDay = d; }

  // temps estimé : durée réelle des épisodes quand elle est connue
  let minutes = dureeFilms(mvWatched);
  for (const s of state.series) {
    const w = progress(s).watched;
    if (!w) continue;
    const meta = state.tmdb[s.uuid];
    minutes += w * ((meta && meta.runtime) || 40);
  }
  const heures = Math.round(minutes / 60);

  // genres (épisodes vus pondèrent les séries, un film compte 2)
  const gcount = {};
  for (const s of state.series) {
    const m = state.tmdb[s.uuid];
    if (!m || !m.genres) continue;
    const w = progress(s).watched;
    if (!w) continue;
    for (const g of m.genres) gcount[g] = (gcount[g] || 0) + w;
  }
  for (const mv of mvWatched) {
    const m = state.tmdb[mv.uuid];
    if (!m || !m.genres) continue;
    for (const g of m.genres) gcount[g] = (gcount[g] || 0) + 2;
  }
  const topG = Object.entries(gcount).filter(([g]) => GENRE_NAMES[g]).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const maxG = Math.max(1, ...topG.map(x => x[1]));

  // top séries par épisodes vus
  const topS = state.series.map(s => ({ s, w: progress(s).watched })).filter(x => x.w > 0)
    .sort((a, b) => b.w - a.w).slice(0, 5);
  const maxS = Math.max(1, ...topS.map(x => x.w));

  const barChart = (cols, max, small) => `
    <div class="chart ${small ? 'small' : ''}">
      ${cols.map(c => `<div class="ccol" title="${c.title || ''}">
        <div class="bars">
          ${c.mv ? `<span class="seg mv" style="height:0" data-h="${c.mv / max * 100}%"></span>` : ''}
          ${c.ep ? `<span class="seg ep" style="height:0" data-h="${c.ep / max * 100}%"></span>` : ''}
        </div>
        <span class="clab">${c.lab}</span>
      </div>`).join('')}
    </div>`;

  const memeEcran = remplirOverlay(`
  <div class="overlay">
    <div class="detbar">
      <button class="iconbtn" data-action="close-stats" aria-label="Retour">${ICONS.back}</button>
      <span class="t" style="flex:1;font-weight:700">📊 Statistiques</span>
    </div>
    <main style="padding-top:4px">
      <div class="panel">
        <div class="statgrid">
          <div class="stat"><div class="v" data-count="${epCount}">0</div><div class="l">épisodes vus</div></div>
          <div class="stat"><div class="v" data-count="${mvWatched.length}">0</div><div class="l">films vus</div></div>
          <div class="stat"><div class="v" data-count="${heures}" data-prefix="≈ " data-suffix=" h">0</div><div class="l">devant l'écran*</div></div>
          <div class="stat"><div class="v" data-count="${recN}">0</div><div class="l">record en 1 jour${recDay ? '<br>' + fmtDate(recDay) : ''}</div></div>
        </div>
        <p style="margin:10px 0 0;font-size:11px;color:var(--txt2)">* durées réelles des séries quand connues (sinon 40 min/épisode), 1h50/film</p>
      </div>

      <div class="panel">
        <h3>📅 Activité des 12 derniers mois</h3>
        ${barChart(months.map(m => ({ ...m, title: `${m.lab} : ${m.ep} ép. + ${m.mv} films` })), maxM)}
        <div class="legend">
          <span><span class="dot" style="background:var(--acc)"></span>Épisodes</span>
          <span><span class="dot" style="background:#f97316"></span>Films</span>
        </div>
      </div>

      <div class="panel">
        <h3>📆 Année par année</h3>
        ${barChart(years.map(y => ({ lab: y, ...byYear[y], title: `${y} : ${byYear[y].ep} ép. + ${byYear[y].mv} films` })), maxY, true)}
        ${years.map(y => `<div class="grow">
          <span class="gl">${y}</span>
          <span class="gb"><i style="width:0" data-w="${(byYear[y].ep + byYear[y].mv) / maxY * 100}%"></i></span>
          <span class="gv" style="width:auto">${byYear[y].ep.toLocaleString('fr-FR')} ép. · ${byYear[y].mv} films</span>
        </div>`).join('')}
        <p style="margin:10px 0 0;font-size:11px;color:var(--txt2)">L'année de création de ton compte TV Time inclut tout l'historique coché ce jour-là.</p>
      </div>

      <div class="panel">
        <h3>🗓️ Par jour de la semaine</h3>
        ${barChart(['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map((lab, i) =>
          ({ lab, ep: days[i], mv: 0, title: `${lab} : ${days[i]}` })), maxD, true)}
      </div>

      <div class="panel">
        <h3>🎭 Tes genres favoris</h3>
        ${topG.length ? topG.map(([g, n]) => `
          <div class="grow">
            <span class="gl">${GENRE_NAMES[g]}</span>
            <span class="gb"><i style="width:0" data-w="${n / maxG * 100}%"></i></span>
            <span class="gv">${n}</span>
          </div>`).join('')
          : `<p style="color:var(--txt2);font-size:13px">Analyse en cours… <span class="spin"></span></p>`}
      </div>

      <div class="panel">
        <h3>🏅 Tes séries les plus regardées</h3>
        ${topS.map(({ s, w }) => `
          <div class="grow" data-action="open-series" data-uuid="${s.uuid}">
            <span class="gl">${esc(s.title)}</span>

/* ---------------- Journal de visionnage ---------------- */
const miniPoster = (uuid, title) => {
  const m = state.tmdb[uuid];
  return m && m.poster
    ? `<div class="poster" style="width:34px;height:51px"><img loading="lazy" src="${m.poster}" alt=""></div>`
    : `<div class="poster" style="width:34px;height:51px;font-size:12px">${esc(initials(title))}</div>`;
};

/* Tous les visionnages datés, du plus récent au plus ancien */
function collectEvents() {
  const ev = [];
  for (const s of state.series)
    for (const sea of s.seasons || [])
      for (const ep of sea.episodes)
        if (ep.is_watched && ep.watched_at)
          ev.push({ t: 'ep', at: ep.watched_at, d: dayOf(ep.watched_at), uuid: s.uuid, title: s.title, code: epCode(sea.number, ep.number), name: ep.name });
  for (const m of state.movies) {
    if (!m.is_watched) continue;
    if (m.watched_at) ev.push({ t: 'mv', at: m.watched_at, d: dayOf(m.watched_at), uuid: m.uuid, title: m.title, year: m.year });
    for (const r of m.rewatches || [])
      ev.push({ t: 'mv', at: r, d: dayOf(r), uuid: m.uuid, title: m.title, year: m.year, revu: true });
  }
  ev.sort((a, b) => b.at.localeCompare(a.at));
  return ev;
}

function renderJournal() {
  const ev = collectEvents();
  const shown = ev.slice(0, state.journalLimit);
  const jours = [];
  for (const e of shown) {
    const last = jours[jours.length - 1];
    if (!last || last.d !== e.d) jours.push({ d: e.d, items: [e] });
    else last.items.push(e);
  }
  const today = todayStr();
  const hier = dayOf(new Date(Date.now() - 86400000));
  const label = d => d === today ? "Aujourd'hui" : d === hier ? 'Hier'
    : asDate(d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  const ligne = e => e.t === 'ep'
    ? `<div class="scard" style="padding:8px" data-action="open-series" data-uuid="${e.uuid}">
         ${miniPoster(e.uuid, e.title)}
         <div class="mid">
           <div class="title" style="font-size:13.5px">${esc(e.title)}</div>
           <div class="sub"><span class="badge acc">${e.code}</span> ${esc(e.name || '')}</div>
         </div>
       </div>`
    : `<div class="scard" style="padding:8px" data-action="open-movie" data-uuid="${e.uuid}">
         ${miniPoster(e.uuid, e.title)}
         <div class="mid">
           <div class="title" style="font-size:13.5px">🎬 ${esc(e.title)}</div>
           <div class="sub">${e.year || ''} · ${e.revu ? 'film revu 🔁' : 'film'}</div>
         </div>
       </div>`;

  const memeEcran = remplirOverlay(`
  <div class="overlay">
    <div class="detbar">
      <button class="iconbtn" data-action="close-stats" aria-label="Retour">${ICONS.back}</button>
      <span class="t" style="flex:1;font-weight:700">📖 Journal de visionnage</span>
    </div>
    <main style="padding-top:4px">
      ${!ev.length ? `<div class="empty">Rien d'enregistré pour l'instant.</div>` : jours.map(j => {
        const cap = j.items.slice(0, 25);
        return `<h2 class="section">${label(j.d)} <span class="cnt">${j.items.length}</span></h2>
        <div class="card-list">${cap.map(ligne).join('')}</div>
        ${j.items.length > cap.length ? `<p style="color:var(--txt2);font-size:12px;padding:6px 2px">+ ${j.items.length - cap.length} autre(s) ce jour-là</p>` : ''}`;
      }).join('')}
      ${ev.length > shown.length
        ? `<div style="text-align:center;padding:18px"><button class="btn ghost small" data-action="journal-more">Afficher plus (${shown.length}/${ev.length})</button></div>`
        : ev.length ? `<p style="text-align:center;color:var(--txt2);font-size:12px;padding:18px">— début de ton historique —</p>` : ''}
    </main>
  </div>`);
  loadVisiblePosters();
  animateOverlay(memeEcran);
}

/* ---------------- Rétrospective annuelle ---------------- */
/* Calculs de la rétrospective (partagés avec l'export image) */
function computeWrapped() {
  const ev = collectEvents();
  const years = [...new Set(ev.map(e => e.d.slice(0, 4)))].sort().reverse();
  const y = String(state.wrappedYear || years[0] || new Date().getFullYear());
  const yEv = ev.filter(e => e.d.startsWith(y));
  const eps = yEv.filter(e => e.t === 'ep');
  const mvs = yEv.filter(e => e.t === 'mv');

  let minutes = dureeFilms(mvs);
  const perSerie = {};
  for (const e of eps) {
    perSerie[e.uuid] = (perSerie[e.uuid] || 0) + 1;
    const meta = state.tmdb[e.uuid];
    minutes += (meta && meta.runtime) || 40;
  }
  const heures = Math.round(minutes / 60);
  const topSeries = Object.entries(perSerie).sort((a, b) => b[1] - a[1]).slice(0, 5)
    .map(([uuid, n]) => ({ uuid, n, title: (state.series.find(s => s.uuid === uuid) || {}).title || '?' }));
  const maxTop = Math.max(1, ...topSeries.map(x => x.n));

  const perMois = {};
  for (const e of yEv) perMois[+e.d.slice(5, 7)] = (perMois[+e.d.slice(5, 7)] || 0) + 1;
  const bestMois = Object.entries(perMois).sort((a, b) => b[1] - a[1])[0];
  const joursActifs = new Set(yEv.map(e => e.d)).size;

  const gc = {};
  for (const e of eps) { const m = state.tmdb[e.uuid]; if (m && m.genres) for (const id of m.genres) gc[id] = (gc[id] || 0) + 1; }
  for (const e of mvs) { const m = state.tmdb[e.uuid]; if (m && m.genres) for (const id of m.genres) gc[id] = (gc[id] || 0) + 2; }
  const topGenres = Object.entries(gc).filter(([id]) => GENRE_NAMES[id]).sort((a, b) => b[1] - a[1]).slice(0, 3);

  let terminees = 0; // séries bouclées dans l'année
  for (const s of state.series) {
    const p = progress(s);
    if (!p.total || p.watched !== p.total) continue;
    if (String(lastActivity(s)).slice(0, 4) === y) terminees++;
  }
  return { ev, years, y, yEv, eps, mvs, heures, topSeries, maxTop, bestMois, joursActifs, topGenres, terminees };
}

function renderWrapped() {
  const { years, y, yEv, eps, mvs, heures, topSeries, maxTop, bestMois, joursActifs, topGenres, terminees } = computeWrapped();

  const memeEcran = remplirOverlay(`
  <div class="overlay">
    <div class="detbar">
      <button class="iconbtn" data-action="close-stats" aria-label="Retour">${ICONS.back}</button>
      <span class="t" style="flex:1;font-weight:700">🏆 Ma rétrospective</span>
      <button class="iconbtn" data-action="share-wrapped" title="Partager en image">🖼️</button>
    </div>
    <main style="padding-top:4px">
      <div class="chips">${years.map(yy =>
        `<button class="chip ${yy === y ? 'on' : ''}" data-action="wrapped-year" data-y="${yy}">${yy}</button>`).join('')}</div>

      <div class="panel" style="text-align:center;padding:22px 16px">
        <div style="font-size:13px;color:var(--txt2);letter-spacing:.08em;text-transform:uppercase">Ton année</div>
        <div style="font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0 14px">${y}</div>
        <div class="statgrid">
          <div class="stat"><div class="v" data-count="${eps.length}">0</div><div class="l">épisodes</div></div>
          <div class="stat"><div class="v" data-count="${mvs.length}">0</div><div class="l">films</div></div>
          <div class="stat"><div class="v" data-count="${heures}" data-suffix=" h">0</div><div class="l">de visionnage</div></div>
          <div class="stat"><div class="v" data-count="${joursActifs}">0</div><div class="l">jours actifs</div></div>
        </div>
      </div>

      ${!yEv.length ? `<div class="empty">Rien enregistré en ${y}.</div>` : `
      <div class="panel">
        <h3>🏅 Tes séries de l'année</h3>
        ${topSeries.map(t => `
          <div class="grow" data-action="open-series" data-uuid="${t.uuid}">
            <span class="gl">${esc(t.title)}</span>
            <span class="gb"><i style="width:0" data-w="${t.n / maxTop * 100}%"></i></span>
            <span class="gv">${t.n} ép.</span>
          </div>`).join('') || `<p style="color:var(--txt2);font-size:13px">Aucune série cette année.</p>`}
      </div>

      <div class="panel">
        <h3>✨ Les temps forts</h3>
        <p style="margin:0">
          ${bestMois ? `📆 Mois le plus intense : <b style="color:var(--txt)">${MOIS[bestMois[0] - 1]} ${y}</b> (${bestMois[1]} visionnages)<br>` : ''}
          ${terminees ? `🎬 Séries bouclées : <b style="color:var(--txt)">${terminees}</b><br>` : ''}
          ${topGenres.length ? `🎭 Genres dominants : <b style="color:var(--txt)">${topGenres.map(([id]) => GENRE_NAMES[id]).join(', ')}</b><br>` : ''}
          ⏱️ Soit environ <b style="color:var(--txt)">${(Math.round(heures / 24 * 10) / 10).toLocaleString('fr-FR')} jours</b> non-stop devant l'écran.
        </p>
      </div>`}
    </main>
  </div>`);
  loadVisiblePosters();
  animateOverlay(memeEcran);
}

/* ---------------- Rétrospective en image (partage) ---------------- */
async function partagerRetro() {
  const d = computeWrapped();
  const W = 1080, H = 1350, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const F = (poids, taille) => `${poids} ${taille}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;

  x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#3d3d45'; x.lineWidth = 2;
  x.strokeRect(40, 40, W - 80, H - 80);

  x.textAlign = 'center';
  x.fillStyle = '#7d7f88'; x.font = F(600, 30);
  x.fillText('M A   R É T R O S P E C T I V E', W / 2, 165);
  x.fillStyle = '#f2f2f4'; x.font = F(800, 190);
  x.fillText(d.y, W / 2, 320);

  // quatre chiffres clés
  const cases = [
    [d.eps.length.toLocaleString('fr-FR'), 'épisodes'],
    [String(d.mvs.length), 'films'],
    [d.heures.toLocaleString('fr-FR') + ' h', 'de visionnage'],
    [String(d.joursActifs), 'jours actifs'],
  ];
  cases.forEach(([v, l], i) => {
    const cx = i % 2 ? W * 0.72 : W * 0.28, cy = 470 + Math.floor(i / 2) * 175;
    x.fillStyle = '#f2f2f4'; x.font = F(800, 76);
    x.fillText(v, cx, cy);
    x.fillStyle = '#7d7f88'; x.font = F(500, 30);
    x.fillText(l, cx, cy + 46);
  });

  x.strokeStyle = '#26262b'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(120, 790); x.lineTo(W - 120, 790); x.stroke();

  // podium des séries
  x.textAlign = 'left';
  x.fillStyle = '#7d7f88'; x.font = F(600, 28);
  x.fillText('MES SÉRIES DE L\'ANNÉE', 120, 850);
  d.topSeries.slice(0, 5).forEach((t, i) => {
    const yy = 915 + i * 62;
    x.fillStyle = '#4a4a52'; x.font = F(800, 38);
    x.fillText(String(i + 1), 120, yy);
    x.fillStyle = '#f2f2f4'; x.font = F(600, 34);
    let titre = t.title;
    while (x.measureText(titre).width > 640 && titre.length > 4) titre = titre.slice(0, -2);
    if (titre !== t.title) titre += '…';
    x.fillText(titre, 175, yy);
    x.fillStyle = '#7d7f88'; x.font = F(500, 30);
    x.textAlign = 'right';
    x.fillText(`${t.n} ép.`, W - 120, yy);
    x.textAlign = 'left';
  });

  // pied de page
  x.textAlign = 'center';
  if (d.topGenres.length) {
    x.fillStyle = '#7d7f88'; x.font = F(500, 28);
    x.fillText(d.topGenres.map(([id]) => GENRE_NAMES[id]).join('  ·  '), W / 2, 1245);
  }
  x.fillStyle = '#4a4a52'; x.font = F(600, 26);
  x.fillText('Mes Séries', W / 2, 1295);

  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const nom = `retrospective-${d.y}.png`;
  const fichier = new File([blob], nom, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
    try {
      await navigator.share({ files: [fichier], title: `Ma rétrospective ${d.y}` });
      return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nom;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('Image enregistrée 🖼️');
}

/* ---------------- Ménage : séries dormantes ---------------- */
/* Séries commencées, avec des épisodes déjà diffusés en attente,
   mais sans aucune activité depuis plusieurs mois. */
function seriesDormantes(mois) {
  const seuil = mois || state.menageMois || 6;
  const limite = new Date(Date.now() - seuil * 30.4 * 86400000).toISOString();
  return state.series.filter(s => {
    if (s.status === 'stopped' || s.status === 'not_started_yet') return false;
    if (state.menageIgnore.has(s.uuid)) return false;
    if (!realEpisodes(s).some(x => !x.ep.is_watched && !isFuture(x.ep))) return false;
    const la = lastActivity(s);
    return la && la < limite;
  }).sort((a, b) => lastActivity(a).localeCompare(lastActivity(b)));
}

function moisDepuis(iso) {
  const n = Math.round((Date.now() - new Date(iso)) / (30.4 * 86400000));
  if (n >= 12) { const a = Math.floor(n / 12); return `${a} an${a > 1 ? 's' : ''}`; }
  return `${n} mois`;
}

/* ---------------- Roulette : que regarder ce soir ? ---------------- */
let genresCompletes = false;
function rouletteCandidats() {
  const f = state.roulette;
  const g = f.genre >= 0 ? GENRES[f.genre] : null;
  const out = [];
  if (f.type !== 'movie') {
    for (const s of state.series) {
      if (s.status === 'stopped') continue;
      const nx = nextUnwatched(s);
      if (!nx || isFuture(nx.ep)) continue;
      const meta = state.tmdb[s.uuid] || {};
      const genres = meta.genres || [];
      if (g && !(genres.includes(g.tv) || genres.includes(g.mv))) continue;
      const rt = meta.runtime || null;
      if (f.duree === 'court' && !(rt && rt <= 35)) continue;
      if (f.duree === 'long' && !(rt && rt > 35)) continue;
      out.push({ kind: 'tv', uuid: s.uuid, title: s.title, sub: `${epCode(nx.season, nx.ep.number)} · ${nx.ep.name || ''}`, extra: rt ? `${rt} min` : '' });
    }
  }
  if (f.type !== 'tv' && f.duree === 'all') { // les durées d'épisode ne concernent pas les films
    for (const m of state.movies) {
      if (m.is_watched) continue;
      const genres = (state.tmdb[m.uuid] || {}).genres || [];
      if (g && !genres.includes(g.mv)) continue;
      out.push({ kind: 'movie', uuid: m.uuid, title: m.title, sub: `${m.year || ''} · film`, extra: '' });
    }
  }
  return out;
}

function rouletteResultHtml() {
  const p = state.roulettePick;
  if (!p) {
    const n = rouletteCandidats().length;
    return `<div class="hint" style="margin:4px 0 0"><span class="em">🍿</span><p><b>${pl(n, 'titre')}</b> ${n > 1 ? 'correspondent' : 'correspond'} à ton envie. Lance le dé et laisse le hasard décider !</p></div>`;
  }
  return `<div class="scard" style="margin:4px 0 0" data-action="roulette-open" data-kind="${p.kind}" data-uuid="${p.uuid}">
    ${miniPoster(p.uuid, p.title)}
    <div class="mid">
      <div class="title">${esc(p.title)}</div>
      <div class="sub">${esc(p.sub)}${p.extra ? ` · ${p.extra}` : ''}</div>
      <div class="sub" style="margin-top:4px;color:var(--txt)">Appuie pour ouvrir la fiche →</div>
    </div>
  </div>`;
}

function openRoulette() {
  if (!$('#modal-root').innerHTML) pushLayer('modal');
  // genres complétés une fois par session ; on ne redessine que si c'est toujours la roulette qui est ouverte
  if (!genresCompletes) { genresCompletes = true; backfillGenres(() => { if ($('#roulette-res')) openRoulette(); }); }
  const f = state.roulette;
  const sel = (name, opts, val) => `<select class="fsel" data-r="${name}" style="flex:1;min-width:0">
    ${opts.map(([v, l]) => `<option value="${v}" ${String(v) === String(val) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  $('#modal-root').innerHTML = `
  <div class="modal-bg" data-action="close-modal">
    <div class="modal">
      <div class="grab"></div>
      <h3>🎲 Que regarder ce soir ?</h3>
      <div class="fbar" style="padding-bottom:8px">
        ${sel('type', [['all', 'Séries + Films'], ['tv', 'Séries'], ['movie', 'Films']], f.type)}
        ${sel('genre', [[-1, 'Tous genres'], ...GENRES.map((g, i) => [i, g.label])], f.genre)}
        ${f.type !== 'movie' ? sel('duree', [['all', 'Toute durée'], ['court', 'Épisode ≤ 35 min'], ['long', 'Épisode > 35 min']], f.duree) : ''}
      </div>
      <div id="roulette-res">${rouletteResultHtml()}</div>
      <button class="btn" style="width:100%;margin-top:14px" data-action="roulette-go">🎲 ${state.roulettePick ? 'Relancer le dé' : 'Piocher un titre'}</button>
    </div>
  </div>`;
}

async function rouletteGo() {
  const cands = rouletteCandidats();
  if (!cands.length) { toast('Aucun titre ne correspond — élargis les filtres'); return; }
  for (let i = 0; i < 9; i++) { // petit suspense
    const box = $('#roulette-res');
    if (!box) return; // fenêtre fermée pendant le tirage : on s'arrête là
    state.roulettePick = cands[Math.floor(Math.random() * cands.length)];
    box.innerHTML = rouletteResultHtml();
    await sleep(60 + i * 26);
  }
  if (!$('#roulette-res')) return;
  state.roulettePick = cands[Math.floor(Math.random() * cands.length)];
  if (navigator.vibrate) navigator.vibrate(18);
  openRoulette();
  confetti(26);
}

async function enrichSerieDetail(s) {
  const meta = state.tmdb[s.uuid];
  if (!meta || meta.provider !== 'tmdb' || !meta.id || !tmdbKey()) return;
  if (meta.detail && meta.detail.v === 2) return; // cache à jour
  try {
    const d = await tget(`/tv/${meta.id}`, { append_to_response: 'credits,videos', include_video_language: 'fr,en' });
    meta.detail = {
      v: 2,
      rating: d.vote_average ? Math.round(d.vote_average * 10) / 10 : null,
      votes: d.vote_count || 0,
      cast: ((d.credits && d.credits.cast) || []).slice(0, 5).map(c => ({ id: c.id, name: c.name })),
      creator: (d.created_by || []).map(c => c.name).slice(0, 2).join(', ') || null,
      trailer: pickTrailer(d.videos),
    };
    meta.genres = (d.genres || []).map(g => g.id);
    if (d.first_air_date) meta.year = +d.first_air_date.slice(0, 4);
    meta.runtime = (d.episode_run_time && d.episode_run_time[0]) || (d.last_episode_to_air && d.last_episode_to_air.runtime) || meta.runtime || null;
    await saveMeta(meta);
    if (detailUuid === s.uuid) renderDetail();
  } catch (e) {}
}

function openVuModal(cible, titre, sous) {

async function appliquerVu(quand) {
  const c = cibleVu;
  if (!c) return;
  const jour = /^\d{4}-\d{2}-\d{2}$/.test(quand);
  if (jour && quand > todayStr()) { toast('Cette date est dans le futur 📅'); return; }
  const libelle = quand === 'unknown' ? ' (date inconnue)' : quand === 'air' ? ' à la diffusion' : jour ? ` le ${fmtDate(quand)}` : '';
  if (c.type === 'movie') {
    const m = state.movies.find(x => x.uuid === c.uuid);
    if (!m) return;
    const snap = etatFilm(m);
    m.is_watched = true;
    m.watched_at = horodatage(quand, null);
    await saveMovie(m);
    if (navigator.vibrate) navigator.vibrate(12);
    openMovieModal(m.uuid); // retour à la fiche du film, à jour
    rafraichirEcrans();
    proposerAnnulation(`« ${m.title} » vu${libelle} ✓`, () => restaurerFilm(snap));
    return;
  }
  const s = state.series.find(x => x.uuid === c.uuid);
  if (!s) return;
  const snap = etatSerie(s);
  const avant = progress(s).watched;
  let msg;
  if (c.type === 'ep') {
    const ep = trouverEpisode(s, c.season, c.ep, c.special);
    if (!ep || isFuture(ep)) return;
    marquerVu(ep, quand);
    msg = `${c.special ? 'Spécial ' + c.ep : epCode(c.season, c.ep)} vu${libelle} ✓`;
  } else {
    const eps = episodesAMarquer(s, c.type === 'season' ? c.season : null);
    eps.forEach(ep => marquerVu(ep, quand));
    msg = `${pl(eps.length, 'épisode marqué vu', 'épisodes marqués vus')}${libelle} ✓`;
  }
  autoStatus(s);
  await saveSeries(s);
  closeModalViaHistory();
  if (navigator.vibrate) navigator.vibrate(12);
  if (detailUuid === s.uuid) renderDetail(); else rafraichirEcrans();
  const undo = () => restaurerSerie(snap);
  if (!feteSiTerminee(s, avant, undo)) proposerAnnulation(msg, undo);
}

/* Détails d'un épisode chez le fournisseur (image, résumé, durée, note), gardés pour la session */
const episodesInfos = new Map();
async function infosEpisode(s, seasonNum, epNum) {
  const meta = state.tmdb[s.uuid];
  if (!meta || !meta.id) return null;
  const cle = `${meta.provider}:${meta.id}:${seasonNum}:${epNum}`;
  if (episodesInfos.has(cle)) return episodesInfos.get(cle);
  let d = null;
  if (meta.provider === 'tmdb' && tmdbKey()) {
    const chemin = `/tv/${meta.id}/season/${seasonNum}/episode/${epNum}`;
    const r = await tget(chemin);
    d = {
      image: r.still_path ? safeImg(TMDB_IMG + 'w780' + r.still_path) : null,
      resume: r.overview || null, duree: r.runtime || null,
      note: r.vote_count >= 3 ? r.vote_average : null, votes: r.vote_count || 0,
    };
    if (!d.resume) { // beaucoup d'épisodes n'ont pas encore de résumé en français
      const en = await tget(chemin, { language: 'en-US' }).catch(() => null);
      if (en && en.overview) { d.resume = en.overview; d.anglais = true; }
    }
  } else if (meta.provider === 'tvmaze') {
    const r = await jget(`${TVMAZE}/shows/${meta.id}/episodebynumber?season=${seasonNum}&number=${epNum}`);
    d = {
      image: safeImg(r.image && (r.image.original || r.image.medium)),
      resume: stripHtml(r.summary) || null, anglais: !!r.summary, duree: r.runtime || null,
      note: (r.rating && r.rating.average) || null, votes: 0,
    };
  }
  episodesInfos.set(cle, d);
  return d;
}

    else still.remove();
    if (d && (d.duree || d.note)) $('#ep-infos').insertAdjacentHTML('beforeend',
      `${d.duree ? `<span class="badge">⏱ ${d.duree} min</span>` : ''}${d.note ? `<span class="badge warn">★ ${d.note.toFixed(1)}</span>` : ''}`);

      : '<span style="opacity:.6">Pas de résumé disponible.</span>';
  }).catch(() => {
    if (!encoreLa()) return;
    $('#ep-still').remove();
    $('#ep-resume').innerHTML = '<span style="opacity:.6">Détails indisponibles (connexion ?).</span>';
  });
}

function castLinks(cast) {

    : esc(c.name)).join(', ');

function pickTrailer(videos) {
  const list = (videos && videos.results || []).filter(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser'));
  const fr = list.find(v => v.iso_639_1 === 'fr' && v.type === 'Trailer');
  const key = (fr || list.find(v => v.type === 'Trailer') || list[0] || {}).key;
  return /^[\w-]{6,20}$/.test(key || '') ? key : null; // identifiant YouTube au format attendu seulement
}
const trailerBtn = key => /^[\w-]{6,20}$/.test(key || '')
  ? `<a class="btn ghost small" style="margin-top:10px" href="https://www.youtube.com/watch?v=${key}" target="_blank" rel="noopener">▶ Bande-annonce</a>`

      const genres = (d.genres || []).map(g => `<span class="badge">${esc(g.name)}</span>`).join(' ');
      if (genres) parts.push(genres);
      if (n.type === 'movie' && d.runtime) parts.push(`<span class="badge acc">${Math.floor(d.runtime / 60)}h${pad2(d.runtime % 60)}</span>`);
      if (n.type === 'tv' && d.number_of_seasons) parts.push(`<span class="badge acc">${d.number_of_seasons} saison(s) · ${d.number_of_episodes} épisodes</span>`);
      const cast = ((d.credits && d.credits.cast) || []).slice(0, 5).map(c => ({ id: c.id, name: c.name }));
      const director = ((d.credits && d.credits.crew) || []).find(c => c.job === 'Director');
      html = `<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px">${parts.join(' ')}</div>
        ${cast.length ? `<p style="margin-top:10px;font-size:12.5px;color:var(--txt2)"><b style="color:var(--txt)">Avec :</b> ${castLinks(cast)}</p>` : ''}
        ${director ? `<p style="margin-top:4px;font-size:12.5px;color:var(--txt2)"><b style="color:var(--txt)">Réalisé par :</b> ${esc(director.name)}</p>` : ''}
        ${trailerBtn(pickTrailer(d.videos))}`;
    } else if (n.provider === 'tvmaze') {
      const [show, cast] = await Promise.all([
        jget(`${TVMAZE}/shows/${n.provId}`),
        jget(`${TVMAZE}/shows/${n.provId}/cast`).catch(() => []),
      ]);
      const parts = [];
      if (show.rating && show.rating.average) parts.push(`<span class="badge warn">★ ${show.rating.average.toFixed(1)}/10</span>`);
      parts.push((show.genres || []).map(g => `<span class="badge">${esc(g)}</span>`).join(' '));
      const actors = (cast || []).slice(0, 5).map(c => c.person && c.person.name).filter(Boolean);
      html = `<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px">${parts.join(' ')}</div>
        ${actors.length ? `<p style="margin-top:10px;font-size:12.5px;color:var(--txt2)"><b style="color:var(--txt)">Avec :</b> ${esc(actors.join(', '))}</p>` : ''}`;
    }
    if (box()) box().innerHTML = html;
  } catch (e) {
    if (box()) box().innerHTML = '';
  }
}

let discoverTimer = null, rechercheNo = 0;
document.body.addEventListener('input', e => {
  if (e.target.id === 'series-search') { state.seriesSearch = e.target.value; renderKeepFocus('series-search'); }
  if (e.target.id === 'movie-search') { state.movieSearch = e.target.value; renderKeepFocus('movie-search'); }
  if (e.target.id === 'discover-search') {
    state.discoverSearch = e.target.value;
    clearTimeout(discoverTimer);
    const q = e.target.value.trim();
    if (q.length < 2) { rechercheNo++; state.discoverResults = null; state.discoverLoading = false; renderKeepFocus('discover-search'); return; }
    state.discoverLoading = true;
    renderKeepFocus('discover-search');
    const numero = ++rechercheNo; // seule la DERNIÈRE recherche lancée peut afficher ses résultats
    discoverTimer = setTimeout(async () => {
      let res;
      try { res = await searchDiscover(q); }
      catch (err) { res = []; if (numero === rechercheNo) toast('Recherche impossible : ' + (err.message === 'Failed to fetch' ? 'pas de connexion' : err.message)); }
      if (numero !== rechercheNo) return;
      state.discoverResults = res;
      state.discoverLoading = false;
      renderKeepFocus('discover-search');
    }, 420);
  }
});
function renderKeepFocus(id) {
  const el0 = $('#' + id);
  const pos = el0 ? el0.selectionStart : 0;
  render();
  const el = $('#' + id);
  if (el) { el.focus(); el.setSelectionRange(pos, pos); }
}

  }
  else if (act === 'export-full') {
    download(`mes-series-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`, fullBackupPayload());
    state.lastExport = nowISO();
    await DB.kvSet('lastExport', state.lastExport);
    toast('Sauvegarde complète téléchargée ✓');
    render();
  }
  else if (act === 'sync-connect') {
    const token = $('#gh-token').value.trim();
    if (!token) { toast('Colle d’abord ton jeton GitHub'); return; }
    $('#sync-status').innerHTML = '<span class="spin"></span> Connexion…';
    try {
      const login = await syncConnect(token);
      toast(`☁️ Sync activée pour @${login} ✓`);
      render();
    } catch (err) {
      if ($('#sync-status')) $('#sync-status').textContent = '❌ ' + err.message;
    }
  }
  else if (act === 'sync-push') {
    el.textContent = '…';
    try {
      const ok = await syncPush(false);
      if (ok) toast('☁️ Données envoyées vers le cloud ✓');
      else { toast('☁️ Le cloud a changé depuis un autre appareil — réconciliation…'); await syncAuto(); }
    } catch (err) { await noterErreurSynchro(err); toast('Erreur : ' + err.message); }
    render();
  }
  else if (act === 'sync-pull') {
    if (state.refreshing) { toast('Actualisation en cours — réessaie dans un instant'); return; }
    if (confirm('Remplacer les données de cet appareil par celles du cloud ?')) {
      el.textContent = '…';
      try {
        const r = await syncPull();
        toast(`☁️ Restauré : ${compteSauvegarde(r)} ✓`);
      } catch (err) { await noterErreurSynchro(err); toast('Erreur : ' + err.message); }
      render();
    }
  }
  else if (act === 'sync-off') {
    if (confirm('Déconnecter la synchronisation ? (les données locales et le cloud sont conservés, mais ne se parleront plus)')) {
      await deconnecterSynchro();
      toast('Synchronisation déconnectée');
      render();
    }
  }
  else if (act === 'clear-all') {
    const cloud = syncPret();
    const msg = cloud
      ? 'Effacer TOUTES les données de ce téléphone ?\n\nLa synchronisation sera d’abord déconnectée (et le jeton GitHub retiré) : ta sauvegarde dans le cloud reste intacte et pourra être récupérée.'
      : 'Effacer TOUTES les données de l’application ? Cette action est irréversible.';
    if (confirm(msg)) {
      if (cloud) await deconnecterSynchro(); // sinon le téléphone vide écraserait le cloud
      await DB.clear('series'); await DB.clear('movies'); await DB.clear('tmdb');
      state.series = []; state.movies = []; state.tmdb = {};
      state.nouveautes = []; await DB.kvSet('nouveautes', []);
      libVersion++;
      toast('Données effacées');
      render();
    }
  }
});

/* Déconnexion complète de la synchro (jeton retiré, état de synchro remis à zéro) */
async function deconnecterSynchro() {
  delete state.settings.ghToken; delete state.settings.gistId; delete state.settings.ghLogin;
  state.lastSync = null; state.lastSyncVersion = null; state.syncErr = null;
  await saveSettings();
  await DB.kvSet('lastSync', null); await DB.kvSet('lastSyncVersion', null); await DB.kvSet('syncErr', null);
}

/* ---------------- Animations ---------------- */
/* Barres (largeurs/hauteurs) rendues à zéro puis portées à leur valeur */
function animateBars(root) {
  const cibles = (root || document).querySelectorAll('[data-w],[data-h]');
  if (!cibles.length) return;
  // délai court plutôt que rAF : fiable même quand la page n'est pas composée
  setTimeout(() => cibles.forEach(el => {
    if (el.dataset.w) { el.style.width = el.dataset.w; delete el.dataset.w; }
    if (el.dataset.h) { el.style.height = el.dataset.h; delete el.dataset.h; }
  }), 40);
}

/* Compteurs qui grimpent jusqu'à leur valeur */
function animateCounts(root) {
  (root || document).querySelectorAll('[data-count]').forEach(el => {
    const cible = +el.dataset.count;
    delete el.dataset.count;
    if (!isFinite(cible)) return;
    const pre = el.dataset.prefix || '', suf = el.dataset.suffix || '';
    const duree = cible > 400 ? 1000 : 650, t0 = Date.now();
    const finale = () => { el.textContent = pre + cible.toLocaleString('fr-FR') + suf; };
    let fini = false;
    const pas = () => {
      if (fini) return;
      const p = Math.min(1, (Date.now() - t0) / duree);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = pre + Math.round(cible * e).toLocaleString('fr-FR') + suf;
      if (p < 1) requestAnimationFrame(pas); else fini = true;
    };
    requestAnimationFrame(pas);
    setTimeout(() => { if (!fini) { fini = true; finale(); } }, duree + 260); // filet de sécurité
  });
}

/* Apparition en cascade des premières cartes */
function cascade(root, sel) {
  const els = [...root.querySelectorAll(sel)].slice(0, 24);
  els.forEach((el, i) => {
    el.style.animation = `riseIn .38s cubic-bezier(.22,.9,.28,1) ${i * 26}ms backwards`;
  });
}

/* Pluie de confettis (moment de fête : série terminée, titre pioché) */
function confetti(n = 46) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let box = $('#confetti');
  if (!box) { box = document.createElement('div'); box.id = 'confetti'; document.body.appendChild(box); }
  const couleurs = ['#f2f2f4', '#9aa1b0', '#4ade80', '#fbbf24', '#e8e8ec'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.style.left = (12 + Math.random() * 76) + 'vw';
    p.style.top = (24 + Math.random() * 18) + 'vh';
    p.style.background = couleurs[i % couleurs.length];
    p.style.setProperty('--dx', (Math.random() * 220 - 110) + 'px');
    p.style.setProperty('--dy', (58 + Math.random() * 62) + 'vh');
    p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    p.style.animationDelay = (Math.random() * 220) + 'ms';
    box.appendChild(p);
  }
  setTimeout(() => { box.innerHTML = ''; }, 2200);
}

/* Fête quand une série passe à 100 % */
function feteSiTerminee(s, avant, annuler) {
  const p = progress(s);
  if (p.total && avant < p.total && p.watched === p.total) {
    confetti();
    if (navigator.vibrate) navigator.vibrate([16, 60, 26]);
    const msg = `🎉 « ${s.title} » terminée — bravo !`;
    if (annuler) proposerAnnulation(msg, annuler); else toast(msg, 3600);
    return true;
  }
  return false;
}

let lastViewKey = null;
function afterRender() {
  loadVisiblePosters();
  animateBars($('#view'));
  animateCounts($('#view'));
  // « Mes séries » : complète en fond les années/genres manquants pour les filtres
  if (state.tab === 'series' && state.seriesView === 'grid' && !state.seriesMetaBusy) {
    backfillSeriesMeta(() => {
      if (state.tab === 'series' && state.seriesView === 'grid') rerenderSansPerturber();
    });
  }
  // Films : durées, dates de sortie et sagas complétées en fond
  if (state.tab === 'movies' && tmdbKey()) {
    if (state.movieView === 'avoir') backfillFilms(false, () => {
      if (state.tab === 'movies' && state.movieView === 'avoir') rerenderSansPerturber();
    });
    else if (state.movieView === 'sagas') preparerSagas();
  }
  // cascade uniquement quand on change réellement d'écran (pas à chaque re-rendu)
  const key = [state.tab, state.seriesView, state.movieView, state.seriesFilter,
    state.movieFilter, state.exploreType, state.exploreSource].join('|');
  if (key !== lastViewKey) {
    lastViewKey = key;
    cascade($('#view'), '.mcard, .scard, .pcard, .panel, .hero');
  }
  const heros = $('#heros');
  if (heros) {
    heros.addEventListener('scroll', () => {
      clearTimeout(heros._t);
      heros._t = setTimeout(() => {
        const i = Math.round(heros.scrollLeft / (heros.clientWidth || 1));
        document.querySelectorAll('.hdot').forEach((d, j) => d.classList.toggle('on', j === i));
      }, 80);
    }, { passive: true });
  }
}

/* ---------------- Démarrage ---------------- */
(async function init() {
  await DB.open();
  const [series, movies, tmdb, settings, lastRefresh, hidden, lastExport, changedAt, lastSync, lastSyncVersion, syncErr] = await Promise.all([
    DB.getAll('series'), DB.getAll('movies'), DB.getAll('tmdb'),
    DB.kvGet('settings'), DB.kvGet('lastRefresh'), DB.kvGet('hidden'),
    DB.kvGet('lastExport'), DB.kvGet('changedAt'), DB.kvGet('lastSync'),
    DB.kvGet('lastSyncVersion'), DB.kvGet('syncErr'),
  ]);
  state.menageIgnore = new Set((await DB.kvGet('menageIgnore')) || []);
  state.nouveautes = (await DB.kvGet('nouveautes')) || [];
  state.nouveautesVues = (await DB.kvGet('nouveautesVues')) || null;
  sagasCache = (await DB.kvGet('sagas')) || {};
  state.series = series || [];
  state.movies = movies || [];
  state.settings = settings || {};
  state.lastRefresh = lastRefresh || null;
  state.lastExport = lastExport || null;
  state.changedAt = changedAt || null;
  state.lastSync = lastSync || null;
  state.lastSyncVersion = lastSyncVersion || null;
  state.syncErr = syncErr || null;
  state.hidden = new Set(hidden || []);
  // les métadonnées orphelines (titre supprimé, ajout interrompu) sont retirées
  const existe = new Set([...state.series.map(s => s.uuid), ...state.movies.map(m => m.uuid)]);
  for (const t of tmdb || []) {
    if (existe.has(t.uuid) && metaSure(t)) state.tmdb[t.uuid] = t;
    else DB.del('tmdb', t.uuid).catch(() => {});
  }
  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  // stockage persistant : empêche Android de purger les données
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().then(ok => { state.stockagePersistant = ok; }).catch(() => {});
  }
  // synchronisation cloud à chaque retour dans l'app (une PWA reste souvent ouverte
  // des jours), envoi des changements quand on la quitte — sans jamais écraser un
  // cloud modifié ailleurs entre-temps (syncPush vérifie la révision)
  let derniereVerif = Date.now();
  document.addEventListener('visibilitychange', () => {
    if (!syncPret()) return;
    if (document.visibilityState === 'hidden') {
      if (state.lastSync && (state.changedAt || '') > state.lastSync) syncPush(false).catch(noterErreurSynchro);
    } else if (Date.now() - derniereVerif > 30000) {
      derniereVerif = Date.now();
      syncAuto();
    }
  });

  // d'abord la synchro, ENSUITE l'actualisation automatique (au plus une fois par
  // 20 h) : en parallèle, l'actualisation réécrivait d'anciennes données par-dessus
  // celles qui venaient d'arriver du cloud
  setTimeout(async () => {
    await syncAuto();
    if (state.series.length && navigator.onLine !== false &&
        (!state.lastRefresh || Date.now() - new Date(state.lastRefresh) > 20 * 3600 * 1000)) {
      refreshAll(true);
    }
  }, 1200);
  // rappel de sauvegarde : au-delà de 30 jours
  const dataAge = state.lastExport ? Date.now() - new Date(state.lastExport) : Infinity;
  if ((state.series.length || state.movies.length) && dataAge > 30 * 86400 * 1000) {
    setTimeout(() => toast('💾 Pense à exporter une sauvegarde depuis ton Profil !', 5000), 8000);
  }
})();
</script>
