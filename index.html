  for (const e of eps) (bySeason[e.season] = bySeason[e.season] || []).push({ number: e.number, name: e.name, air_date: e.airdate });
  let added = 0, removed = 0, changed = false;
  const budget = { n: Infinity }; // TVMaze suit la numérotation TVDB de l'import
  const nouveaux = [];
  for (const sn of Object.keys(bySeason)) {
    const local = (s.seasons || []).find(x => x.number === +sn);
    const localCount = local ? local.episodes.filter(e => !e.special).length : 0;
    const ghosts = local && local.episodes.some(e => !e.special && !e.is_watched && !e.air_date);
    if (bySeason[sn].length > localCount || ghosts || full) {
      const r = mergeEpisodes(s, +sn, bySeason[sn], full, budget, nouveaux);
      added += r.added; changed = changed || r.changed;
      removed += cleanSeasonGhosts(s, +sn);
    }
  }
  // saisons locales inconnues de TVMaze et 100% fantômes → purge
  for (const local of [...(s.seasons || [])]) {
    if (local.number === 0 || local.is_specials || bySeason[local.number]) continue;
    const reals = local.episodes.filter(e => !e.special);
    if (reals.length && reals.every(e => !e.is_watched && !e.air_date)) {
      removed += reals.length;
      s.seasons = s.seasons.filter(x => x !== local);
    }
  }
  return finirActualisation(s, meta, added, removed, changed, nouveaux);
}

/* Fusionne les épisodes d'une saison venant du fournisseur. Renvoie le nombre
   d'ajouts et si des dates ou titres existants ont changé ; les épisodes ajoutés
   sont aussi notés dans `liste` (pour l'écran « Nouveautés »). */
function mergeEpisodes(s, seasonNum, episodes, full, budget, liste) {
  let local = (s.seasons || []).find(x => x.number === seasonNum);
  const nouvelle = !local;
  if (!local) local = { number: seasonNum, is_specials: false, episodes: [] };
  let added = 0, changed = false;
  for (const de of episodes) {
    const ep = local.episodes.find(e => e.number === de.number && !e.special);
    if (!ep) {
      if (!de.air_date) continue; // pas de date = annonce spéculative, on n'ajoute pas
      if (budget && budget.n <= 0) continue; // plafond anti-doublons (découpage différent)
      if (budget) budget.n--;
      local.episodes.push({
        id: { tvdb: null, imdb: null }, number: de.number, name: de.name,
        special: false, is_watched: false, watched_at: null,
        rewatch_count: 0, watched_count: 0, air_date: de.air_date,
      });
      if (liste) liste.push({ season: seasonNum, number: de.number, name: de.name || null, air_date: de.air_date });
      added++;
    } else {
      if (de.air_date && ep.air_date !== de.air_date) { ep.air_date = de.air_date; changed = true; }
      if (full && de.name && ep.name !== de.name) { ep.name = de.name; changed = true; }
    }
  }
  if (nouvelle && local.episodes.length) s.seasons.push(local); // jamais de saison vide
  return { added, changed };
}

/* « 3 épisodes », « 1 épisode » — accord sans parenthèses */
const pl = (n, sing, plur) => `${n.toLocaleString('fr-FR')} ${n > 1 ? (plur || sing + 's') : sing}`;

async function refreshAll(quiet = false) {
  if (state.refreshing) { if (!quiet) toast('Actualisation déjà en cours…'); return; }
  state.refreshing = true;
  $('#btn-refresh') && $('#btn-refresh').classList.add('tourne');
  // séries terminées, sans épisode annoncé, vérifiées il y a moins de 30 jours : inutile de les réinterroger chaque jour
  const il30j = Date.now() - 30 * 86400000;
  const targets = state.series.filter(s => {
    if (s.status === 'stopped') return false;
    const m = state.tmdb[s.uuid];
    const finie = m && (m.tvStatus === 'Ended' || m.tvStatus === 'Canceled') && !m.nextEp &&
      m.fetchedAt && new Date(m.fetchedAt).getTime() > il30j;
    return !finie || realEpisodes(s).some(x => !x.ep.is_watched && !x.ep.air_date);
  });
  if (!quiet) toast(`Recherche de nouveaux épisodes (${pl(targets.length, 'série')})…`, 120000);
  let totalAdded = 0, totalRemoved = 0, done = 0, errors = 0;
  const trouvailles = [];
  await Promise.all(targets.map(s => pool(async () => {
    try {
      const r = await refreshSeries(s);
      totalAdded += r.added; totalRemoved += r.removed || 0;
      for (const x of r.nouveaux || []) trouvailles.push({ uuid: s.uuid, ...x });
    }
    catch (e) { errors++; }
    done++;
    if (!quiet && done % 10 === 0 && done < targets.length) toast(`Actualisation… ${done}/${targets.length}`, 120000);
  })));
  // une date de diffusion qui passe peut changer un statut sans aucun ajout
  for (const s of state.series) {
    const avant = s.status; autoStatus(s);
    if (s.status !== avant) await saveSeries(s);
  }
  state.refreshing = false;
  $('#btn-refresh') && $('#btn-refresh').classList.remove('tourne');
  const toutEchoue = targets.length > 0 && errors === targets.length;
  if (!toutEchoue) { // sinon on réessaiera au prochain lancement au lieu d'attendre 20 h
    state.lastRefresh = nowISO();
    await DB.kvSet('lastRefresh', state.lastRefresh);
  }
  await noterNouveautes(trouvailles);
  const voir = trouvailles.length ? { label: 'Voir', run: openNouveautes } : null;
  const nettoyage = totalRemoved ? ` · ${pl(totalRemoved, 'fantôme retiré', 'fantômes retirés')}` : '';
  if (toutEchoue) {
    if (!quiet) toast('Actualisation impossible — vérifie ta connexion ou ta clé TMDB', 4500);
  } else if (!quiet) {
    toast(totalAdded
      ? `${pl(totalAdded, 'nouvel épisode trouvé', 'nouveaux épisodes trouvés')} 🎉${nettoyage}`
      : `Tout est à jour ✓${nettoyage}${errors ? ` (${pl(errors, 'série')} en erreur)` : ''}`, voir ? 6000 : 2600, voir);
  } else if (totalAdded || totalRemoved) {
    toast(`${totalAdded ? pl(totalAdded, 'nouvel épisode', 'nouveaux épisodes') + ' 🎉' : 'Nettoyage'}${nettoyage}`, voir ? 6000 : 4000, voir);
  }
  if (!quiet || totalAdded || totalRemoved) rerenderSansPerturber();
}

/* ---------------- Nouveautés : épisodes trouvés par les actualisations ----------------
   Gardés 14 jours sur l'appareil (pas synchronisés : chaque appareil a ses actualisations). */
const NV_JOURS = 14;
async function noterNouveautes(liste) {
  if (!liste.length) return;
  const trouve = nowISO();
  const cle = x => `${x.uuid}|${x.season}|${x.number}`;
  const neufs = new Set(liste.map(cle));
  const anciens = nouveautesActuelles().filter(x => !neufs.has(cle(x)));
  state.nouveautes = [...liste.map(x => ({ ...x, trouve })), ...anciens].slice(0, 300);
  await DB.kvSet('nouveautes', state.nouveautes);
}
function nouveautesActuelles() {
  const limite = Date.now() - NV_JOURS * 86400000;
  const existe = new Set(state.series.map(s => s.uuid));
  return (state.nouveautes || []).filter(x => existe.has(x.uuid) && new Date(x.trouve).getTime() > limite);
}
function openNouveautes() {

      </div>

        const ep = trouverEpisode(s, e.season, e.number);

        return `<div class="nvep"><span class="badge ${sorti ? 'acc' : 'warn'}">${epCode(e.season, e.number)}</span><span class="nm">${esc(e.name || '')}</span><span class="d">${etat}</span></div>`;

      ${html || '<div class="empty" style="padding:30px 10px">Aucune nouveauté récente.</div>'}
    </div>

  if (state.tab === 'series' || state.tab === 'home') rerenderSansPerturber(); // le lien « nouveaux » redevient discret
}

/* ---------------- Recherche / tendances (Découvrir) ---------------- */
async function searchDiscover(q) {
  const out = [];
  if (tmdbKey()) {
    const r = await tget('/search/multi', { query: q });
    for (const x of r.results || []) {
      if (x.media_type !== 'tv' && x.media_type !== 'movie') continue;
      out.push(normTmdb(x, x.media_type));
    }
  } else {
    try {
      const shows = await jget(`${TVMAZE}/search/shows?q=${encodeURIComponent(q)}`);
      for (const { show } of shows.slice(0, 10)) {
        out.push({
          type: 'tv', provider: 'tvmaze', provId: show.id,
          title: show.name, year: show.premiered ? +show.premiered.slice(0, 4) : null,
          poster: safeImg(show.image && show.image.medium),
          overview: stripHtml(show.summary),
          rating: (show.rating && show.rating.average) || null,
        });
      }
    } catch (e) {}
    try {
      const r = await imdbSuggest(q, true);
      for (const x of (r.d || [])) {
        if (!x.id || !x.id.startsWith('tt') || (x.qid !== 'movie' && x.qid !== 'tvMovie')) continue;
        out.push({
          type: 'movie', provider: 'imdb', provId: x.id,
          title: x.l, year: x.y || null,
          poster: safeImg(imdbImg(x.i && x.i.imageUrl, 342)),
          overview: x.s || null, // acteurs principaux, faute de synopsis
        });
      }
    } catch (e) {}
  }
  return out;
}

function normTmdb(x, type) {
  return {
    type, provider: 'tmdb', provId: x.id,
    title: x.title || x.name,
    orig: x.original_title || x.original_name || null,
    year: +((x.release_date || x.first_air_date || '').slice(0, 4)) || null,
    poster: x.poster_path ? safeImg(TMDB_IMG + 'w342' + x.poster_path) : null,
    overview: x.overview || null,
    rating: x.vote_average ? Math.round(x.vote_average * 10) / 10 : null,
    genreIds: x.genre_ids || [],
    backdrop: x.backdrop_path ? safeImg(TMDB_IMG + 'w780' + x.backdrop_path) : null,
    date: x.release_date || x.first_air_date || null,
  };
}
const todayStr = () => dayOf(new Date());
/* Nombre de jours d'ici à une date (négatif = passé) */
function joursAvant(d) {
  if (!d) return null;
  const cible = new Date(d + 'T00:00:00');
  const auj = new Date(); auj.setHours(0, 0, 0, 0);
  return Math.round((cible - auj) / 86400000);
}
/* Prochain épisode annoncé, seulement s'il n'est pas déjà passé : une date périmée
   (actualisation pas encore faite) ne doit pas s'afficher comme « à venir » */
const nextEpValide = m => (m && m.nextEp && (!m.nextEp.date || m.nextEp.date >= todayStr())) ? m.nextEp : null;
/* « demain », « dans 3 jours », « dans 5 semaines »… */
function compteARebours(d) {
  const n = joursAvant(d);
  if (n === null) return '';
  if (n < 0) return fmtDate(d);
  if (n === 0) return "aujourd'hui";
  if (n === 1) return 'demain';
  if (n <= 13) return `dans ${n} jours`;
  if (n <= 70) return `dans ${Math.round(n / 7)} semaines`;
  const mois = Math.round(n / 30);
  return `dans ${mois} mois`;
}
const fmtShort = d => d ? new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : '';

/* Normalisation de titre : minuscules, sans accents ni ponctuation,
   sans suffixe d'année « (2024) » — pour comparer malgré les variantes */
function normTitle(t) {
  return String(t || '').toLowerCase().normalize('NFD')
    .replace(/[̀-ͯ]/g, '').replace(/\(\d{4}\)/g, '')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
/* Recherche tolérante (accents, ponctuation, espaces en trop), avec repli simple quand la saisie
   est dans une écriture non latine (que normTitle viderait) */
function correspond(titre, saisie) {
  const qn = normTitle(saisie);
  if (qn) return normTitle(titre).includes(qn);
  const qb = String(saisie || '').trim().toLowerCase();
  return !qb || String(titre).toLowerCase().includes(qb);
}
function titleYear(t) {
  const m = String(t || '').match(/\((\d{4})\)/);
  return m ? +m[1] : null;
}

/* Liste noire persistante des suggestions « pas intéressé » */
const hkey = n => `${n.provider}:${n.type}:${n.provId}`;

/* Index « déjà dans ma bibliothèque », reconstruit seulement quand la bibliothèque
   change (et non plus pour chaque vignette d'Explorer). Les métadonnées orphelines
   (titre supprimé, ajout interrompu) ne comptent pas. */
let libVersion = 0, libIdx = null, libIdxSig = '';
function libIndex() {
  const sig = `${state.series.length}|${state.movies.length}|${Object.keys(state.tmdb).length}|${libVersion}`;
  if (libIdx && sig === libIdxSig) return libIdx;
  const existe = new Set([...state.series.map(s => s.uuid), ...state.movies.map(m => m.uuid)]);
  const ids = new Set();
  for (const m of Object.values(state.tmdb)) if (m.id && existe.has(m.uuid)) ids.add(`${m.provider}:${m.type}:${m.id}`);
  const ajoute = (map, k, v) => { if (!map.has(k)) map.set(k, []); map.get(k).push(v); };
  const films = new Map(), series = new Map();
  for (const m of state.movies) ajoute(films, normTitle(m.title), m.year || null);
  for (const s of state.series) ajoute(series, normTitle(s.title), titleYear(s.title));
  libIdx = { ids, films, series };
  libIdxSig = sig;
  return libIdx;
}
function inLibrary(n) {
  const ix = libIndex();
  if (ix.ids.has(`${n.provider}:${n.type}:${n.provId}`)) return true;
  const cands = [n.title, n.orig].filter(Boolean).map(normTitle);
  if (n.type === 'movie') return cands.some(c => (ix.films.get(c) || []).some(y => !n.year || !y || Math.abs(y - n.year) <= 1));
  // séries : si les deux années sont connues et diffèrent, ce sont deux séries
  // distinctes (ex. Avatar 2005 animé vs Avatar 2024 Netflix)
  return cands.some(c => (ix.series.get(c) || []).some(sy => !(sy && n.year && Math.abs(sy - n.year) > 1)));
}

/* Genres : identifiants TMDB (films / séries n'ont pas les mêmes) */
const GENRES = [
  { label: 'Action', mv: 28, tv: 10759 },
  { label: 'Comédie', mv: 35, tv: 35 },
  { label: 'Drame', mv: 18, tv: 18 },
  { label: 'Science-Fiction', mv: 878, tv: 10765 },
  { label: 'Fantastique', mv: 14, tv: 10765 },
  { label: 'Horreur', mv: 27, tv: 9648 },
  { label: 'Thriller', mv: 53, tv: 80 },
  { label: 'Animation', mv: 16, tv: 16 },
  { label: 'Romance', mv: 10749, tv: null },
  { label: 'Familial', mv: 10751, tv: 10751 },
  { label: 'Documentaire', mv: 99, tv: 99 },
  { label: 'Guerre', mv: 10752, tv: 10768 },
];

/* ---------------- « Pour toi » : suggestions personnalisées ----------------
   1. Chaque titre de la bibliothèque reçoit un poids : série finie ou bien avancée =
      aimée ; arrêtée ou lâchée après quelques épisodes = à éviter ; liste « À voir » et
      sagas suivies = envies du moment. (Les dates de visionnage importées en masse de
      TV Time ne disent rien des goûts : la récence ne joue qu'un rôle secondaire.)
   2. Le profil de genres est calculé sur TOUTE la bibliothèque.
   3. 14 titres « sources », variés (jamais 14 titres du même genre) : une seule requête
      TMDB chacun donne les recommandations, les mots-clés et la langue.
   4. Score : recommandé par combien de sources aimées + affinité de genres + note fiable
      (moyenne bayésienne) + langue + fraîcheur, moins ce qui ressemble aux abandons.
   5. Diversité (3 titres au plus par source) et raison affichée sur chaque titre.
   « Autres idées » tire d'autres sources au hasard parmi les titres aimés et écarte ce
   qui a déjà été proposé : la liste change vraiment. */
const pourToiVus = new Set();   // titres déjà proposés pendant cette session
let pourToiGeneration = 0;      // 0 = les meilleures sources ; ensuite un tirage varié
const jaccard = (a, b) => {
  const A = new Set(a), B = new Set(b);
  let commun = 0;
  for (const x of A) if (B.has(x)) commun++;
  return A.size + B.size - commun ? commun / (A.size + B.size - commun) : 0;
};
const ilYaAns = d => d ? (Date.now() - new Date(d).getTime()) / (365.25 * 86400000) : 99;

/* Poids de chaque titre de la bibliothèque (positif = aimé, négatif = à éviter) */
function poidsBibliotheque(type) {
  const items = [];
  if (type === 'tv') {
    for (const s of state.series) {
      const m = state.tmdb[s.uuid];
      if (!m || m.provider !== 'tmdb' || !m.id) continue;
      const eps = realEpisodes(s).filter(x => !isFuture(x.ep));
      const vus = eps.filter(x => x.ep.is_watched).length, part = vus / Math.max(1, eps.length);
      let dernier = '';
      for (const x of eps) if (x.ep.watched_at && x.ep.watched_at > dernier) dernier = x.ep.watched_at;
      let base;
      if (s.status === 'stopped') base = part < 0.5 ? -0.8 : 0.3;   // arrêtée tôt = rejet ; tard = lassitude
      else if (!vus) base = 0.12;                                    // ajoutée mais pas commencée : simple curiosité
      else if (part >= 0.8 || vus >= 20) base = 1;
      else if (part >= 0.4) base = 0.75;
      else if (vus >= 4) base = 0.5;
      else base = ilYaAns(dernier) > 0.5 ? -0.3 : 0.2;               // 1 à 3 épisodes puis plus rien : pas accroché
      if (s.is_favorite) base += 0.6;
      const recence = 0.5 + 0.5 * Math.pow(0.5, ilYaAns(dernier || s.created_at) / 1.5);
      items.push({ titre: s.title, id: m.id, genres: m.genres || [], poids: base > 0 ? base * recence : base, liste: false });
    }
  } else {
    const parSaga = {};
    for (const f of state.movies) {
      const t = state.tmdb[f.uuid];
      if (f.is_watched && t && t.collection) parSaga[t.collection.id] = (parSaga[t.collection.id] || 0) + 1;
    }
    for (const f of state.movies) {
      const t = state.tmdb[f.uuid];
      if (!t || t.provider !== 'tmdb' || !t.id) continue;
      let base = f.is_watched ? 0.6 : 0.85;                              // « À voir » = envie du moment
      if (f.is_favorite) base += 0.6;
      base += Math.min(0.6, 0.3 * (f.rewatch_count || 0));
      if (t.collection && parSaga[t.collection.id] >= 2) base += 0.25;   // saga suivie
      if (f.is_watched && ilYaAns(f.watched_at) < 1.5) base += 0.25;     // vu récemment
      items.push({ titre: f.title, id: t.id, genres: t.genres || [], poids: base, liste: !f.is_watched });
    }
  }
  return items;
}

/* Sources variées : chaque nouvelle source est pénalisée si ses genres ressemblent à
   ceux des sources déjà choisies. Avec `hasard`, l'ordre des titres aimés est brassé. */
function choisirSources(items, n, hasard, deja = []) {
  const cands = items.filter(x => x.poids > 0)
    .map(x => ({ ...x, cle: x.poids * (hasard ? 0.55 + Math.random() * 0.9 : 1) }))
    .sort((a, b) => b.cle - a.cle);
  const sources = [...deja];
  while (sources.length < deja.length + n && cands.length) {
    let meilleur = 0, valeur = -Infinity;
    for (let i = 0; i < Math.min(cands.length, 80); i++) {
      const ressemblance = sources.length ? Math.max(...sources.map(s => jaccard(s.genres, cands[i].genres))) : 0;
      const v = cands[i].cle - 0.55 * ressemblance;
      if (v > valeur) { valeur = v; meilleur = i; }
    }
    sources.push(cands.splice(meilleur, 1)[0]);
  }
  return sources;
}

/* Métadonnées TMDB manquantes des titres qui comptent (séries entamées, films de la
   liste, vus récemment, favoris) : résolues une fois, puis mémorisées */
async function preparerMetasPourToi() {
  const besoin = [
    ...state.series.filter(s => s.status !== 'stopped' && progress(s).watched > 0).map(s => [s, 'tv']),
    ...state.movies.filter(f => !f.is_watched || f.is_favorite || f.rewatch_count || ilYaAns(f.watched_at) < 1.5).map(f => [f, 'movie']),
  ].filter(([it, type]) => metaNeedsFetch(it, type)).slice(0, 60);
  await Promise.all(besoin.map(([it, type]) => pool(() => resolveMeta(it, type)).catch(() => null)));
}

async function pourToiType(type) {
  const items = poidsBibliotheque(type);
  const hasard = pourToiGeneration > 0;
  // films : 3 sources tirées de la liste « À voir », le reste de ce qui a été vu
  const sources = choisirSources(items.filter(x => !x.liste), 14 - (type === 'movie' ? 3 : 0), hasard,
    type === 'movie' ? choisirSources(items.filter(x => x.liste), 3, hasard) : []);
  // profil de genres sur toute la bibliothèque
  const gPos = {}, gNeg = {};
  let total = 0;
  for (const it of items) {
    if (it.poids > 0) total += it.poids;
    for (const g of it.genres) {
      if (it.poids > 0) gPos[g] = (gPos[g] || 0) + it.poids;
      else gNeg[g] = (gNeg[g] || 0) - it.poids;
    }
  }
  const part = g => (gPos[g] || 0) / Math.max(1, total);
  const partMax = Math.max(0.01, ...Object.keys(gPos).map(part));
  const rejets = items.filter(x => x.poids < -0.5);

  // une requête par source : recommandations + mots-clés + langue
  const motsCles = {}, langues = {}, candidats = new Map(), recosRejets = new Set();
  const ajoute = (x, src, apport, theme) => {
    let c = candidats.get(x.id);
    if (!c) { c = { x, n: normTmdb(x, type), apports: [], theme: null }; candidats.set(x.id, c); }
    if (theme) c.theme = c.theme || theme;
    else c.apports.push([src, apport]);
  };
  await Promise.all(sources.map(src => pool(async () => {
    try {
      const d = await tget(`/${type}/${src.id}`, { append_to_response: 'recommendations,keywords' });
      langues[d.original_language] = (langues[d.original_language] || 0) + src.poids;
      for (const k of (d.keywords && (d.keywords.results || d.keywords.keywords)) || []) {
        const mc = motsCles[k.id] = motsCles[k.id] || { nom: k.name, w: 0, sources: [] };
        mc.w += src.poids;
        mc.sources.push(src.titre);
      }
      ((d.recommendations && d.recommendations.results) || []).forEach((x, rang) => ajoute(x, src, src.poids / (1 + 0.12 * rang)));
    } catch (e) {}
  })));
  // ce que TMDB recommande à partir des séries abandonnées est pénalisé
  await Promise.all(rejets.slice(0, 4).map(src => pool(async () => {
    try { for (const x of (await tget(`/${type}/${src.id}/recommendations`)).results || []) recosRejets.add(x.id); } catch (e) {}
  })));
  // thèmes communs à plusieurs sources (mots-clés précis, pas « suite » ni « adapté d'un roman »)
  const GENERIQUES = /^(sequel|prequel|remake|reboot|based on .*|duringcreditsstinger|aftercreditsstinger|woman director|live action remake|3d|imax|new york city|los angeles, california|london, england|television adaptation|female protagonist|male protagonist|spin off|anthology|miniseries|parent child relationship|friendship|family|teenager|high school|love)$/i;
  const themes = Object.entries(motsCles).filter(([, v]) => v.sources.length >= 2 && !GENERIQUES.test(v.nom))
    .sort((a, b) => b[1].w - a[1].w).slice(0, 4);
  await Promise.all(themes.map(([id, v]) => pool(async () => {
    try {
      const r = await tget(`/discover/${type}`, { with_keywords: id, sort_by: 'vote_average.desc', 'vote_count.gte': type === 'tv' ? 150 : 600 });
      for (const x of r.results || []) ajoute(x, null, 0, v);
    } catch (e) {}
  })));

  // score
  const totalLangues = Object.values(langues).reduce((a, b) => a + b, 0) || 1;
  const somme = c => c.apports.reduce((a, b) => a + b[1], 0);
  const collabMax = Math.max(0.01, ...[...candidats.values()].map(somme));
  const themeMax = themes.length ? themes[0][1].w : 1;
  const NICHE = type === 'tv' ? [10762, 10763, 10764, 10766, 10767] : [10770, 99, 10402]; // jeunesse, télé-réalité, talk-shows, téléfilms…
  const poidsGenre = id => (id === 18 || id === 35) ? 0.35 : 1;  // drame et comédie sont partout : ils disent peu
  const anneeCourante = new Date().getFullYear();
  const liste = [];
  for (const c of candidats.values()) {
    const x = c.x, n = c.n;
    if (!n.poster || inLibrary(n) || state.hidden.has(hkey(n))) continue;
    const g = x.genre_ids || [];
    if (g.some(id => NICHE.includes(id) && part(id) < 0.03)) continue;
    const collab = somme(c) / collabMax;
    const affinite = g.length ? g.reduce((a, id) => a + poidsGenre(id) * part(id) / partMax, 0) / g.reduce((a, id) => a + poidsGenre(id), 0) : 0;
    const malus = g.reduce((a, id) => a + (gNeg[id] || 0), 0) / Math.max(1, total) * 3;
    const votes = x.vote_count || 0, m = type === 'tv' ? 80 : 300;
    const note = (votes * (x.vote_average || 0) + m * 6.6) / (votes + m);   // moyenne bayésienne : peu de votes = prudence
    const qualite = Math.max(-1, Math.min(1, (note - 6.6) / 1.4));
    const langue = (langues[x.original_language] || 0) / totalLangues;
    let s = collab + 0.5 * affinite + 0.5 * qualite + 0.35 * Math.min(1, langue * 2) + (c.theme ? 0.35 * Math.min(1, c.theme.w / themeMax) : 0);
    if (!langue) s -= 0.35;
    if (n.year >= anneeCourante - 3) s += 0.12;
    else if (n.year && n.year < 2000 && note < 7.8) s -= 0.2;
    if (votes < (type === 'tv' ? 40 : 150)) s -= 0.6;
    if (note < 6.3) s -= 0.4;
    if (recosRejets.has(x.id)) s -= 0.4;
    if (pourToiVus.has(type + ':' + x.id)) s -= 0.6;
    s -= malus;
    c.score = s;
    c.meilleures = [...c.apports].sort((a, b) => b[1] - a[1]);
    liste.push(c);
  }
  liste.sort((a, b) => b.score - a.score);

  // diversité : 3 titres au plus par source, pénalité pour les titres trop semblables
  const choisis = [], parSource = new Map(), reserve = liste.slice(0, 150);
  while (choisis.length < 36 && reserve.length) {
    let meilleur = -1, valeur = -Infinity;
    for (let i = 0; i < reserve.length; i++) {
      const c = reserve[i], src = c.meilleures[0] ? c.meilleures[0][0] : null;
      if (src && (parSource.get(src) || 0) >= 3) continue;
      const ressemblance = choisis.length ? Math.max(...choisis.map(o =>
        jaccard(o.x.genre_ids || [], c.x.genre_ids || []) * 0.6 + (src && o.meilleures[0] && o.meilleures[0][0] === src ? 0.4 : 0))) : 0;
      const v = c.score - 0.3 * ressemblance;
      if (v > valeur) { valeur = v; meilleur = i; }
    }
    if (meilleur < 0) break;
    const c = reserve.splice(meilleur, 1)[0];
    const src = c.meilleures[0] ? c.meilleures[0][0] : null;
    if (src) parSource.set(src, (parSource.get(src) || 0) + 1);
    const noms = c.meilleures.slice(0, 2).map(t => t[0].titre);
    if (src && src.liste) {
      c.n.why = `Comme ${noms[0]}`;
      c.n.pourquoi = `Proche de « ${noms[0]} », qui est dans ta liste À voir`;
    } else if (noms.length) {
      c.n.why = `Comme ${noms.join(' · ')}`;
      c.n.pourquoi = `Parce que tu as aimé ${noms.map(t => `« ${t} »`).join(' et ')}`;
    } else {
      const proches = c.theme.sources.slice(0, 2);
      c.n.why = `Comme ${proches[0]}`;
      c.n.pourquoi = `Dans la veine de ${proches.map(t => `« ${t} »`).join(' et ')}`;
    }
    choisis.push(c);
  }
  return { titres: choisis.map(c => c.n), refs: sources.filter(s => !s.liste).slice(0, 5).map(s => s.titre) };
}

/* Chargement à la demande des sections de Découvrir (cache en mémoire) */
async function loadSection(key) {
  if (!tmdbKey() || state.discoverData[key] || state.discoverBusy[key]) return;
  state.discoverBusy[key] = true;
  try {
    let data;
    if (key === 'top') {
      // seuil de votes élevé pour éviter les notes gonflées de titres confidentiels
      const topTv = { sort_by: 'vote_average.desc', 'vote_count.gte': 2500 };
      const topMv = { sort_by: 'vote_average.desc', 'vote_count.gte': 8000 };
      const [t1, t2, m1, m2] = await Promise.all([
        tget('/discover/tv', topTv), tget('/discover/tv', { ...topTv, page: 2 }),
        tget('/discover/movie', topMv), tget('/discover/movie', { ...topMv, page: 2 }),
      ]);
      data = {
        tv: [...t1.results, ...t2.results].map(x => normTmdb(x, 'tv')),
        mv: [...m1.results, ...m2.results].map(x => normTmdb(x, 'movie')),
      };
    } else if (key === 'upcoming') {
      const today = new Date().toISOString().slice(0, 10);
      const [mv, tv] = await Promise.all([
        tget('/movie/upcoming', { region: 'FR' }),
        tget('/discover/tv', { 'first_air_date.gte': today, sort_by: 'popularity.desc' }),
      ]);
      data = {
        mv: (mv.results || []).map(x => normTmdb(x, 'movie')),
        tv: (tv.results || []).map(x => normTmdb(x, 'tv')),
      };
    } else if (key.startsWith('genre:')) {
      const g = GENRES[+key.slice(6)];
      const reqs = [tget('/discover/movie', { with_genres: g.mv, sort_by: 'popularity.desc', 'vote_count.gte': 300 })];
      if (g.tv) reqs.push(tget('/discover/tv', { with_genres: g.tv, sort_by: 'popularity.desc', 'vote_count.gte': 100 }));
      const [mv, tv] = await Promise.all(reqs);
      data = {
        mv: (mv.results || []).map(x => normTmdb(x, 'movie')),
        tv: tv ? (tv.results || []).map(x => normTmdb(x, 'tv')) : [],
      };
    } else if (key === 'foryou') {
      await preparerMetasPourToi();
      const [tv, mv] = await Promise.all([pourToiType('tv'), pourToiType('movie')]);
      data = { tv: tv.titres, mv: mv.titres, refsTv: tv.refs, refsMv: mv.refs };
    }
    state.discoverData[key] = data;
  } catch (e) {
    state.discoverData[key] = { error: e.message };
  }
  state.discoverBusy[key] = false;
  if (state.tab === 'discover' || (key === 'foryou' && state.tab === 'home')) rerenderSansPerturber();
}

async function loadTrending() {
  if (state.trending || state.trendingLoading) return;
  state.trendingLoading = true;
  try {
    if (tmdbKey()) {
      const [tv, mv] = await Promise.all([tget('/trending/tv/week'), tget('/trending/movie/week')]);
      state.trending = {
        mode: 'tmdb',
        tv: (tv.results || []).map(x => normTmdb(x, 'tv')),
        mv: (mv.results || []).map(x => normTmdb(x, 'movie')),
      };
    } else {
      // Sans clé : séries diffusées en streaming ces jours-ci (TVMaze),
      // triées par popularité. Mis en cache une journée.
      const today = new Date().toISOString().slice(0, 10);
      const cached = await DB.kvGet('trendingNoKey');
      if (cached && cached.date === today) {
        state.trending = cached.data;
      } else {
        const all = [];
        for (let i = -2; i <= 5; i++) {
          const d = new Date(Date.now() + i * 86400000).toISOString().slice(0, 10);
          try { all.push(...await jget(`${TVMAZE}/schedule/web?date=${d}`)); } catch (e) {}
        }
        const shows = new Map();
        for (const ep of all) {
          const sh = ep._embedded && ep._embedded.show;
          if (sh && sh.image && !shows.has(sh.id)) shows.set(sh.id, sh);
        }
        const tv = [...shows.values()]
          .filter(sh => (sh.weight || 0) >= 85)
          .sort((a, b) => (b.weight || 0) - (a.weight || 0))
          .slice(0, 20)
          .map(sh => ({
            type: 'tv', provider: 'tvmaze', provId: sh.id,
            title: sh.name, year: sh.premiered ? +sh.premiered.slice(0, 4) : null,
            poster: safeImg(sh.image.medium), overview: stripHtml(sh.summary),
          }));
        state.trending = { mode: 'tvmaze', tv, mv: [] };
        await DB.kvSet('trendingNoKey', { date: today, data: state.trending });
      }
    }
  } catch (e) {}
  state.trendingLoading = false;
  if (state.tab === 'discover') rerenderSansPerturber();
}

/* ---------------- Ajout à la bibliothèque ---------------- */
const ajoutsEnCours = new Set(); // un double appui ne crée jamais de doublon
async function addItem(n, watched = false) {
  const cle = `${n.type}:${n.provider}:${n.provId}`;
  if (ajoutsEnCours.has(cle)) return;
  if (inLibrary(n)) { toast(`« ${n.title} » est déjà dans ta bibliothèque`); return; }
  ajoutsEnCours.add(cle);
  toast('Ajout en cours…', 30000);
  let serieEnCours = null;
  try {
    if (n.type === 'movie') {
      const m = {
        id: { tvdb: null, imdb: null }, uuid: crypto.randomUUID(),
        created_at: nowISO(), title: n.title, year: n.year,
        watched_at: watched ? nowISO() : null, is_watched: watched,
        is_favorite: false, rewatch_count: 0,
      };
      if (n.provider === 'tmdb') {
        const d = await tget(`/movie/${n.provId}`);
        if (d.imdb_id && state.movies.some(x => x.id && x.id.imdb === d.imdb_id)) {
          toast(`« ${n.title} » est déjà dans tes films`); render(); return;
        }
        m.id.imdb = d.imdb_id || null;
        const meta = { uuid: m.uuid, type: 'movie', provider: 'tmdb', id: d.id,
          poster: d.poster_path ? TMDB_IMG + 'w342' + d.poster_path : null,
          posterBig: d.poster_path ? TMDB_IMG + 'w500' + d.poster_path : null,
          backdrop: d.backdrop_path ? TMDB_IMG + 'w780' + d.backdrop_path : null,
          overview: d.overview, fetchedAt: nowISO() };
        appliquerDetailsFilm(meta, d); // durée, sortie, saga, genres
        await saveMeta(meta);
      } else {
        m.id.imdb = String(n.provId).startsWith('tt') ? n.provId : null;
        await saveMeta({ uuid: m.uuid, type: 'movie', provider: n.provider, id: n.provId,
          poster: n.poster, posterBig: imdbImg(n.poster, 600) || n.poster,
          overview: null, fetchedAt: nowISO() });
      }
      state.movies.push(m);
      await saveMovie(m);
      toast(watched ? `« ${n.title} » ajouté aux films vus ✓` : `« ${n.title} » ajouté aux films à voir ✓`);
    } else {
      // récupère les identifiants externes pour bloquer les doublons
      // même quand les titres diffèrent (import TV Time vs titre TMDB)
      let extIds = { tvdb: null, imdb: null };
      if (n.provider === 'tmdb') {
        const ext = await tget(`/tv/${n.provId}/external_ids`).catch(() => ({}));
        extIds = { tvdb: ext.tvdb_id || null, imdb: ext.imdb_id || null };
      } else if (n.provider === 'tvmaze') {
        const show = await jget(`${TVMAZE}/shows/${n.provId}`).catch(() => null);
        if (show && show.externals) extIds = { tvdb: show.externals.thetvdb || null, imdb: show.externals.imdb || null };
      }
      if (extIds.tvdb && state.series.some(x => x.id && x.id.tvdb === extIds.tvdb)) {
        toast(`« ${n.title} » est déjà dans tes séries`); render(); return;
      }
      if (extIds.imdb && state.series.some(x => x.id && x.id.imdb === extIds.imdb)) {
        toast(`« ${n.title} » est déjà dans tes séries`); render(); return;
      }
      const s = {
        uuid: crypto.randomUUID(), id: extIds,
        created_at: nowISO(), title: n.title, status: 'not_started_yet',
        is_favorite: false, seasons: [],
      };
      serieEnCours = s;
      // méta en mémoire seulement : elle n'est enregistrée qu'avec la série, une fois l'ajout réussi
      state.tmdb[s.uuid] = { uuid: s.uuid, type: 'tv', provider: n.provider === 'tmdb' ? 'tmdb' : 'tvmaze', id: n.provId,
        poster: n.poster, overview: n.overview, year: n.year || null, genres: n.genreIds && n.genreIds.length ? n.genreIds : undefined, fetchedAt: nowISO() };
      state.series.push(s);
      const r = await refreshSeries(s, true); // récupère toutes les saisons + épisodes
      if (!r.found) throw new Error('série introuvable chez le fournisseur');
      if (watched) await markAllWatched(s);
      await saveSeries(s);
      if (state.tmdb[s.uuid]) await saveMeta(state.tmdb[s.uuid]);
      serieEnCours = null;
      const p = progress(s);
      toast(watched
        ? `« ${n.title} » ajoutée, ${pl(p.watched, 'épisode marqué vu', 'épisodes marqués vus')} ✓`
        : `« ${n.title} » ajoutée (${pl(p.total, 'épisode')}) ✓`);
    }
    render();
  } catch (e) {
    if (serieEnCours) { // ajout interrompu (réseau…) : aucune trace, le titre reste ajoutable
      state.series = state.series.filter(x => x !== serieEnCours);
      delete state.tmdb[serieEnCours.uuid];
      await DB.del('series', serieEnCours.uuid).catch(() => {});
      await DB.del('tmdb', serieEnCours.uuid).catch(() => {});
    }
    toast(`Ajout impossible : ${e.message}`);
    render();
  } finally {
    ajoutsEnCours.delete(cle);
  }
}

/* ---------------- Import / export ---------------- */
function classifyImport(arr) {
  const series = [], movies = [];
  for (const it of arr) {
    if (!it || !uuidSur(it.uuid) || !it.title) continue;
    if (Array.isArray(it.seasons)) series.push(it); else movies.push(it);
  }
  return { series, movies };
}

/* Import d'un export TV Time : FUSION avec la bibliothèque, jamais d'écrasement.
   Une série ou un film déjà présent (même uuid, ou mêmes identifiants TVDB/IMDb)
   garde sa progression ; l'import ne fait que cocher ce qui ne l'était pas, et
   ne décoche jamais rien. */
async function importData(arr) {
  const { series, movies } = classifyImport(arr);
  const trouveSerie = s => state.series.find(x => x.uuid === s.uuid) ||
    (s.id && s.id.tvdb && state.series.find(x => x.id && x.id.tvdb === s.id.tvdb)) ||
    (s.id && s.id.imdb && state.series.find(x => x.id && x.id.imdb === s.id.imdb)) || null;
  const trouveFilm = m => state.movies.find(x => x.uuid === m.uuid) ||
    (m.id && m.id.imdb && state.movies.find(x => x.id && x.id.imdb === m.id.imdb)) || null;
  const aEcrireS = [], aEcrireM = [];
  let nouvellesS = 0, fusionneesS = 0, nouveauxM = 0, fusionnesM = 0;
  for (const s of series) {
    const loc = trouveSerie(s);
    if (!loc) {
      autoStatus(s); // normalise les statuts parfois incohérents de l'export TV Time
      state.series.push(s); aEcrireS.push(s); nouvellesS++;
      continue;
    }
    let change = false;
    for (const seaI of s.seasons || []) {
      let seaL = loc.seasons.find(x => x.number === seaI.number);
      if (!seaL) { loc.seasons.push(seaI); change = true; continue; }
      for (const epI of seaI.episodes || []) {
        const epL = seaL.episodes.find(e => e.number === epI.number && !!e.special === !!epI.special);
        if (!epL) { seaL.episodes.push(epI); change = true; continue; }
        if (epI.is_watched && !epL.is_watched) {
          Object.assign(epL, { is_watched: true, watched_at: epI.watched_at, watched_count: Math.max(1, epI.watched_count || 0) });
          change = true;
        } else if (epI.is_watched && epL.is_watched && epI.watched_at && (!epL.watched_at || epI.watched_at < epL.watched_at)) {
          epL.watched_at = epI.watched_at; change = true; // la date la plus ancienne est la vraie
        }
      }
    }
    if (s.is_favorite && !loc.is_favorite) { loc.is_favorite = true; change = true; }
    if (change) { autoStatus(loc); aEcrireS.push(loc); }
    fusionneesS++;
  }
  for (const m of movies) {
    const loc = trouveFilm(m);
    if (!loc) { state.movies.push(m); aEcrireM.push(m); nouveauxM++; continue; }
    let change = false;
    if (m.is_watched && !loc.is_watched) { Object.assign(loc, { is_watched: true, watched_at: m.watched_at }); change = true; }
    else if (m.is_watched && loc.is_watched && m.watched_at && (!loc.watched_at || m.watched_at < loc.watched_at)) { loc.watched_at = m.watched_at; change = true; }
    if (m.is_favorite && !loc.is_favorite) { loc.is_favorite = true; change = true; }
    if (change) aEcrireM.push(loc);
    fusionnesM++;
  }
  // une seule transaction par magasin, au lieu d'une par élément
  if (aEcrireS.length) await DB.putAll('series', aEcrireS);
  if (aEcrireM.length) await DB.putAll('movies', aEcrireM);
  if (aEcrireS.length || aEcrireM.length) markChanged();
  return { series: series.length, movies: movies.length, nouvellesS, fusionneesS, nouveauxM, fusionnesM };
}
window.__import = importData; // hook de test/débogage

/* Sauvegarde complète : tout dans un seul fichier */
function fullBackupPayload() {

/* Une sauvegarde est-elle exploitable ? (évite d'appliquer un fichier tronqué ou étranger) */
function sauvegardeValide(p) {
  return !!p && p.app === 'mes-series' && Array.isArray(p.series) && Array.isArray(p.movies) &&
    p.series.every(s => s && uuidSur(s.uuid) && s.title && Array.isArray(s.seasons)) &&
    p.movies.every(m => m && uuidSur(m.uuid) && m.title);
}

/* Restauration complète, ATOMIQUE : tout est remplacé dans une seule transaction.
   Si quoi que ce soit échoue, rien n'est modifié (plus de base à moitié vidée). */
async function importFull(p) {
  if (!sauvegardeValide(p)) throw new Error('sauvegarde invalide ou incomplète');
  // jamais pendant une actualisation (synchro, restauration, connexion : tous les chemins passent ici)
  while (state.refreshing) await sleep(300);
  return new Promise((res, rej) => {
    const tx = DB.db.transaction(['series', 'movies', 'tmdb', 'kv'], 'readwrite');
    const S = tx.objectStore('series'), M = tx.objectStore('movies'), T = tx.objectStore('tmdb'), K = tx.objectStore('kv');
    S.clear(); M.clear(); T.clear();
    for (const s of p.series) S.put(s);
    for (const m of p.movies) M.put(m);
    const metas = (p.tmdb || []).map(metaSure).filter(Boolean);
    for (const t of metas) T.put(t);
    const hidden = [...new Set(p.hidden || [])];
    K.put(hidden, 'hidden');
    tx.oncomplete = async () => {
      state.series = p.series;
      state.movies = p.movies;
      state.tmdb = {};
      for (const t of metas) state.tmdb[t.uuid] = t;
      state.hidden = new Set(hidden);
      libVersion++;
      if (p.settings && p.settings.tmdbKey && !tmdbKey()) {
        state.settings.tmdbKey = p.settings.tmdbKey;
        await saveSettings();
      }
      res();
    };
    tx.onerror = tx.onabort = () => rej(tx.error || new Error('restauration annulée'));
  });
}

async function handleFiles(files) {
  const tot = { nouvellesS: 0, fusionneesS: 0, nouveauxM: 0, fusionnesM: 0 };
  let lu = false;
  for (const f of files) {
    try {
      const data = JSON.parse(await f.text());
      if (data && data.app === 'mes-series') {
        // sauvegarde complète → restauration intégrale
        if (!sauvegardeValide(data)) throw new Error('format');
        if (state.refreshing) { toast('Actualisation en cours — réessaie dans un instant'); return; }
        if (!confirm(`Restaurer la sauvegarde complète du ${fmtDate(data.exported_at)} ?\n(${pl(data.series.length, 'série')}, ${pl(data.movies.length, 'film')} — remplace les données actuelles)`)) continue;
        await importFull(data);
        markChanged();
        toast(`Sauvegarde restaurée : ${pl(state.series.length, 'série')}, ${pl(state.movies.length, 'film')} ✓`);
        render();
        return;
      }
      if (!Array.isArray(data)) throw new Error('format');
      const r = await importData(data);
      for (const k in tot) tot[k] += r[k];
      lu = true;
    } catch (e) {
      toast(`Fichier « ${f.name} » illisible ou au mauvais format`);
    }
  }
  if (lu) {
    const bouts = [];
    if (tot.nouvellesS || tot.nouveauxM) bouts.push(`ajoutés : ${pl(tot.nouvellesS, 'série')}, ${pl(tot.nouveauxM, 'film')}`);
    if (tot.fusionneesS || tot.fusionnesM) bouts.push(`déjà présents, fusionnés sans rien décocher : ${pl(tot.fusionneesS + tot.fusionnesM, 'titre')}`);
    toast(`Import réussi ✓ ${bouts.join(' · ')}`, 5000);
    render();
  }
}
function download(name, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ================= SYNCHRONISATION CLOUD =================
   Sauvegarde dans un gist GitHub privé. Chaque personne utilise
   SON propre compte GitHub : les données ne se mélangent jamais.

   Chaque synchro réussie mémorise la RÉVISION du gist (lastSyncVersion) :
   - avant d'envoyer, on vérifie que le cloud n'a pas bougé depuis (sinon
     on réconcilie au lieu d'écraser ce qu'un autre appareil a envoyé) ;
   - au lancement et au retour dans l'app, une simple lecture de la révision
     dit s'il y a quelque chose à télécharger (plus de 2 Mo à chaque ouverture). */
const GH = 'https://api.github.com';
const SYNC_FILE = 'mes-series-sync.json';

async function ghFetch(path, opts = {}) {
  const r = await fetch(GH + path, {
    cache: 'no-store', // l'API GitHub autorise 60 s de cache : une révision périmée fausserait la synchro
    ...opts,
    headers: {
      Authorization: 'Bearer ' + (state.settings.ghToken || ''),
      Accept: 'application/vnd.github+json',
      ...(opts.headers || {}),
    },
  });
  if (r.status === 401) { const e = new Error('Jeton GitHub invalide ou expiré'); e.auth = true; throw e; }
  if (!r.ok) throw new Error('GitHub ' + r.status);
  return r.json();
}

const syncPret = () => !!(state.settings.ghToken && state.settings.gistId);

async function noterSynchro(version, depuisCloud) {
  state.lastSync = nowISO();
  if (version) state.lastSyncVersion = version;
  if (depuisCloud) state.changedAt = state.lastSync; // les données locales sont celles du cloud
  state.syncErr = null;
  await DB.kvSet('lastSync', state.lastSync);
  await DB.kvSet('lastSyncVersion', state.lastSyncVersion || null);
  await DB.kvSet('changedAt', state.changedAt);
  await DB.kvSet('syncErr', null);
}

let syncErrAnnoncee = false;
async function noterErreurSynchro(e) {
  state.syncErr = { msg: e.message, at: nowISO(), auth: !!e.auth };
  await DB.kvSet('syncErr', state.syncErr);
  if (e.auth && !syncErrAnnoncee) {
    syncErrAnnoncee = true;
    toast('☁️ Ton jeton GitHub a expiré — va dans Profil pour le renouveler', 6000);
  }
}

async function versionDistante() {
  const c = await ghFetch(`/gists/${state.settings.gistId}/commits?per_page=1`);
  return (c && c[0] && c[0].version) || null;
}

async function syncFetchRemote() {
  const g = await ghFetch('/gists/' + state.settings.gistId);
  const f = g.files[SYNC_FILE];
  if (!f) return { data: null, version: (g.history && g.history[0] && g.history[0].version) || null };
  const content = f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content;
  return { data: JSON.parse(content), version: (g.history && g.history[0] && g.history[0].version) || null };
}

/* Envoi vers le cloud. Sans force, refuse d'écraser un cloud modifié ailleurs
   depuis la dernière synchro (renvoie false : il faut réconcilier). */
async function syncPush(force = false) {
  if (!syncPret()) throw new Error('Sync non configurée');
  if (!force && state.lastSyncVersion) {
    const v = await versionDistante();
    if (v && v !== state.lastSyncVersion) return false;
  }
  const g = await ghFetch('/gists/' + state.settings.gistId, {
    method: 'PATCH',
    body: JSON.stringify({ files: { [SYNC_FILE]: { content: JSON.stringify(fullBackupPayload()) } } }),
  });
  await noterSynchro(g.history && g.history[0] && g.history[0].version, false);
  return true;
}

/* Connexion (ou reconnexion avec un nouveau jeton). Si une sauvegarde existe déjà
   sur le compte, on la récupère ou on demande — jamais d'écrasement silencieux. */
async function syncConnect(token) {
  const ancienJeton = state.settings.ghToken, ancienGist = state.settings.gistId;
  state.settings.ghToken = token.trim();
  try {
    const user = await ghFetch('/user');
    const gists = await ghFetch('/gists?per_page=100');
    let g = gists.find(x => x.description === 'mes-series-sync');
    if (g && g.id === ancienGist && state.lastSyncVersion) {
      // simple renouvellement du jeton : réconciliation normale
      state.settings.gistId = g.id;
    } else if (!g) {
      g = await ghFetch('/gists', {
        method: 'POST',
        body: JSON.stringify({
          description: 'mes-series-sync', public: false,
          files: { [SYNC_FILE]: { content: JSON.stringify(fullBackupPayload()) } },
        }),
      });
      state.settings.gistId = g.id;
      await noterSynchro(g.history && g.history[0] && g.history[0].version, false);
    } else {
      state.settings.gistId = g.id;
      const { data, version } = await syncFetchRemote();
      const localVide = !state.series.length && !state.movies.length;
      if (sauvegardeValide(data) && (data.series.length || data.movies.length)) {
        if (localVide || confirm(`☁️ Une sauvegarde existe déjà sur ce compte : ${compteSauvegarde(data)}.\nCe téléphone : ${compteSauvegarde(state)}.\n\nOK = récupérer la sauvegarde du cloud\nAnnuler = garder ce téléphone (le cloud sera remplacé)`)) {
          await importFull(data);
          await noterSynchro(version, true);
        } else {
          await syncPush(true);
        }
      } else {
        await syncPush(true);
      }
    }
    state.settings.ghLogin = user.login;
    state.syncErr = null; await DB.kvSet('syncErr', null);
    await saveSettings();
    if (g.id === ancienGist && state.lastSyncVersion) await syncAuto();
    return user.login;
  } catch (e) {
    state.settings.ghToken = ancienJeton; state.settings.gistId = ancienGist;
    throw e;
  }
}

const compteSauvegarde = p =>`${pl((p.series || []).length, 'série')}, ${pl((p.movies || []).length, 'film')}`;

/* Applique les données du cloud, avec un garde-fou si elles sont nettement plus pauvres */
async function appliquerCloud(remote, version, demander) {
  // chaque catégorie est comparée séparément : 90 séries perdues ne doivent pas
  // passer inaperçues derrière 400 films inchangés
  const vus = list => list.reduce((a, s) => a + (s.seasons || []).reduce((b, sea) => b + (sea.episodes || []).filter(e => e.is_watched).length, 0), 0);
  const perte = (loc, dist) => loc > 5 && dist < loc * 0.8;
  if (demander || perte(state.series.length, remote.series.length) || perte(state.movies.length, remote.movies.length) ||
      perte(vus(state.series), vus(remote.series))) {
    if (!confirm(`☁️ Le cloud contient ${compteSauvegarde(remote)}, ce téléphone ${compteSauvegarde(state)}.\n\nOK = prendre la version du CLOUD\nAnnuler = garder CE TÉLÉPHONE (le cloud sera remplacé)`)) {
      await syncPush(true);
      return false;
    }
  }
  await importFull(remote);
  await noterSynchro(version, true);
  return true;
}

async function syncPull() {
  const { data, version } = await syncFetchRemote();
  if (!sauvegardeValide(data)) throw new Error('Aucune sauvegarde valide dans le cloud');
  await importFull(data);
  await noterSynchro(version, true);
  return data;
}

/* Réconciliation : au lancement et à chaque retour dans l'app */
let syncEnCours = null;
function syncAuto() {
  if (!syncPret() || navigator.onLine === false) return Promise.resolve();
  if (!syncEnCours) syncEnCours = syncAutoInterne().finally(() => { syncEnCours = null; });
  return syncEnCours;
}
async function syncAutoInterne() {
  try {
    const localChange = (state.changedAt || '') > (state.lastSync || '');
    let distant = null, version = null, distantChange;
    if (state.lastSyncVersion) {
      version = await versionDistante();
      distantChange = !!version && version !== state.lastSyncVersion;
    } else { // anciennes installations : comparaison par date d'export
      ({ data: distant, version } = await syncFetchRemote());
      distantChange = !!distant && (distant.exported_at || '') > (state.lastSync || '');
    }
    if (!distantChange && !localChange) { if (version && !state.lastSyncVersion) await noterSynchro(version, false); return; }
    if (!distantChange && localChange) { await syncPush(true); return; }
    if (!distant || !sauvegardeValide(distant)) {
      ({ data: distant, version } = await syncFetchRemote());
      if (!sauvegardeValide(distant)) throw new Error('sauvegarde du cloud illisible');
    }
    if (distantChange && !localChange) {
      if (await appliquerCloud(distant, version, false)) { toast('☁️ Synchronisé depuis le cloud'); rerenderSansPerturber(); }
      return;
    }
    // les deux côtés ont changé : on demande
    if (confirm(`☁️ Modifications des deux côtés.\n\nCloud (${fmtDate(distant.exported_at)}) : ${compteSauvegarde(distant)}\nCe téléphone : ${compteSauvegarde(state)}\n\nOK = garder la version du CLOUD\nAnnuler = garder CE TÉLÉPHONE (le cloud sera remplacé)`)) {
      await importFull(distant);
      await noterSynchro(version, true);
      toast('☁️ Données du cloud restaurées'); rerenderSansPerturber();
    } else {
      await syncPush(true);
    }
  } catch (e) {
    await noterErreurSynchro(e);
  }
}

/* ---------------- Actions ---------------- */
function trouverEpisode(s, seasonNum, epNum, special = false) {
  const sea = (s.seasons || []).find(x => x.number === seasonNum);
  if (!sea) return null;
  // correspondance exacte du type : un spécial n° 3 ne doit jamais cocher l'épisode normal n° 3
  const estSpecial = e => !!e.special || !!sea.is_specials || sea.number === 0;
  return sea.episodes.find(e => e.number === epNum && estSpecial(e) === !!special) || null;
}
/* Horodatage d'un visionnage : 'now', 'air' (jour de diffusion), 'unknown' (pas de date)
   ou un jour « AAAA-MM-JJ ». Un jour seul est enregistré à midi, heure locale : il reste
   le même jour une fois relu, quel que soit le fuseau. */
function horodatage(quand, ep) {
  if (quand === 'now') return nowISO();
  const jour = quand === 'air' ? ep && ep.air_date : quand === 'unknown' ? null : quand;
  return /^\d{4}-\d{2}-\d{2}/.test(jour || '') ? new Date(jour.slice(0, 10) + 'T12:00:00').toISOString() : null;
}
function marquerVu(ep, quand = 'now') {
  ep.is_watched = true;
  ep.watched_at = horodatage(quand, ep);
  ep.watched_count = Math.max(1, ep.watched_count || 0);
}
function marquerNonVu(ep) { ep.is_watched = false; ep.watched_at = null; ep.watched_count = 0; }
/* épisodes concernés par « Tout vu » : diffusés, pas encore vus, hors spéciaux.
   Les épisodes déjà vus ne sont pas touchés : leurs vraies dates sont conservées. */
function episodesAMarquer(s, seasonNum = null) {
  const out = [];
  for (const sea of s.seasons || []) {
    if (sea.is_specials || sea.number === 0) continue;
    if (seasonNum !== null && sea.number !== seasonNum) continue;
    for (const ep of sea.episodes) if (!ep.special && !ep.is_watched && !isFuture(ep)) out.push(ep);
  }
  return out;
}

/* Renvoie l'épisode modifié, ou null si rien n'a changé */
async function toggleEpisode(s, seasonNum, epNum, special = false) {
  const ep = trouverEpisode(s, seasonNum, epNum, special);
  if (!ep) return null;
  if (!ep.is_watched && isFuture(ep)) {
    toast(`Pas encore diffusé — sortie le ${fmtDate(ep.air_date)} 📅`);
    return null;
  }
  ep.is_watched ? marquerNonVu(ep) : marquerVu(ep);
  autoStatus(s);
  await saveSeries(s);
  return ep;
}
async function markSeason(s, seasonNum, watched, quand = 'now') {
  const sea = s.seasons.find(x => x.number === seasonNum);
  if (!sea) return;
  if (watched) episodesAMarquer(s, seasonNum).forEach(ep => marquerVu(ep, quand));
  else sea.episodes.forEach(ep => { if (!ep.special) marquerNonVu(ep); });
  autoStatus(s);
  await saveSeries(s);
}
async function markNext(s) {
  const nx = nextUnwatched(s);
  return nx ? toggleEpisode(s, nx.season, nx.ep.number) : null;
}
async function markAllWatched(s, quand = 'now') {
  episodesAMarquer(s).forEach(ep => marquerVu(ep, quand));
  autoStatus(s);
  await saveSeries(s);
}

/* ---------------- Annuler ----------------
   Les actions de visionnage, d'arrêt et de suppression proposent « Annuler » quelques
   secondes. Pour une série, on ne retient que l'état de visionnage de chaque épisode et
   le statut : restaurer la série entière effacerait un épisode ajouté entre-temps par
   l'actualisation. */
function etatSerie(s) {
  const eps = [];
  for (const sea of s.seasons || []) for (const ep of sea.episodes) eps.push([ep, ep.is_watched, ep.watched_at, ep.watched_count]);
  return { s, status: s.status, eps };
}
async function restaurerSerie(snap) {
  const { s } = snap;
  if (!state.series.includes(s)) return toast('Trop tard pour annuler : les données ont été rechargées');
  for (const [ep, w, at, c] of snap.eps) Object.assign(ep, { is_watched: w, watched_at: at, watched_count: c });
  s.status = snap.status;
  autoStatus(s);
  await saveSeries(s);
}
const etatFilm = m => ({ m, avant: JSON.parse(JSON.stringify(m)) });
async function restaurerFilm({ m, avant }) {
  if (!state.movies.includes(m)) return toast('Trop tard pour annuler : les données ont été rechargées');
  for (const k of Object.keys(m)) if (!(k in avant)) delete m[k];
  Object.assign(m, avant);
  await saveMovie(m);
}
function proposerAnnulation(msg, annuler, ms = 5000) {
  toast(msg, ms, { label: 'Annuler', run: async () => {
    await annuler();
    if (navigator.vibrate) navigator.vibrate(8);
    if (detailUuid) renderDetail();
    redessinerModale();
    rafraichirEcrans();
  } });
}
/* Modale capable de se redessiner (fiche film, épisode, saga) : redessinée après une
   annulation ou un ajout, seulement si c'est toujours elle qui est affichée */
let modaleCourante = null;
function redessinerModale() {

async function toggleMovieWatched(m) {

  m.watched_at = m.is_watched ? nowISO() : null;

}

/* ---------------- Rendu ---------------- */
const TABS = { home: 'Accueil', series: 'Séries', discover: 'Explorer', movies: 'Films', settings: 'Profil' };

/* ---- Bouton retour Android : fiches, modales et onglets empilés
   dans l'historique du navigateur. Retour = fermer la couche du
   dessus, jamais quitter l'app par surprise. ---- */
function pushLayer(layer) { history.pushState({ layer }, ''); }
/* une feuille en train de descendre (animation de fermeture) ne compte plus comme ouverte */
function modaleOuverte() { return !!$('#modal-root .modal-bg:not(.sortie)'); }
function fermerModale() {
  const root = $('#modal-root'), bg = root.querySelector('.modal-bg:not(.sortie)');
  if (!bg || mouvementReduit()) { root.innerHTML = ''; return; }
  bg.classList.add('sortie');
  setTimeout(() => { if (bg.isConnected) bg.remove(); }, 250);
}
function closeModalViaHistory() { if (modaleOuverte()) history.back(); }
window.addEventListener('popstate', () => {
  if (modaleOuverte()) { fermerModale(); return; }
  if (detailUuid) { fermerFiche(); return; }

function fermerFiche() {

const ORDRE_ONGLETS = ['home', 'series', 'movies', 'discover', 'settings'];
/* Changement d'onglet : la page glisse dans le sens de l'onglet choisi */
function changerOnglet(tab) {
  if (tab === state.tab) { render(); return Promise.resolve(); }
  const sens = ORDRE_ONGLETS.indexOf(tab) > ORDRE_ONGLETS.indexOf(state.tab) ? 'avant' : 'arriere';
  return transition(sens, () => { state.tab = tab; render(); }).pret;
}
function setTab(tab) {
  // revenir sur l'Accueil par la barre : on dépile l'entrée d'historique posée en partant,
  // sinon un appui sur « retour » ne ferait plus rien
  if (tab === 'home' && state.tab !== 'home' && history.state && history.state.layer === 'tab') { history.back(); return Promise.resolve(); }
  if (tab !== state.tab && state.tab === 'home') pushLayer('tab');
  return changerOnglet(tab);
}

/* rafraîchit l'onglet ET l'écran plein page ouvert (Journal, Ménage…) s'il y en a un */
function rafraichirEcrans() { render(); if (overlayMode && !detailUuid) renderOverlay(); }

let lastRenderedTab = null;
function render() {
  // conserve la position de défilement si on reste sur le même onglet
  const memeOnglet = lastRenderedTab === state.tab;
  const keepScroll = memeOnglet ? window.scrollY : 0;
  // même écran redessiné (une coche…) : on retient où sont les cartes pour les faire glisser
  const avant = memeOnglet && cleVue() === lastViewKey ? positionsCartes() : null;
  lastRenderedTab = state.tab;
  renderView();
  window.scrollTo(0, keepScroll);
  animerDeplacements(avant);
}
const cleVue = () => [state.tab, state.seriesView, state.movieView, state.seriesFilter,
  state.movieFilter, state.exploreType, state.exploreSource].join('|');

function renderView() {
  const title = $('#apptitle');

  else if (state.tab === 'movies') v.innerHTML = viewMovies();

function seriesCard(s) {

  if (remaining > 0) {

    sub = nx ? epCode(nx.season, nx.ep.number) + ` · ${p.watched}/${p.total}` : `${p.watched}/${p.total}`;

    const coming = (nx && nx.ep.air_date) ? { s: nx.season, e: nx.ep.number, d: nx.ep.air_date }
