    if (coming) {
      chip = `<span class="schip wait">📅</span>`;
      sub = `${epCode(coming.s, coming.e)} · ${compteARebours(coming.d)}`;
    } else {
      chip = `<span class="schip done">${ICONS.check}</span>`;
      sub = `À jour · ${p.watched}/${p.total}`;
    }
  }
  return `<div class="mcard" data-action="open-series" data-uuid="${s.uuid}" data-flip="g-${s.uuid}">
    <div class="pwrap">
      ${s.is_favorite ? `<span class="mfav">${ICONS.star}</span>` : ''}
      ${posterHtml(s, 'tv')}
      ${chip}
      <span class="sprog ${pct === 100 ? 'full' : ''}"><i style="width:0" data-w="${pct}%" data-k="g-${s.uuid}"></i></span>
    </div>
    <div class="mtitle">${esc(s.title)}</div>
    <div class="myear">${sub}</div>
  </div>`;
}

function viewSeries() {
  const seg = `<div class="segbar">
    <button class="${state.seriesView === 'suivre' ? 'on' : ''}" data-action="series-view" data-v="suivre">À suivre</button>
    <button class="${state.seriesView === 'grid' ? 'on' : ''}" data-action="series-view" data-v="grid">Mes séries</button>
  </div>`;
  if (state.seriesView === 'suivre') return seg + viewNext();
  return seg + viewSeriesGrid();
}

/* Année de première diffusion d'une série (métadonnées, sinon « (2024) » du titre) */
function serieYear(s) {
  const m = state.tmdb[s.uuid];
  return (m && m.year) || titleYear(s.title) || null;
}
const dansDecennie = (y, d) => {
  if (d === 'all') return true;
  if (!y) return false;
  if (d === '2020') return y >= 2020;
  if (d === '2010') return y >= 2010 && y <= 2019;
  if (d === '2000') return y >= 2000 && y <= 2009;
  return y < 2000;
};

function viewSeriesGrid() {
  const f = state.seriesFilter;
  const q = state.seriesSearch.trim();
  let list = state.series.filter(s => {
    if (q) return correspond(s.title, q);
    if (f === 'encours') return s.status === 'continuing';
    if (f === 'ajour') return s.status === 'up_to_date';
    if (f === 'pascommence') return s.status === 'not_started_yet';
    if (f === 'arretees') return s.status === 'stopped';
    if (f === 'favoris') return s.is_favorite;
    return true;
  });

  // genres réellement présents dans la bibliothèque (TMDB), du plus fréquent au plus rare
  const compteGenres = {};
  for (const s of state.series) {
    const m = state.tmdb[s.uuid];
    for (const g of (m && m.genres) || []) if (GENRE_NAMES[g]) compteGenres[g] = (compteGenres[g] || 0) + 1;
  }
  const genresDispo = Object.entries(compteGenres).sort((a, b) => b[1] - a[1]);

  if (state.seriesGenre >= 0) {
    list = list.filter(s => { const m = state.tmdb[s.uuid]; return m && m.genres && m.genres.includes(state.seriesGenre); });
  }
  if (state.seriesDecade !== 'all') list = list.filter(s => dansDecennie(serieYear(s), state.seriesDecade));

  const pct = s => { const p = progress(s); return p.total ? p.watched / p.total : 0; };
  const tri = state.seriesSort;
  if (tri === 'az') list.sort((a, b) => a.title.localeCompare(b.title, 'fr', { sensitivity: 'base' }));
  else if (tri === 'za') list.sort((a, b) => b.title.localeCompare(a.title, 'fr', { sensitivity: 'base' }));
  else if (tri === 'annee') list.sort((a, b) => (serieYear(b) || 0) - (serieYear(a) || 0));
  else if (tri === 'annee-asc') list.sort((a, b) => (serieYear(a) || 9999) - (serieYear(b) || 9999));
  else if (tri === 'progress') list.sort((a, b) => pct(b) - pct(a) || a.title.localeCompare(b.title, 'fr'));
  else if (tri === 'reste') {
    const reste = s => realEpisodes(s).filter(x => !x.ep.is_watched && !isFuture(x.ep)).length || 1e9;
    list.sort((a, b) => reste(a) - reste(b));
  }
  else { const act = new Map(list.map(s => [s, lastActivity(s)])); list.sort((a, b) => act.get(b).localeCompare(act.get(a))); }

  const chips = [
    ['encours', 'En cours'], ['ajour', 'À jour'], ['pascommence', 'Pas commencées'],
    ['arretees', 'Arrêtées'], ['favoris', 'Favoris'], ['toutes', 'Toutes'],
  ];
  const sel = (name, opts, val, label) => `<select class="fsel ${String(val) !== String(opts[0][0]) ? 'active' : ''}" data-f="${name}" aria-label="${label}">
    ${opts.map(([v, l]) => `<option value="${v}" ${String(v) === String(val) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const filtresActifs = state.seriesSort !== 'recent' || state.seriesGenre >= 0 || state.seriesDecade !== 'all';
  const busy = state.seriesMetaBusy;
  const besoinMeta = state.seriesGenre >= 0 || state.seriesDecade !== 'all' || tri === 'annee' || tri === 'annee-asc';
  return `
    <div class="searchbar">${ICONS.search}<input id="series-search" placeholder="Rechercher dans mes séries…" value="${esc(state.seriesSearch)}"></div>
    <div class="chips">${chips.map(([k, l]) =>
      `<button class="chip ${f === k && !q ? 'on' : ''}" data-action="series-filter" data-f="${k}">${l}</button>`).join('')}</div>
    <div class="fbar">
      ${sel('ssort', [['recent', 'Activité récente'], ['az', 'A → Z'], ['za', 'Z → A'], ['annee', 'Année ↓'], ['annee-asc', 'Année ↑'], ['progress', 'Progression ↓'], ['reste', 'Presque finies']], state.seriesSort, 'Trier')}
      ${sel('sgenre', [[-1, 'Tous genres'], ...genresDispo.map(([g, n]) => [g, `${GENRE_NAMES[g]} (${n})`])], state.seriesGenre, 'Genre')}
      ${sel('sdecade', [['all', 'Toutes années'], ['2020', '2020+'], ['2010', '2010-2019'], ['2000', '2000-2009'], ['old', 'Avant 2000']], state.seriesDecade, 'Années')}
      ${filtresActifs ? `<button class="chip" data-action="series-reset-filters" title="Réinitialiser le tri et les filtres">✕</button>` : ''}
    </div>
    ${busy && besoinMeta ? `<p class="loadrow" style="padding:4px 0 12px"><span class="spin"></span> Analyse de ta bibliothèque… <span id="series-meta-progress">${busy.done}/${busy.total}</span></p>` : ''}
    <p style="font-size:12px;color:var(--txt2);margin:-4px 2px 10px">${list.length} série${list.length > 1 ? 's' : ''}</p>
    ${list.length
      ? `<div class="mgrid">${list.map(seriesCard).join('')}</div>`
      : `<div class="empty">Aucune série ne correspond.</div>`}`;
}

/* Ce qui est à regarder, ce qui va sortir et ce qui reste à commencer
   (partagé par l'Accueil et Séries › À suivre) */
function donneesSuivi() {
  const watchable = [], waiting = [];
  for (const s of state.series) {
    if (s.status === 'stopped') continue;
    const nx = nextUnwatched(s);
    if (nx && !isFuture(nx.ep) && s.status !== 'not_started_yet') watchable.push({ s, nx });
    // calendrier : la prochaine SORTIE de chaque série suivie, même si
    // des épisodes déjà diffusés restent à regarder
    let fut = null;
    for (const x of realEpisodes(s)) if (isFuture(x.ep)) { fut = x; break; }
    const nep = nextEpValide(state.tmdb[s.uuid]); // jamais une date déjà passée
    const coming = fut
      || (nep && (!nx || (nep.date && nep.date > todayStr()))
        ? { season: nep.season, ep: { number: nep.episode, name: nep.name, air_date: nep.date } }
        : null);
    if (coming) waiting.push({ s, nx: coming });
  }
  const activite = new Map(watchable.map(w => [w.s, lastActivity(w.s)])); // calculée une fois, pas à chaque comparaison
  watchable.sort((a, b) => activite.get(b.s).localeCompare(activite.get(a.s)));
  waiting.sort((a, b) => (a.nx.ep.air_date || '9999').localeCompare(b.nx.ep.air_date || '9999'));
  // séries ajoutées mais jamais commencées, dont le 1er épisode est sorti : les plus récentes d'abord
  const aCommencer = state.series.filter(s => s.status === 'not_started_yet')
    .map(s => ({ s, nx: nextUnwatched(s) })).filter(x => x.nx && !isFuture(x.nx.ep))
    .sort((a, b) => (b.s.created_at || '').localeCompare(a.s.created_at || ''));
  return { watchable, waiting, aCommencer };
}

/* « aujourd'hui à 8 h 35 », « hier à 21 h 10 », « le 25 oct. à 9 h 02 » */
function quandRelatif(iso) {
  const d = new Date(iso), jour = dayOf(d);
  const h = `${d.getHours()} h ${pad2(d.getMinutes())}`;
  if (jour === todayStr()) return `aujourd'hui à ${h}`;
  if (jour === dayOf(new Date(Date.now() - 86400000))) return `hier à ${h}`;
  return `le ${fmtShort(d)} à ${h}`;
}
const majuscule = t => t ? t.charAt(0).toUpperCase() + t.slice(1) : '';

/* Épisode à regarder : l'image de la série avec le code de l'épisode et la progression */
function ligneEpisode({ s, nx }) {
  const p = progress(s), pct = p.total ? Math.round(p.watched / p.total * 100) : 0, fond = fondSerie(s);
  const code = epCode(nx.season, nx.ep.number);
  return `<div class="erow" data-action="open-series" data-uuid="${s.uuid}" data-flip="n-${s.uuid}">
    <div class="erow-img" data-morph="${s.uuid}"${fond ? ` style="background-image:url('${fond}')"` : ''}>${fond ? '' : esc(initials(s.title))}
      <b>${code}</b>
      <div class="progress ${pct === 100 ? 'full' : ''}"><i style="width:0" data-w="${pct}%" data-k="n-${s.uuid}"></i></div>
    </div>
    <div class="erow-txt">
      <div class="erow-t">${esc(s.title)}</div>
      ${nx.ep.name ? `<div class="erow-n">${esc(nx.ep.name)}</div>` : ''}
      <div class="erow-m">${pl(episodesRestants(s), 'restant')} · ${p.watched}/${p.total}</div>
    </div>
    <button class="checkbtn" data-action="mark-next" data-uuid="${s.uuid}" title="Marquer ${code} vu" aria-label="Marquer ${code} vu">${ICONS.check}</button>
  </div>`;
}

/* Sortie du calendrier ; le jour n'est écrit qu'une fois quand plusieurs séries sortent le même jour */
function ligneAgenda({ s, nx }, jour) {
  const fond = fondSerie(s), n = nx.ep.number;
  const generique = !nx.ep.name || /^(é|e)pisode \d+$/i.test(nx.ep.name);
  const quoi = n === 1 ? (nx.season > 1 ? `Début de saison ${nx.season}` : 'Premier épisode') : (generique ? `Épisode ${n}` : nx.ep.name);
  return `<div class="ajour" data-action="open-series" data-uuid="${s.uuid}">
    <div class="adate">${jour ? `<span>${jour.toLocaleDateString('fr-FR', { weekday: 'short' })}</span><b>${jour.getDate()}</b>` : ''}</div>
    <div class="acarte">
      <div class="amini" data-morph="${s.uuid}"${fond ? ` style="background-image:url('${fond}')"` : ''}></div>
      <div class="erow-txt">
        <div class="erow-t">${esc(s.title)}</div>
        <div class="erow-m">${epCode(nx.season, n)} · ${esc(quoi)}</div>
        ${nx.ep.air_date ? `<div class="adans">${majuscule(compteARebours(nx.ep.air_date))}</div>` : ''}
      </div>
    </div>
  </div>`;
}

function viewNext() {
  const { watchable, waiting, aCommencer } = donneesSuivi();
  const etat = state.lastRefresh
    ? `Actualisé ${quandRelatif(state.lastRefresh)}`
    : `Appuie sur ⟳ en haut pour chercher les nouveaux épisodes.`;
  const nv = nouveautesActuelles();
  const nonVues = nv.filter(x => x.trouve > (state.nouveautesVues || '')).length;
  const lienNv = nv.length
    ? `<button class="nvlink ${nonVues ? 'on' : ''}" data-action="open-nouveautes">${nonVues ? `<i></i>${pl(nonVues, 'nouvel épisode', 'nouveaux épisodes')}` : 'Nouveautés'}</button>`
    : '';
  const nbSaisons = s => sortedSeasons(s).filter(x => !x.is_specials && x.number !== 0).length;

  // calendrier des sorties en agenda, rangé par mois (l'année n'est écrite que si ce n'est pas celle en cours)
  const agenda = (() => {
    if (!waiting.length) return '';
    const annee = todayStr().slice(0, 4);
    let html = teteSection(`Calendrier des sorties <span class="cnt">${waiting.length}</span>`, '', 'calendrier');
    let mois = null, jour = null;
    for (const w of waiting.filter(x => x.nx.ep.air_date)) {
      const date = w.nx.ep.air_date, d = asDate(date);
      if (date.slice(0, 7) !== mois) {
        mois = date.slice(0, 7);
        html += `<div class="agenda-mois">${d.toLocaleDateString('fr-FR', { month: 'long' })}${mois.slice(0, 4) !== annee ? ' ' + mois.slice(0, 4) : ''}</div>`;
      }
      html += ligneAgenda(w, date !== jour ? d : null);
      jour = date;
    }
    const sansDate = waiting.filter(x => !x.nx.ep.air_date);
    if (sansDate.length) html += `<div class="agenda-mois">Date pas encore annoncée</div>` + sansDate.map(w => ligneAgenda(w, null)).join('');
    return html;
  })();

  return `
    <div class="nxhead"><p>${etat}</p>${lienNv}</div>
    ${teteSection(`À regarder <span class="cnt">${watchable.length}</span>`)}
    ${watchable.length ? `<div class="elist">${watchable.map(ligneEpisode).join('')}</div>`
      : aCommencer.length
        ? `<div class="empty" style="padding:24px 20px">Tu es à jour dans tes séries en cours 🎉</div>`
        : `<div class="empty">Rien à regarder — tout est vu ! 🎉</div>`}
    ${aCommencer.length ? teteSection(`À commencer <span class="cnt">${aCommencer.length}</span>`, '', 'a-commencer')
      + `<div class="hrow">${aCommencer.map(({ s }) => carteAffiche('open-series', s, 'tv', pl(nbSaisons(s), 'saison'))).join('')}</div>` : ''}
    ${agenda}`;
}

/* ---------------- Accueil ----------------
   La vitrine de l'appli : grand carrousel « Reprendre » (toutes les séries en cours,
   bouton « Vu » direct), puis des rangées qui mènent aux onglets. */
let carrouselUuid = null, carrouselAnim = null; // série affichée dans « Reprendre », retrouvée après un rafraîchissement
const fondSerie = s => { const m = state.tmdb[s.uuid] || {}; return m.backdrop || m.posterBig || m.poster || null; };
const dateCourte = d => { const t = asDate(d).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }); return t.charAt(0).toUpperCase() + t.slice(1); };
const teteSection = (titre, lien = '', id = '') => `<div class="hsec"${id ? ` id="${id}"` : ''}><h2 class="section">${titre}</h2>${lien}</div>`;
const lienAller = (texte, attrs) => `<button class="lien" data-action="aller" ${attrs}>${texte}</button>`;

function carteReprendre({ s, nx }) {
  const p = progress(s), pct = p.total ? Math.round(p.watched / p.total * 100) : 0, fond = fondSerie(s);
  return `<div class="rcard" data-action="open-series" data-uuid="${s.uuid}">
    <div class="rcard-img" data-morph="${s.uuid}"${fond ? ` style="background-image:url('${fond}')"` : ''}></div>
    <div class="rcard-ov">
      <div class="rcard-chips"><span class="rc-ep">${epCode(nx.season, nx.ep.number)}</span><span class="rc-reste">${pl(episodesRestants(s), 'restant')}</span></div>
      <div class="rcard-titre">${esc(s.title)}</div>
      ${nx.ep.name ? `<div class="rcard-ep">${esc(nx.ep.name)}</div>` : ''}
      <div class="rcard-prog"><div class="progress ${pct === 100 ? 'full' : ''}"><i style="width:0" data-w="${pct}%" data-k="r-${s.uuid}"></i></div><span>${p.watched}/${p.total}</span></div>
      <div class="rcard-btns">
        <button class="btn rcard-vu" data-action="mark-next" data-uuid="${s.uuid}">${ICONS.check} Vu</button>
        <button class="rcard-info" data-action="open-series" data-uuid="${s.uuid}" aria-label="Ouvrir la fiche de ${esc(s.title)}">${ICONS.info}</button>
      </div>
    </div>
  </div>`;
}
/* grande vignette (image de fond + pastille) pour les rangées « Nouveaux épisodes » et « Sortent bientôt » */
const carteLarge = c => `<div class="lcard" data-action="open-series" data-uuid="${c.uuid}">
  <div class="lcard-img" data-morph="${c.uuid}"${c.fond ? ` style="background-image:url('${c.fond}')"` : ''}>${c.puce ? `<span class="lcard-puce">${esc(c.puce)}</span>` : ''}</div>
  <div class="lcard-t">${esc(c.titre)}</div>
  ${c.sous ? `<div class="lcard-s">${esc(c.sous)}</div>` : ''}
</div>`;
/* affiche pour les rangées de séries et de films de la bibliothèque */
const carteAffiche = (action, item, type, sous) => `<div class="pcard" data-action="${action}" data-uuid="${item.uuid}">
  ${posterHtml(item, type)}
  <div class="mtitle">${esc(item.title)}</div>
  ${sous ? `<div class="why">${esc(sous)}</div>` : ''}
</div>`;

function viewHome() {
  const { watchable, waiting, aCommencer } = donneesSuivi();
  const parts = [];
  const auj = todayStr();

  // Reprendre : toutes les séries en cours, la plus récemment regardée d'abord
  parts.push(`<div class="hsec" style="margin-top:4px">
    <h2 class="section">Reprendre <span class="cnt">${pl(watchable.length, 'série')} en cours</span></h2>
    <button class="iconbtn petit" data-action="roulette" aria-label="Que regarder ce soir ?" title="Que regarder ce soir ?">${ICONS.dice}</button>
  </div>`);
  parts.push(watchable.length
    ? `<div class="reprendre" id="reprendre">${watchable.map(carteReprendre).join('')}</div>
       ${watchable.length > 1 ? `<div class="reprendre-pos" id="reprendre-pos">1 / ${watchable.length}</div>` : ''}`
    : `<div class="empty" style="padding:28px 20px">${aCommencer.length ? 'Tu es à jour dans tes séries en cours 🎉' : 'Rien à reprendre pour le moment.'}</div>`);

  // Nouveaux épisodes trouvés par les actualisations : ceux déjà disponibles d'abord
  const nv = nouveautesActuelles();
  if (nv.length) {
    const groupes = new Map();
    for (const x of nv) { if (!groupes.has(x.uuid)) groupes.set(x.uuid, []); groupes.get(x.uuid).push(x); }
    const cartes = [...groupes].map(([uuid, eps]) => {
      eps.sort((a, b) => a.season - b.season || a.number - b.number);
      const dispo = eps.filter(e => e.air_date <= auj);
      return { s: state.series.find(x => x.uuid === uuid), premier: dispo[0] || eps[0], dispo: dispo.length };
    }).sort((a, b) => (b.dispo ? 1 : 0) - (a.dispo ? 1 : 0)).slice(0, 12);
    parts.push(teteSection('Nouveaux épisodes', '<button class="lien" data-action="open-nouveautes">Tout voir</button>'));
    parts.push(`<div class="hrow">${cartes.map(c => carteLarge({ uuid: c.s.uuid, fond: fondSerie(c.s), titre: c.s.title,
      puce: epCode(c.premier.season, c.premier.number),
      sous: c.dispo ? (c.dispo > 1 ? `${c.dispo} épisodes disponibles` : 'Disponible') : `Sortie ${compteARebours(c.premier.air_date)}` })).join('')}</div>`);
  }

  // Sortent bientôt (le calendrier complet reste dans Séries › À suivre)
  const bientot = waiting.filter(w => w.nx.ep.air_date).slice(0, 12);
  if (bientot.length) {
    parts.push(teteSection('Sortent bientôt', lienAller('Calendrier', 'data-tab="series" data-vue="suivre" data-ancre="calendrier"')));
    parts.push(`<div class="hrow">${bientot.map(({ s, nx }) => carteLarge({ uuid: s.uuid, fond: fondSerie(s), titre: s.title,
      puce: dateCourte(nx.ep.air_date), sous: `${epCode(nx.season, nx.ep.number)} · ${compteARebours(nx.ep.air_date)}` })).join('')}</div>`);
  }

  // À commencer
  if (aCommencer.length) {
    parts.push(teteSection(`À commencer <span class="cnt">${aCommencer.length}</span>`, lienAller('Tout voir', 'data-tab="series" data-vue="suivre" data-ancre="a-commencer"')));
    parts.push(`<div class="hrow">${aCommencer.slice(0, 15).map(({ s }) => carteAffiche('open-series', s, 'tv',
      pl(sortedSeasons(s).filter(x => !x.is_specials && x.number !== 0).length, 'saison'))).join('')}</div>`);
  }

  // Films à voir : les derniers ajoutés
  const aVoir = state.movies.filter(m => !m.is_watched).sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
  if (aVoir.length) {
    parts.push(teteSection(`Films à voir <span class="cnt">${aVoir.length}</span>`, lienAller('Tout voir', 'data-tab="movies" data-vue="avoir"')));
    parts.push(`<div class="hrow">${aVoir.slice(0, 15).map(m => {
      const mt = state.tmdb[m.uuid] || {};
      const sous = mt.release && mt.release > auj ? `Sortie ${compteARebours(mt.release)}` : mt.runtime ? fmtDuree(mt.runtime) : (m.year ? String(m.year) : '');
      return carteAffiche('open-movie', m, 'movie', sous);
    }).join('')}</div>`);
  }

  // Pour toi (séries et films), calculé une fois par session
  if (tmdbKey()) {
    const d = state.discoverData.foryou;
    if (!d) loadSection('foryou');
    const squelette = `<div class="hrow">${'<div class="pcard"><div class="poster sk"></div></div>'.repeat(4)}</div>`;
    for (const [titre, liste, type] of [['Séries pour toi', d && d.tv, 'tv'], ['Films pour toi', d && d.mv, 'movie']]) {
      const items = fresh(liste).slice(0, 15);
      if (d && (d.error || !items.length)) continue;
      parts.push(teteSection(titre, lienAller('Plus', `data-tab="discover" data-type="${type}" data-ancre="pour-toi"`)));
      parts.push(d ? `<div class="hrow">${items.map(discoverCardH).join('')}</div>` : squelette);
    }
  }

  // Sagas à compléter (déjà analysées depuis Films › Sagas)
  if (tmdbKey() && Object.keys(sagasCache).length) {
    const { parId, ids } = sagasBibliotheque();
    const enCours = [];
    for (const id of ids) {
      const saga = sagasCache[id];
      if (!saga || saga.parts.length < 2) continue;
      const b = bilanSaga(saga, parId);
      if (b.total && b.vus && b.vus < b.total) enCours.push({ saga, b });
    }
    enCours.sort((a, b) => b.b.vus / b.b.total - a.b.vus / a.b.total);
    if (enCours.length) {
      parts.push(teteSection(`Sagas à compléter <span class="cnt">${enCours.length}</span>`, lienAller('Tout voir', 'data-tab="movies" data-vue="sagas"')));
      parts.push(`<div class="hrow">${enCours.slice(0, 12).map(({ saga, b }) => `<div class="pcard" data-action="open-saga" data-id="${saga.id}">
        <div class="poster">${saga.poster ? `<img loading="lazy" src="${saga.poster}" alt="">` : esc(initials(nomSaga(saga.name)))}</div>
        <div class="mtitle">${esc(nomSaga(saga.name))}</div>
        <div class="why">${b.vus}/${b.total} vus${b.prochain ? ' · ' + esc(b.prochain.title) : ''}</div>
      </div>`).join('')}</div>`);
    }
  }
  return parts.join('');
}

/* Carrousel « Reprendre » : revient sur la série affichée avant le rafraîchissement,
   et tient à jour le compteur « 3 / 20 » */
function initAccueil() {
  const c = $('#reprendre');
  if (!c) return;
  const cartes = [...c.querySelectorAll('.rcard')], pos = $('#reprendre-pos');
  const pas = () => cartes.length > 1 ? cartes[1].offsetLeft - cartes[0].offsetLeft : c.clientWidth;
  const cible = carrouselUuid && cartes.find(x => x.dataset.uuid === carrouselUuid);
  if (cible) c.scrollLeft = cible.offsetLeft - cartes[0].offsetLeft;
  const suivre = () => {
    const i = Math.max(0, Math.min(cartes.length - 1, Math.round(c.scrollLeft / (pas() || 1))));
    carrouselUuid = cartes[i].dataset.uuid;
    if (pos) pos.textContent = `${i + 1} / ${cartes.length}`;
  };
  c.addEventListener('scroll', () => { clearTimeout(c._t); c._t = setTimeout(suivre, 60); }, { passive: true });
  suivre();
  if (carrouselAnim) { // la carte qui vient d'être cochée annonce son nouvel épisode
    const carte = cartes.find(x => x.dataset.uuid === carrouselAnim);
    if (carte) carte.classList.add('maj');
    carrouselAnim = null;
  }
}

/* pastille sur l'affiche : date à venir sinon note */
function posterChip(n) {

function discoverCardH(n) {

// masque ce qui est déjà dans la bibliothèque et les « pas intéressé »
const fresh = arr => (arr || []).filter(n => !inLibrary(n) && !state.hidden.has(hkey(n)));

/* Filtres utilisateur des sections Découvrir */
function applyDFilters(arr) {
  const f = state.dFilters;
  return (arr || []).filter(n => {
    if (f.type !== 'all' && n.type !== f.type) return false;
    if (f.note && !(n.rating && n.rating >= f.note)) return false;
    if (f.annee !== 'all') {
      if (!n.year) return false;
      if (f.annee === '2020' && n.year < 2020) return false;
      if (f.annee === '2010' && (n.year < 2010 || n.year > 2019)) return false;
      if (f.annee === '2000' && (n.year < 2000 || n.year > 2009)) return false;
      if (f.annee === 'old' && n.year >= 2000) return false;
      if (f.annee === 'perso' && (n.year < f.de || n.year > f.a)) return false;
    }
    if (f.genre >= 0) {
      // un genre se compare avec l'identifiant propre au type (films et séries n'ont pas les mêmes)
      const g = GENRES[f.genre];
      const id = n.type === 'tv' ? g.tv : g.mv;
      if (!id || !(n.genreIds || []).includes(id)) return false;
    }
    return true;
  });
}
const prep = arr => applyDFilters(fresh(arr));

/* Panneau des filtres de la liste complète d'Explorer : genre, note, années (ou une période au choix).

function filtresActifs() {

  if (f.note) actifs.push({ champ: 'note', label: `★ ${String(f.note).replace('.', ',')}+` });

const cleItem = n => esc(JSON.stringify(n)).replace(/"/g, '&quot;');
const noteFr = r => '★ ' + r.toFixed(1).replace('.', ',');
/* même image TMDB dans une autre taille (w300 pour une vignette, w1280 pour la vitrine) */
const tailleTmdb = (url, taille) => url ? url.replace(/\/t\/p\/w\d+\//, `/t/p/${taille}/`) : url;
const genresCourts = n => (n.genreIds || []).map(g => GENRE_NAMES[g]).filter(Boolean).slice(0, 2);

function viewDiscover() {
  const q = state.discoverSearch;
  const champ = `${ICONS.search}<input id="discover-search" placeholder="Rechercher une série, un film…" value="${esc(q)}" aria-label="Chercher une série ou un film" autocomplete="off">`;
  let body = '';
  if (q.length >= 2) {

        ${!tv.length && !mv.length ? `<div class="empty">Aucun résultat pour « ${esc(q)} ».</div>` : ''}`;
    }
    return `<div class="searchbar">${champ}</div>${body}`;
  }

  if (!tmdbKey()) {
    // sans clé : uniquement les séries en streaming + astuce
    const skelCard = '<div class="pcard"><div class="poster sk" style="width:108px;height:162px"></div><div class="sk" style="height:11px;margin-top:8px;border-radius:6px"></div></div>';
    if (!state.trending) { loadTrending(); body = `<div class="hrow" style="margin-top:14px">${skelCard.repeat(4)}</div>`; }
    else body = `
      ${teteSection('En ce moment en streaming')}
      <div class="hrow">${fresh(state.trending.tv).map(discoverCardH).join('')}</div>
      <div class="hint" style="margin-top:16px"><span class="em">💡</span><p><b>Astuce :</b> avec une clé TMDB gratuite (onglet Profil), tu débloques les tendances, les tops, les genres et les recommandations personnalisées.</p></div>`;
    return `<div class="searchbar">${champ}</div>${body}`;
  }

  const tv = state.exploreType === 'tv';
  if (!['pop', 'top', 'soon'].includes(state.exploreSource)) state.exploreSource = 'pop';
  if (!state.trending) loadTrending();
  const tendances = state.trending ? (tv ? state.trending.tv : state.trending.mv) : [];

  // ----- vitrine : le n°1 de la semaine en grand, les suivants en glissant -----
  const une = herosExplorer();
  const rang = n => (state.trending[n.type === 'tv' ? 'tv' : 'mv'] || []).findIndex(x => x.provId === n.provId) + 1;
  const diapo = (n, i) => {
    const k = cleItem(n), r = rang(n);
    const meta = [n.year, n.rating ? noteFr(n.rating) : null, ...genresCourts(n)].filter(Boolean).join(' · ');
    return `<div class="vslide${i ? '' : ' vue'}" data-action="discover-detail" data-key="${k}">
      <img class="vimg" src="${tailleTmdb(n.backdrop, 'w1280')}" alt=""${i ? ' loading="lazy"' : ''}>
      <div class="vbas">
        <span class="vtag"><i></i>${r ? `N°${r} des ${n.type === 'tv' ? 'séries' : 'films'} cette semaine` : 'À la une'}</span>
        <div class="vtitre${n.title.length > 24 ? ' long' : ''}">${esc(n.title)}</div>
        ${meta ? `<div class="vmeta">${meta}</div>` : ''}
        ${n.overview ? `<div class="vresume">${esc(n.overview)}</div>` : ''}
        <div class="vbtns">
          <button class="btn" data-action="quick-add" data-key="${k}">${ICONS.plus} Ajouter</button>
          <button class="verre" data-action="discover-detail" data-key="${k}">${ICONS.info} Détails</button>
        </div>
      </div>
    </div>`;
  };
  const vitrine = `<div class="vitrine-wrap">
    <div class="vitrine" id="vitrine">${une.length ? une.map(diapo).join('') : '<div class="vslide sk"></div>'}</div>
    <div class="vcherche">${champ}</div>
    ${une.length > 1 ? `<div class="vtirets">${une.map((_, i) => `<span${i ? '' : ' class="on"'}></span>`).join('')}</div>` : ''}
  </div>`;

  const seg = `<div class="segbar">
    <button class="${tv ? 'on' : ''}" data-action="explore-type" data-v="tv">Séries</button>
    <button class="${tv ? '' : 'on'}" data-action="explore-type" data-v="movie">Films</button>
  </div>`;

  // ----- Top 10 de la semaine, avec les grands chiffres -----
  const top10 = tendances.length ? teteSection('Top 10 cette semaine') + `<div class="hrow t10row">${tendances.slice(0, 10).map((n, i) => `
    <div class="t10" data-action="discover-detail" data-key="${cleItem(n)}">
      <span class="t10-num">${i + 1}</span>
      <div class="poster">${n.poster ? `<img loading="lazy" src="${n.poster}" alt="">` : esc(initials(n.title))}</div>
      ${inLibrary(n) ? `<span class="inlib">${ICONS.check}</span>` : ''}
    </div>`).join('')}</div>` : '';

  // ----- Pour toi -----
  const d = state.discoverData.foryou;
  if (!d) loadSection('foryou');
  const suggestions = d && !d.error ? fresh(tv ? d.tv : d.mv) : [];
  const refs = d && !d.error ? (tv ? d.refsTv : d.refsMv) || [] : [];
  const pourToi = teteSection('Pour toi', d && !d.error ? '<button class="lien" data-action="regen-foryou">↻ Autres idées</button>' : '', 'pour-toi')
    + (!d ? `<div class="hrow">${'<div class="pcard"><div class="poster sk"></div></div>'.repeat(4)}</div>`
      : d.error ? `<div class="empty" style="padding:16px 10px">Suggestions indisponibles pour le moment.<br><button class="btn ghost small" style="margin-top:10px" data-action="regen-foryou">Réessayer</button></div>`
      : suggestions.length ? `${refs.length ? `<p class="psous">D'après ${refs.map(esc).join(', ')}</p>` : ''}<div class="hrow">${suggestions.map(discoverCardH).join('')}</div>`
      : `<div class="empty" style="padding:16px 10px">Plus de suggestion pour l'instant : touche « Autres idées ».</div>`);

  const prochains = up && !up.error ? fresh(tv ? up.tv : up.mv).filter(n => n.date && n.date >= auj && n.backdrop)
    .sort((a, b) => a.date.localeCompare(b.date)).slice(0, 12) : [];
  const bientot = prochains.length ? teteSection(tv ? 'Bientôt à l’écran' : 'Bientôt au cinéma') + `<div class="hrow">${prochains.map(n => `
    <div class="lcard" data-action="discover-detail" data-key="${cleItem(n)}">
      <div class="lcard-img" style="background-image:url('${n.backdrop}')"><span class="lcard-puce rouge">${dateCourte(n.date)}</span></div>
      <div class="lcard-t">${esc(n.title)}</div>
      <div class="lcard-s">${[majuscule(compteARebours(n.date)), genresCourts(n).map((g, i) => i ? g.toLowerCase() : g).join(', ')].filter(Boolean).join(' · ')}</div>
    </div>`).join('')}</div>` : '';

  // ----- tuiles de genre, illustrées par un titre du moment de ce genre -----
  const deja = new Set();
  const sources = [...tendances, ...state.exploreFeed.items.filter(n => n.type === (tv ? 'tv' : 'movie')), ...(up && !up.error ? (tv ? up.tv : up.mv) : [])];
  const imageGenre = gid => {
    const n = sources.find(x => x.backdrop && !deja.has(x.provId) && (x.genreIds || []).includes(gid));
    if (!n) return null;
    deja.add(n.provId);

  };
  const tuiles = teteSection('Par genre') + `<div class="gtuiles">${(tv ? [3, 7, 6, 2, 1, 5] : [3, 5, 7, 6, 1, 0]).map(i => {
    const g = GENRES[i], img = imageGenre(tv ? g.tv : g.mv);
    return `<button class="gtuile" data-action="explore-genre" data-g="${i}"${img ? ` style="background-image:url('${img}')"` : ''}><span>${esc(nomGenre(g, tv))}</span></button>`;
  }).join('')}</div>`;

  // ----- tout parcourir : classement, filtres, grille infinie (chargement au défilement) -----
  const actifs = filtresActifs();
  const SOURCES = [['pop', 'Populaires'], ['top', tv ? 'Mieux notées' : 'Mieux notés'], ['soon', 'À venir']];
  const parcourir = teteSection('Tout parcourir', '', 'tout-parcourir')
    + `<div class="onglets">${SOURCES.map(([k, l]) => `<button class="${state.exploreSource === k ? 'on' : ''}" data-action="explore-source" data-k="${k}">${l}</button>`).join('')}
      <button class="bfiltres" data-action="open-filtres">${ICONS.filtres} Filtres${actifs.length ? `<i>${actifs.length}</i>` : ''}</button></div>`
    + (actifs.length ? `<div class="factifs">${actifs.map(a => `<button class="chip on" data-action="filtre-retirer" data-champ="${a.champ}" aria-label="Retirer le filtre ${esc(a.label)}">${esc(a.label)} ✕</button>`).join('')}</div>` : '');
  const feed = state.exploreFeed;
  if (feed.key !== exploreKey()) loadExplorePage();
  const items = itemsExplorer();
  relancerSiPeu(items.length);

  return vitrine + seg + top10 + pourToi + bientot + tuiles + parcourir
    + `<div class="mgrid" id="explore-grid">${items.map(discoverCardG).join('')}</div><div id="explore-pied">${piedExplore(items.length)}</div>`;
}

/* Titres de la vitrine (séries et films alternés) ; les filtres ne concernent que la liste complète */
function herosExplorer() {
  if (!state.trending) return [];
  const heroTv = fresh(state.trending.tv).filter(n => n.backdrop).slice(0, 4);
  const heroMv = fresh(state.trending.mv).filter(n => n.backdrop).slice(0, 4);
  const cands = [];
  for (let i = 0; i < 4; i++) {
    if (heroTv[i]) cands.push(heroTv[i]);
    if (heroMv[i]) cands.push(heroMv[i]);
  }
  return cands;
}
/* Titres affichables de la grille infinie (filtres appliqués, carrousel exclu) */
function itemsExplorer() {
  const heroIds = new Set(herosExplorer().map(h => h.type + ':' + h.provId));
  return prep(state.exploreFeed.items).filter(n => !heroIds.has(n.type + ':' + n.provId));
}
/* Bas de la grille : chargement, erreur avec « Réessayer », fin de liste… */
function piedExplore(nb) {
  const feed = state.exploreFeed;
  const skel = `<div class="mgrid" style="margin-top:12px">${'<div class="mcard"><div class="poster sk" style="width:100%;aspect-ratio:2/3"></div></div>'.repeat(6)}</div>`;
  if (feed.loading || feed.key !== exploreKey()) return skel;
  if (feed.error) return `<div class="empty" style="padding:24px 10px">${nb ? '' : '<div class="big">📡</div>'}Chargement impossible : ${esc(feed.error)}<br><button class="btn ghost small" style="margin-top:12px" data-action="explore-retry">↻ Réessayer</button></div>`;
  if (feed.page < feed.totalPages && feed.vides >= 3) return `<div style="text-align:center;padding:16px">${nb ? '' : '<p style="color:var(--txt2);margin-bottom:10px">Rien pour l’instant avec ces filtres.</p>'}<button class="btn ghost small" data-action="explore-more">Charger plus</button></div>`;
  if (!nb) return `<div class="empty">Rien avec ces filtres.</div>`;
  if (feed.page >= feed.totalPages) return `<p style="text-align:center;color:var(--txt2);font-size:12px;padding:14px">— fin de la liste —</p>`;
  return '';
}
/* Si les filtres ont trop réduit la page, on charge la suivante — mais jamais en
   boucle : pas après une erreur, et au plus 3 pages vides d'affilée */
function relancerSiPeu(nb) {
  const feed = state.exploreFeed;
  if (!feed.loading && !feed.error && feed.key === exploreKey() && nb < 12 &&
      feed.page < feed.totalPages && feed.vides < 3) setTimeout(loadExplorePage, 60);
}

/* ----- flux infini Explorer : /discover TMDB paginé, filtres serveur ----- */
function exploreKey() {
  const f = state.dFilters;
  return `${state.exploreSource}|${state.exploreType}|${f.genre}|${f.note}|${f.annee}${f.annee === 'perso' ? `:${f.de}-${f.a}` : ''}`;
}
function exploreParams(page) {
  const f = state.dFilters;
  const tv = state.exploreType === 'tv';
  const p = { page, sort_by: 'popularity.desc', 'vote_count.gte': 20 };
  if (state.exploreSource === 'top') { p.sort_by = 'vote_average.desc'; p['vote_count.gte'] = tv ? 500 : 1500; }
  if (state.exploreSource === 'soon') { p[tv ? 'first_air_date.gte' : 'primary_release_date.gte'] = todayStr(); delete p['vote_count.gte']; }
  if (f.genre >= 0) {
    const g = GENRES[f.genre];
    const id = tv ? g.tv : g.mv;
    if (id) p.with_genres = id;
  }
  if (f.note) { p['vote_average.gte'] = f.note; if (state.exploreSource === 'pop') p['vote_count.gte'] = 100; }
  if (f.annee !== 'all') {
    const k = tv ? 'first_air_date' : 'primary_release_date';
    const [de, a] = f.annee === 'perso' ? [f.de, f.a]
      : { '2020': [2020, null], '2010': [2010, 2019], '2000': [2000, 2009], old: [null, 1999] }[f.annee] || [];
    // « À venir » part d'aujourd'hui : la période choisie ne doit pas le faire remonter dans le passé
    if (de) p[k + '.gte'] = p[k + '.gte'] && p[k + '.gte'] > `${de}-01-01` ? p[k + '.gte'] : `${de}-01-01`;
    if (a) p[k + '.lte'] = `${a}-12-31`;
  }
  return p;
}
async function loadExplorePage() {
  if (!tmdbKey() || state.exploreSource === 'foryou') return;
  const feed = state.exploreFeed;
  const key = exploreKey();
  if (feed.key !== key) {
    feed.key = key; feed.items = []; feed.page = 0; feed.totalPages = 1; feed.seen = new Set();
    feed.error = null; feed.vides = 0;
  }
  if (feed.loading || feed.error || (feed.page > 0 && feed.page >= feed.totalPages)) return;
  feed.loading = true;
  const avant = itemsExplorer().length;
  const pied0 = $('#explore-pied');
  if (pied0) pied0.innerHTML = piedExplore(avant); // squelettes pendant le chargement
  try {
    const d = await tget(`/discover/${state.exploreType}`, exploreParams(feed.page + 1));
    if (feed.key !== key) { feed.loading = false; return; } // filtres changés entre-temps
    feed.page = d.page;
    feed.totalPages = Math.min(d.total_pages || 1, 500);
    for (const x of d.results || []) {
      const n = normTmdb(x, state.exploreType);
      const k = n.type + n.provId;
      if (!feed.seen.has(k)) { feed.seen.add(k); feed.items.push(n); }
    }
    feed.error = null;
  } catch (e) {
    if (feed.key !== key) { feed.loading = false; return; }
    feed.error = e.message === 'Failed to fetch' ? 'pas de connexion' : e.message;
  }
  feed.loading = false;
  const items = itemsExplorer();
  feed.vides = items.length > avant ? 0 : feed.vides + 1;
  if (state.tab !== 'discover' || state.discoverSearch.trim().length >= 2) return;
  // ajout à la suite des cartes déjà affichées (pas de reconstruction de tout l'écran)
  const grille = $('#explore-grid'), pied = $('#explore-pied');
  if (grille && pied && grille.children.length <= items.length) {
    grille.insertAdjacentHTML('beforeend', items.slice(grille.children.length).map(discoverCardG).join(''));
    pied.innerHTML = piedExplore(items.length);
    relancerSiPeu(items.length);
  } else {
    rerenderSansPerturber();
  }
}

/* Carte de la grille d'Explorer : note (ou date de sortie) en haut de l'affiche, bouton + en bas */
function discoverCardG(n) {

/* ---------------- Détails des films (durée, sortie, saga) ----------------
   Une passe par session, résultats gardés dans les métadonnées (donc sauvegardés
   et synchronisés). Nécessite une clé TMDB. Pool séparé : les affiches restent
   prioritaires pendant l'analyse. */
const poolFond = makePool(3);
function appliquerDetailsFilm(mt, d) {
  mt.runtime = d.runtime || null;
  mt.release = d.release_date || null;
  const c = d.belongs_to_collection;
  mt.collection = c && idSaga(c.id) ? { id: idSaga(c.id), name: String(c.name || '') } : null;
  if (d.genres) mt.genres = d.genres.map(g => g.id);
  if (!mt.overview && d.overview) mt.overview = d.overview;
  mt.detAt = nowISO();
}
const filmSansDetails = m => {
  if (metaNeedsFetch(m, 'movie')) return true;
  const t = state.tmdb[m.uuid];
  return !!(t && t.id && t.provider === 'tmdb' && !t.detAt);
};
const filmsTentes = new Set(); // une tentative par film et par session (pas de boucle si échec)
async function backfillFilms(tous, maj) {
  if (!tmdbKey() || state.filmsMetaBusy) return;
  const cibles = state.movies.filter(m => (tous || !m.is_watched) && !filmsTentes.has(m.uuid) && filmSansDetails(m));
  if (!cibles.length) return;
  cibles.forEach(m => filmsTentes.add(m.uuid));
  state.filmsMetaBusy = { done: 0, total: cibles.length };
  maj && maj();
  await Promise.all(cibles.map(m => poolFond(async () => {
    try {
      const mt = await resolveMeta(m, 'movie');
      if (mt && mt.id && mt.provider === 'tmdb' && !mt.detAt && state.tmdb[m.uuid] === mt) {
        appliquerDetailsFilm(mt, await tget(`/movie/${mt.id}`));
        await saveMeta(mt);
      }
    } catch (e) {}
    if (state.filmsMetaBusy) {
      state.filmsMetaBusy.done++;
      const el = $('#films-meta-progress'); // mise à jour en place, sans redessiner l'écran
      if (el) el.textContent = `${state.filmsMetaBusy.done}/${state.filmsMetaBusy.total}`;
    }
  })));
  state.filmsMetaBusy = null;
  maj && maj();
}
const ligneAnalyseFilms = () => state.filmsMetaBusy
  ? `<p class="loadrow" style="padding:4px 0 12px"><span class="spin"></span> Analyse de tes films… <span id="films-meta-progress">${state.filmsMetaBusy.done}/${state.filmsMetaBusy.total}</span></p>`
  : '';
const selectFiltre = (name, opts, val, label) => `<select class="fsel ${String(val) !== String(opts[0][0]) ? 'active' : ''}" data-f="${name}" aria-label="${label}">
  ${opts.map(([v, l]) => `<option value="${v}" ${String(v) === String(val) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;

/* ---------------- Sagas de films (collections TMDB) ----------------
   Le contenu des sagas vient de TMDB et reste sur l'appareil (cache, 30 jours) ;
   l'appartenance d'un film à une saga est dans ses métadonnées. */
let sagasCache = {};
/* « Shrek - Saga », « The Kissing Booth Collection » → « Shrek », « The Kissing Booth » */
const nomSaga = n => String(n || '').replace(/\s*[-–]?\s*(saga|collection)\s*$/i, '').trim() || 'Saga';
const idSaga = x => { const n = +x; return Number.isInteger(n) && n > 0 ? n : null; };
const sagaBtn = c => idSaga(c.id)
  ? `<button class="btn ghost small" data-action="open-saga" data-id="${idSaga(c.id)}">🎞️ Saga ${esc(nomSaga(c.name))}</button>` : '';
let sagasEcriture = null;
function enregistrerSagas() { // regroupe les écritures d'une rafale de chargements
  clearTimeout(sagasEcriture);
  sagasEcriture = setTimeout(() => DB.kvSet('sagas', sagasCache).catch(() => {}), 600);
}
const sagaFraiche = c => !!c && Date.now() - new Date(c.at).getTime() < 30 * 86400000;
async function chargerSaga(id) {
  id = idSaga(id);
  if (!id) throw new Error('saga inconnue');
  if (sagaFraiche(sagasCache[id])) return sagasCache[id];
  const d = await tget(`/collection/${id}`);
  const img = (p, w) => p ? safeImg(TMDB_IMG + w + p) : null;
  const saga = {
    id, name: String(d.name || 'Saga'), overview: d.overview || null,
    poster: img(d.poster_path, 'w342'),
    parts: (d.parts || []).filter(p => idSaga(p.id)).map(p => ({
      id: p.id, title: String(p.title || ''), date: /^\d{4}-\d{2}-\d{2}$/.test(p.release_date || '') ? p.release_date : null,
      poster: img(p.poster_path, 'w185'),
    })).sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999')),
    at: nowISO(),
  };
  sagasCache[id] = saga;
  enregistrerSagas();
  return saga;
}
/* films de la bibliothèque par id TMDB, et sagas auxquelles ils appartiennent */
function sagasBibliotheque() {
  const parId = new Map(), ids = new Set();
  for (const m of state.movies) {
    const t = state.tmdb[m.uuid];
    if (!t || t.provider !== 'tmdb' || !t.id) continue;
    parId.set(t.id, m);
    if (t.collection && idSaga(t.collection.id)) ids.add(idSaga(t.collection.id));
  }
  return { parId, ids };
}
/* x films vus sur y sortis, prochain à voir (ordre de sortie), prochain à sortir */
function bilanSaga(saga, parId) {
  const auj = todayStr();
  const vu = p => { const m = parId.get(p.id); return !!(m && m.is_watched); };
  const sortis = saga.parts.filter(p => p.date && p.date <= auj);
  return {
    total: sortis.length,
    vus: sortis.filter(vu).length,
    prochain: sortis.find(p => !vu(p)) || null,
    aVenir: saga.parts.find(p => !p.date || p.date > auj) || null,
  };
}
const sagasTentees = new Set();
let sagasEnPreparation = false;
async function preparerSagas() {
  if (!tmdbKey() || sagasEnPreparation) return;
  sagasEnPreparation = true;
  const ici = () => state.tab === 'movies' && state.movieView === 'sagas';
  const maj = () => { if (ici()) rerenderSansPerturber(); };
  try {
    while (state.filmsMetaBusy) await sleep(500); // passe « À voir » en cours : on l'attend
    await backfillFilms(true, maj); // il faut savoir à quelle saga appartient chaque film
    const manquantes = [...sagasBibliotheque().ids].filter(id => !sagaFraiche(sagasCache[id]) && !sagasTentees.has(id));
    if (manquantes.length) {
      manquantes.forEach(id => sagasTentees.add(id));
      state.sagasBusy = { done: 0, total: manquantes.length };
      maj();
      await Promise.all(manquantes.map(id => poolFond(async () => {
        try { await chargerSaga(id); } catch (e) {}
        state.sagasBusy.done++;
        const el = $('#sagas-progress');
        if (el) el.textContent = `${state.sagasBusy.done}/${state.sagasBusy.total}`;
      })));
      state.sagasBusy = null;
      maj();
    }
  } finally { sagasEnPreparation = false; }
}

function viewSagas() {
  if (!tmdbKey()) return `<div class="hint"><span class="em">🎞️</span><p><b>Sagas :</b> cette vue utilise TMDB. Ajoute ta clé dans Profil → Clé API TMDB.</p></div>`;
  const { parId, ids } = sagasBibliotheque();
  const cartes = [];
  for (const id of ids) {
    const saga = sagasCache[id];
    if (!saga || saga.parts.length < 2) continue;
    const b = bilanSaga(saga, parId);
    if (b.total) cartes.push({ saga, b });
  }
  const parNom = (a, b) => nomSaga(a.saga.name).localeCompare(nomSaga(b.saga.name), 'fr', { sensitivity: 'base' });
  // les plus avancées d'abord : ce sont celles qu'on a envie de finir
  const aCompleter = cartes.filter(x => x.b.vus < x.b.total)
    .sort((a, b) => b.b.vus / b.b.total - a.b.vus / a.b.total || parNom(a, b));
  const completes = cartes.filter(x => x.b.vus === x.b.total).sort(parNom);
  const carte = ({ saga, b }) => {
    const pct = Math.round(b.vus / b.total * 100);
    return `<div class="scard" data-action="open-saga" data-id="${saga.id}">
      <div class="poster">${saga.poster ? `<img loading="lazy" src="${saga.poster}" alt="">` : esc(initials(nomSaga(saga.name)))}</div>
      <div class="mid">
        <div class="title">${esc(nomSaga(saga.name))}</div>
        <div class="progress ${pct === 100 ? 'full' : ''}"><i style="width:0" data-w="${pct}%"></i></div>
        <div class="sub" style="margin-top:5px">${b.vus}/${b.total} vus${b.prochain ? ` · Prochain : ${esc(b.prochain.title)}` : ' · ✓ complète'}</div>
        ${b.aVenir ? `<div class="sub">📅 ${esc(b.aVenir.title)} · ${b.aVenir.date ? compteARebours(b.aVenir.date) : 'annoncé'}</div>` : ''}
      </div>
    </div>`;
  };
  const occupe = state.filmsMetaBusy || state.sagasBusy;
  return `
    ${ligneAnalyseFilms()}
    ${state.sagasBusy ? `<p class="loadrow" style="padding:4px 0 12px"><span class="spin"></span> Chargement des sagas… <span id="sagas-progress">${state.sagasBusy.done}/${state.sagasBusy.total}</span></p>` : ''}
    <h2 class="section" style="margin-top:2px">À compléter <span class="cnt">${aCompleter.length}</span></h2>
    ${aCompleter.length ? `<div class="card-list">${aCompleter.map(carte).join('')}</div>`
      : occupe ? '' : `<div class="empty">${cartes.length ? 'Toutes tes sagas sont complètes ! 🎉' : 'Aucune saga trouvée dans tes films.'}</div>`}
    ${completes.length ? `<h2 class="section" style="margin-top:26px">Complètes ✓ <span class="cnt">${completes.length}</span></h2>
      <div class="card-list">${completes.map(carte).join('')}</div>` : ''}`;
}

  const pct = b.total ? Math.round(b.vus / b.total * 100) : 0;
  $('#modal-root').innerHTML = `

    <div class="modal" data-rr="${cle}">

        <div class="dmi">
          <h3>${esc(nomSaga(saga.name))}</h3>
          <div class="y">${pl(saga.parts.length, 'film')} · ${b.vus}/${b.total} vus</div>
          <div class="progress ${pct === 100 ? 'full' : ''}" style="max-width:160px"><i style="width:${pct}%"></i></div>

function viewMoviesWatchlist() {
  const mt = m => state.tmdb[m.uuid] || {};
  const tous = state.movies.filter(m => !m.is_watched);
  if (!tous.length) return `<div class="empty">Ta liste est vide — ajoute des films depuis l'onglet Explorer ! 🍿</div>`;
  // genres réellement présents dans la liste, du plus fréquent au plus rare
  const compte = {};
  for (const m of tous) for (const g of mt(m).genres || []) if (GENRE_NAMES[g]) compte[g] = (compte[g] || 0) + 1;
  const genresDispo = Object.entries(compte).sort((a, b) => b[1] - a[1]);
  const list = state.avGenre >= 0 ? tous.filter(m => (mt(m).genres || []).includes(state.avGenre)) : [...tous];
  const sortie = m => mt(m).release || (m.year ? String(m.year) : '');
  const duree = m => mt(m).runtime || 0;
  const t = state.avSort;
  if (t === 'az') list.sort((a, b) => a.title.localeCompare(b.title, 'fr', { sensitivity: 'base' }));
  else if (t === 'sortie') list.sort((a, b) => sortie(b).localeCompare(sortie(a)));
  else if (t === 'court') list.sort((a, b) => (duree(a) || 1e9) - (duree(b) || 1e9)); // durée inconnue à la fin
  else if (t === 'long') list.sort((a, b) => duree(b) - duree(a));
  else list.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
  // pas encore sortis : à part, du plus proche au plus lointain
  const auj = todayStr();
  const aVenir = list.filter(m => (mt(m).release || '') > auj).sort((a, b) => mt(a).release.localeCompare(mt(b).release));
  const dispo = list.filter(m => !aVenir.includes(m));
  // « Ce soir ? » : un film disponible tiré au hasard, gardé tant qu'il reste dans la liste
  let soir = dispo.find(m => m.uuid === ceSoirUuid);
  if (!soir && dispo.length) {
    const choix = dispo.length > 1 ? dispo.filter(m => m.uuid !== ceSoirEviter) : dispo;
    soir = choix[Math.floor(Math.random() * choix.length)];
    ceSoirUuid = soir.uuid;
  }
  return `
    ${soir ? carteCeSoir(soir, dispo.length > 1) : ''}
    <div class="fbar">
      ${selectFiltre('avsort', [['recent', 'Ajout récent'], ['az', 'A → Z'], ['sortie', 'Sortie ↓'], ['court', 'Plus courts'], ['long', 'Plus longs']], t, 'Trier')}
      ${selectFiltre('avgenre', [[-1, 'Tous genres'], ...genresDispo.map(([g, n]) => [g, `${GENRE_NAMES[g]} (${n})`])], state.avGenre, 'Genre')}
    </div>
    ${ligneAnalyseFilms()}
    ${teteSection(`À voir <span class="cnt">${dispo.length}</span>`, dispo.length ? `<span class="ftotal">≈ ${Math.round(dureeFilms(dispo) / 60)} h de films</span>` : '')}
    ${dispo.length
      ? `<div class="mgrid">${dispo.map(m => movieCard(m, true)).join('')}</div>`
      : `<div class="empty">${aVenir.length ? 'Rien de disponible pour l’instant.' : 'Aucun film ne correspond.'}</div>`}
    ${aVenir.length ? teteSection(`Pas encore sortis <span class="cnt">${aVenir.length}</span>`)
      + (aVenir.length === 1 ? carteBientotFilm(aVenir[0], true) : `<div class="hrow">${aVenir.map(m => carteBientotFilm(m)).join('')}</div>`) : ''}`;
}

/* « Ce soir ? » : grande carte d'un film de la liste, avec « Vu » et « Un autre » */
let ceSoirUuid = null, ceSoirEviter = null, ceSoirAnim = false;
function carteCeSoir(m, autre) {
  const mt = state.tmdb[m.uuid] || {}, fond = mt.backdrop || mt.posterBig || mt.poster;
  const genres = (mt.genres || []).map(g => GENRE_NAMES[g]).filter(Boolean).slice(0, 2).map((g, i) => i ? g.toLowerCase() : g);
  const infos = [m.year, mt.runtime ? fmtDuree(mt.runtime) : null, genres.join(', ')].filter(Boolean).join(' · ');
  const anim = ceSoirAnim ? ' maj' : '';
  ceSoirAnim = false;
  return `<div class="cesoir${anim}" data-action="open-movie" data-uuid="${m.uuid}">
    <div class="cesoir-img"${fond ? ` style="background-image:url('${fond}')"` : ''}></div>
    <div class="cesoir-txt">
      <span class="vtag"><i></i>Ce soir ?</span>
      <h3${m.title.length > 22 ? ' class="long"' : ''}>${esc(m.title)}</h3>
      ${infos ? `<div class="cesoir-m">${infos}</div>` : ''}
      <div class="cesoir-btns">
        <button class="btn" data-action="toggle-movie" data-uuid="${m.uuid}">${ICONS.check} Vu</button>
        ${autre ? `<button class="verre" data-action="ce-soir-autre">${ICONS.dice} Un autre</button>` : ''}

}

/* lot suivant de 60 cartes ajouté à la suite (pas de reconstruction ni de clignotement) */
function ajouterLotFilms() {
  const grille = $('#movies-grid'), pied = $('#movies-pied'), list = state._movieList;
  if (!grille || !pied || !list) { state.movieLimit += 60; render(); return; }
  const deja = grille.children.length;
  state.movieLimit = deja + 60;
  grille.insertAdjacentHTML('beforeend', list.slice(deja, state.movieLimit).map(m => movieCard(m)).join(''));

function viewMoviesGrid() {
  const f = state.movieFilter;
  const q = state.movieSearch.trim();
  let list = state.movies.filter(m => {
    if (q) return correspond(m.title, q);
    if (f === 'vus') return m.is_watched;
    if (f === 'avoir') return !m.is_watched;
    if (f === 'favoris') return m.is_favorite;
    return true;
  });
  // filtres genre / décennie (le genre vient des métadonnées TMDB)
  if (state.movieGenre >= 0) {
    const g = GENRES[state.movieGenre];
    list = list.filter(m => {
      const meta = state.tmdb[m.uuid];
      return meta && meta.genres && meta.genres.includes(g.mv);
    });
  }
  if (state.movieDecade !== 'all') {
    list = list.filter(m => {
      if (!m.year) return false;
      if (state.movieDecade === '2020') return m.year >= 2020;
      if (state.movieDecade === '2010') return m.year >= 2010 && m.year <= 2019;
      if (state.movieDecade === '2000') return m.year >= 2000 && m.year <= 2009;
      return m.year < 2000;
    });
  }
  // tri
  if (state.movieSort === 'az') list.sort((a, b) => a.title.localeCompare(b.title, 'fr'));
  else if (state.movieSort === 'annee') list.sort((a, b) => (b.year || 0) - (a.year || 0));
  else if (state.movieSort === 'annee-asc') list.sort((a, b) => (a.year || 9999) - (b.year || 9999));
  else list.sort((a, b) => (b.watched_at || b.created_at || '').localeCompare(a.watched_at || a.created_at || ''));

  state._movieTotal = list.length;
  state._movieList = list; // pour ajouter les lots suivants sans tout redessiner
  const shown = list.slice(0, state.movieLimit);
  const chips = [['vus', 'Vus'], ['favoris', 'Favoris'], ['tous', 'Tous']];
  const sel = (name, opts, val) => `<select class="fsel ${String(val) !== String(opts[0][0]) ? 'active' : ''}" data-f="${name}">
    ${opts.map(([v, l]) => `<option value="${v}" ${String(v) === String(val) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  return `
    <div class="searchbar">${ICONS.search}<input id="movie-search" placeholder="Rechercher dans mes films…" value="${esc(state.movieSearch)}"></div>
    <div class="chips">${chips.map(([k, l]) =>
      `<button class="chip ${f === k && !q ? 'on' : ''}" data-action="movie-filter" data-f="${k}">${l}</button>`).join('')}</div>
    <div class="fbar">
      ${sel('msort', [['recent', 'Récents'], ['az', 'A → Z'], ['annee', 'Année ↓'], ['annee-asc', 'Année ↑']], state.movieSort)}
      ${sel('mgenre', [[-1, 'Tous genres'], ...GENRES.map((g, i) => [i, g.label])], state.movieGenre)}
      ${sel('mdecade', [['all', 'Toutes années'], ['2020', '2020+'], ['2010', '2010-2019'], ['2000', '2000-2009'], ['old', 'Avant 2000']], state.movieDecade)}
    </div>
    ${shown.length
      ? `<div class="mgrid" id="movies-grid">${shown.map(m => movieCard(m)).join('')}</div>
         <div id="movies-pied">${piedFilms(shown.length, list.length)}</div>`
      : `<div class="empty">Aucun film ici.</div>`}`;
}
